에 집중하기로 정리했다. 물류(인덕션·소팅·토트피킹)·유통(계산 스캔·보충)·제조(공장 내 물류)가 우선이며 정밀도·제너럴라이제이션은 2029~2030으로 배치."},{"id":"dec-lw-002","class":"Decision","label":"자체 휴먼데이터 유상 수집 추진 및 비상업 데이터셋 대체","desc":"프리트레이닝에 필요한 일반 휴먼데이터가 모델에 빠져 있고 사내 수집만으로 부족해, 돈을 들여서라도 자체 독자 데이터를 빠르게 확보하고 상업화 불가 데이터셋을 대체하기로 했다."},{"id":"dec-lw-003","class":"Decision","label":"택배 인덕션 태스크 단기 최우선 확정","desc":"9월 마일스톤 달성을 목표로 모든 세부 연구 과제를 택배 처리 태스크 중심으로 재배치하기로 확정했다."},{"id":"dec-lw-004","class":"Decision","label":"태스크–벤치마크 매핑 및 노션 재정비","desc":"금주 내로 과제별 타겟 벤치마크·목표 지표(스피드/강건성)·산출물을 1:1 매핑해 정리하기로 했다."},{"id":"dec-lw-005","class":"Decision","label":"RealDex 1.1 커머셜 버전 릴리즈 추진","desc":"상업적 이용 가능 데이터 기반의 RealDex 1.1 상용화 버전을 우선 릴리즈하기로 했다."},{"id":"dec-lw-006","class":"Decision","label":"플랫폼 개발 후보 항목 분류·방향 확정(RRC/Infra 유지)","desc":"3.2.4·3.2.5·3.1.11 등 핵심 항목을 RRC/Infra 피처로 '유지'로 분류하고 연내 개발·내부 검증을 추진하기로 확정했다."},{"id":"dec-lw-007","class":"Decision","label":"CJ PoC용 플랫폼 P0 범위·H2 일정·오너십 확정","desc":"CJ대한통운 PoC 착수에 필요한 플랫폼 P0 범위, 2026 H2 일정, 팀별 오너십과 고객 커밋 가능 수준을 확정했다."},{"id":"dec-rf-001","class":"Decision","label":"1차 검증 Target을 곤지암 인덕션으로 설정","desc":"노지 대비 온도·속도 등 환경 통제가 상대적으로 가능한 곤지암 인덕션을 1차 검증 대상으로 확정했다."},{"id":"dec-rf-002","class":"Decision","label":"계약 대상을 Phase 1 / Page 1로 한정","desc":"실제 계약·수행 범위는 제안서상 Phase 1 / Page 1로 한정하고 Page 2~3은 Long-term Roadmap으로 분리한다."},{"id":"dec-rf-003","class":"Decision","label":"달력 표기 삭제 후 착수일 기준 Timeline으로 재작성","desc":"'7월~12월' 달력 표기가 12월 완료로 오인될 수 있어 삭제하고 착수일 기준 Timeline으로 재작성한다."},{"id":"dec-rf-004","class":"Decision","label":"모사환경 Test·Demo를 6개월 수행기간 내 포함","desc":"모사환경 Test 및 Demo 결과를 6개월 수행기간 안에 포함한다."},{"id":"dec-rf-005","class":"Decision","label":"Robot 기종을 계약상 미고정","desc":"Robot은 수단이므로 계약 Scope에서 특정 기종을 고정하지 않고 더 적합한 장비가 나오면 변경 가능하도록 한다."},{"id":"dec-rf-006","class":"Decision","label":"Phase 1 KPI는 속도·무중단 운영 우선, 성공률은 이후 추가","desc":"Phase 1에서는 속도·무중단 운영을 우선 안정화하고, 안정화 이후 성공률 지표를 추가하는 단계적 KPI 구조를 제안한다."},{"id":"dec-rf-007","class":"Decision","label":"Teleoperation 공동 진행은 RLWRLD 초기 Setup 이후로 배치","desc":"Human Data·Teleoperation 및 수요처 Engineer 공동 참여는 Timeline에 반영하되, Teleoperation 공동 진행은 RLWRLD 초기 Setup·자체 수집 경험 축적 이후로 배치한다."},{"id":"dec-rf-008","class":"Decision","label":"4개 지점 전수 촬영 확정","desc":"단일 지점 학습 후 이식 시 4회 재작업이 발생하므로 4개 지점을 사전 설계·전수 촬영해 스키마를 1회 확정한다."},{"id":"dec-rf-009","class":"Decision","label":"RX 착수 2개월 선행(2026년 11월) 제안","desc":"계약 6개월·대금·계약 원안을 유지하되 착수만 2개월 앞당겨 2026년 11월 준비/분석 착수 승인을 롯데에 요청한다."},{"id":"dec-rf-010","class":"Decision","label":"평가 단위를 FTE Performance KPI로 정의","desc":"평가 단위를 단일 태스크 성공률이 아니라 FTE Performance KPI(1일 담당 객실 수·검수 통과율·재작업률·8시간 생산량)로 설정한다."},{"id":"dec-rf-011","class":"Decision","label":"롯데HM을 RX 확장 채널 파트너로 재포지셔닝","desc":"롯데HM의 Asset lite 전략을 활용해 RX를 개별 호텔 납품이 아니라 HM의 신규 위탁 수주 무기이자 확장 채널로 재포지셔닝하는 것을 핵심 Takeaway로 제시했다."},{"id":"dec-rf-012","class":"Decision","label":"실제 End Customer 기반 공동 Use Case 검증 추진","desc":"양사는 과학 실험이 아닌 실제 고객이 존재하는 Use Case를 선정해 공동으로 협업 적합성을 검증하기로 방향을 맞췄다."},{"id":"dec-rf-013","class":"Decision","label":"RealMan 신제품 구체 스펙 확보","desc":"RLWRLD는 RealMan 신제품의 구체 스펙을 받기로 했다."},{"id":"dec-rf-014","class":"Decision","label":"차주 한국 방문 시 RLWRLD 초대 및 할인가 제품 공급","desc":"차주 RealMan 한국 방문 시 RLWRLD를 초대하고 할인된 가격으로 제품을 공급받기로 했다."},{"id":"dec-rf-015","class":"Decision","label":"Pricing을 Cost-plus가 아닌 Market-driven 논리로 설명","desc":"Model·Platform 가격을 원가+Margin이 아니라 Market Demand·대체 인력 Cost·경쟁·고객가치 기준으로 설명한다."},{"id":"dec-rf-016","class":"Decision","label":"국가별 매출 Mix는 가정·근거를 결과 숫자보다 먼저 제시","desc":"결과 Mix 숫자가 임의로 보이지 않도록 GDP·Target Industry 등 가정·근거를 앞에 배치하는 구조로 변경한다."},{"id":"dec-rf-017","class":"Decision","label":"Data Cost를 유형별로 구분하고 중복 계산 재검토","desc":"Data 비용을 외부 구매·내부/외주 수집·Synthetic/Augmentation·고객 Deployment 유입으로 구분하고 GPU·Headcount와 중복 계산 여부를 재검토한다."},{"id":"dec-rf-018","class":"Decision","label":"GPU Cost 구분 및 별도 Compute Economics 자료 작성","desc":"GPU Cost를 Training·Research/Experiment·Cloud Inference로 구분하고 Investor FAQ용 별도 Compute Economics 자료를 만든다."},{"id":"dec-rf-019","class":"Decision","label":"Headcount·OPEX·급여 확대 반영해 Gross Margin 재계산","desc":"Headcount·Deployment/Operation/AS Cost·급여 상승을 현실적으로 확대 반영해 Gross Margin을 다시 계산한다."},{"id":"dec-rf-020","class":"Decision","label":"Forecast를 이번 주 내 Investor 공개 가능 수준으로 완성","desc":"수정사항을 당일 밤까지 반영하고 이번 주 안에 공개 가능한 수준으로 Forecast를 완성한다."},{"id":"dec-rf-021","class":"Decision","label":"Series A 적정 조달액 재산정 (미결)","desc":"$100M 시나리오가 지나치게 낙관적이라는 지적에 따라 흑자 전까지 필요 총자금을 $100M~$300M 사이에서 재산정하기로 하되 합의 수치는 없다."},{"id":"dec-rf-022","class":"Decision","label":"Software Value Share 및 Robot당 Subscription Price 미결","desc":"Software가 전체 Value의 40~50%를 가져가는 가정과 Robot당 Subscription Price 수준을 시장 수용성 관점에서 재검토한다."},{"id":"dec-rf-023","class":"Decision","label":"SI Partner와 RLWRLD 간 Deployment·Operation·AS Scope/Cost 배분 미결","desc":"RLWRLD 부담 범위와 SI Partner 이전 Scope·Cost 배분을 확정하지 못하고 미결로 남겼다."},{"id":"dec-rf-024","class":"Decision","label":"마이너 업데이트 방향 = 데이터셋 필터링","desc":"이번 마이너 업데이트를 데이터셋 필터링으로 진행하기로 내부 잠정 결정했으며 최종 컨펌은 C레벨에서 나와야 한다."},{"id":"dec-rf-025","class":"Decision","label":"RLDX 커머셜 버전 제작을 핵심 목표·메시지로 설정","desc":"넌커머셜 데이터를 제거하고 커머셜 데이터로 학습해 RLDX 커머셜 버전을 만드는 것을 핵심 목표·메시지로 설정하고 성능은 기존 이상 유지한다."},{"id":"dec-rf-026","class":"Decision","label":"VQA·뉴럴 트래젝토리 생성은 이번 범위에서 제외","desc":"RLDX 1 방식 중 VQA·뉴럴 트래젝토리 생성은 이번 업데이트 범위에서 제외하고, 시뮬레이션 데이터는 기존 공개본을 활용하는 방안을 검토한다."},{"id":"dec-rf-027","class":"Decision","label":"벤치마크: 트레이닝 중간 Kitchen, 최종 RoboCasa 365","desc":"중간 테스트는 LIBERO Kitchen, 최종 평가는 RoboCasa 365를 사용하고 실로봇 테스트도 병행 검토한다."},{"id":"dec-rf-028","class":"Decision","label":"일정: 약 8주(2개월) 내 마무리 목표로 플래닝","desc":"각 작업을 범위 기준으로 잡아 약 8주 내 마무리를 목표로 플래닝한다."},{"id":"dec-rf-029","class":"Decision","label":"앞부분(목표·벤치마크)은 초반에 확정하고 진행","desc":"막판 고생을 줄이기 위해 목표·벤치마크 등 앞부분을 초반에 확정한 뒤 진행한다."},{"id":"dec-rf-030","class":"Decision","label":"국책과제-Account Lead 양방향 공유","desc":"국책과제 Team과 Account Team이 보유한 Lead를 양방향으로 공유하기로 했다."},{"id":"dec-rf-031","class":"Decision","label":"Account→국책 연결 원칙","desc":"Account Team은 자금여력은 낮지만 Task·Data·Line Access가 유의미하고 협조적인 기업을 국책과제 Team에 연결한다."},{"id":"dec-rf-032","class":"Decision","label":"국책→Account 연결 원칙","desc":"국책과제 Team은 Commercial 전환 가능성이 있는 대기업 Lead에 Account 담당자를 소개하고 Initial Meeting을 공동 진행한다."},{"id":"dec-rf-033","class":"Decision","label":"유상계약과 국책과제 Scope 분리","desc":"기존 유상계약과 국책과제는 Scope Conflict가 발생하지 않도록 원칙적으로 분리한다."},{"id":"dec-rf-034","class":"Decision","label":"AWS Marketplace Pre-sales 선행","desc":"AWS Marketplace 등록 완료를 기다리지 않고 관심 Account List 확보·Pre-sales를 선행한다."},{"id":"dec-rf-035","class":"Decision","label":"판매 가능한 Product Package 정의","desc":"Commercial License·Data POC·RRP 등 판매 가능한 Product Package를 빠르게 정의한다."},{"id":"dec-rf-036","class":"Decision","label":"Product Concept 8월 초 완료","desc":"Product Concept은 8월 초까지 완료를 목표로 진행한다."},{"id":"dec-rf-037","class":"Decision","label":"Base Product Cloud-independent 유지 + AWS Version 연동 검토","desc":"Base Product는 Cloud-independent하게 유지하고 AWS Marketplace Version에 AWS 기능을 연동하는 방향을 검토한다."},{"id":"dec-rf-038","class":"Decision","label":"매출 vs Reference/Mega POC 우선순위 재정렬(경영진 결정)","desc":"올해 핵심 Account와 내년 Mega Account 전략은 매출·Reference·R&D Resource Trade-off 전제로 재정렬이 필요하며 최종 우선순위는 경영진 결정으로 남긴다."},{"id":"dec-rf-039","class":"Decision","label":"검증 후보 Hardware를 2~4개 수준으로 압축","desc":"Business Requirement와 Technical Requirement를 함께 적용해 검증 대상 Hardware 후보를 2~4개 수준으로 좁힌다."},{"id":"dec-rf-040","class":"Decision","label":"중국 출장 Deliverable에 업체 List·구매·검증 계획 포함 및 실제 구매·검증 추진","desc":"중국 출장 산출물에 Humanoid/Hand 업체 List·구매/검증 대상·Test 항목을 포함하고 실제 구매·검증까지 추진한다."},{"id":"dec-rf-041","class":"Decision","label":"RealMan과 OEM/ODM 및 할인 구매·검증 가능성 추가 논의","desc":"다음 주 한국 방문 예정인 RealMan 관계자와 OEM/ODM 및 할인 구매·검증 가능성을 추가 논의한다."},{"id":"dec-rf-042","class":"Decision","label":"모델–비즈 방향 얼라인 및 국책 연계 후속 진행","desc":"워크샵 주제(B1~B4)의 진행 방향성에 대한 모델팀 의견을 듣고 국책과제·상품화 연계 방향을 얼라인했으며 상세 액션은 차주 확정한다."},{"id":"dec-rf-043","class":"Decision","label":"우선순위 KPI 4개 확정 및 모델팀 디플로이어블 기준과 통일","desc":"Speed·Atomic Skill·Precision·Task Generalization을 전사 공통 우선순위 KPI로 확정하고 모델팀 디플로이어블 4대 기준과 통일한다."},{"id":"dec-rf-044","class":"Decision","label":"CJ 태스크 패스트포워드 PoC를 RD가 직접 즉시 착수","desc":"Speed 단기 대응으로 패스트포워드/업스케일 Immediate Measure를 병행하고 CJ대한통운 태스크는 RD가 배속 리플레이 학습 PoC에 직접 즉시 착수한다."},{"id":"dec-rf-045","class":"Decision","label":"고속 동작 데이터 확보 플랜 확정(준원/제랄드) + CTO 리뷰","desc":"고속 동작 데이터 확보 플랜(Enabler 3종 + 오너·마일스톤)은 준원/제랄드가 확정하고 CTO 리뷰를 거친다."},{"id":"dec-rf-046","class":"Decision","label":"데이터 레시피 정의를 데이터 구매·수집 하드웨어 결정의 선행 조건으로 지정","desc":"데이터 레시피 정의(7월 말 1차)가 데이터 구매·수집 하드웨어 결정의 선행 조건이며 실제 결정은 7월 말 휴먼 데이터 논의 시점으로 미룬다."},{"id":"dec-rf-047","class":"Decision","label":"Recipe/효율화 이니셔티브 한 판 통합 관리(준원/데이빗/레넌)","desc":"팀·랩에 산발된 데이터 레시피/효율화 이니셔티브를 하나의 통합 뷰로 관리한다."},{"id":"dec-rf-048","class":"Decision","label":"연구 공백 영역 분류 처리 및 서브그룹 마일스톤 관리","desc":"연구 공백 영역은 내부 착수/VLab 배정/의도적 공백으로 분류해 처리하고 서브그룹 산출물은 마일스톤 체계로 관리한다."},{"id":"dec-rf-049","class":"Decision","label":"시뮬레이션 평가·증강용 포지션 유지, 대규모 데이터 생산은 별도 의사결정","desc":"시뮬레이션은 평가·증강용 포지션을 유지하고 대규모 데이터 생산 포지셔닝은 별도 의사결정으로 남긴다."},{"id":"dec-rf-050","class":"Decision","label":"Evaluation 모델 판단 방식을 VLM vision → RLDX feature 기반으로 전환","desc":"task 진행률·성공/실패 판정 Evaluation 모델에서 VLM vision-only 판단의 latency 이슈로 RLDX backbone이 action head에 넘기는 feature를 받아 판단하는 방식으로 전환했다."},{"id":"dec-rf-051","class":"Decision","label":"정밀도보다 속도·배포성 우선 및 새 임바디먼트 탐색으로 전략 전환","desc":"28년 조기 배포를 위해 정밀도를 일부 희생하더라도 속도·배포성을 우선하고 단순 그리퍼·암 등 배포 가능한 새 임바디먼트를 탐색한다."},{"id":"dec-rf-052","class":"Decision","label":"Amit(NVIDIA HQ)과 월간 정기 콜 운영 합의","desc":"NVIDIA 본사 Amit Goel과 월 1회 정기 콜을 진행하기로 합의했고 일정 조율이 진행 중이다."},{"id":"dec-rf-053","class":"Decision","label":"AWS US Physical AI 로드쇼 5개 도시 참가 확정","desc":"시카고(8/11)·보스턴(8/13)·마운틴뷰(8/20)·디트로이트(9/10)·시애틀(10/6) 로드쇼에 실제 로봇 데모로 참가 승인, 하드웨어 물류 외 비용 부담 없음."},{"id":"dec-rf-054","class":"Decision","label":"로드쇼 라이브 데모 시나리오를 Scenario 1(any object grasping)로 확정","desc":"산업 관련 객체를 사용해 속도·유창성을 극대화하는 Scenario 1로 진행하고, Scenario 2(박스/비닐봉투 정렬)는 자연스러움·속도 우려로 채택하지 않았다."},{"id":"dec-rf-055","class":"Decision","label":"AWS FRK/First Call Deck에 DexBench 승인 고객 사례 사용","desc":"AWS co-GTM 세일즈 자료에 대한통운(물류)·롯데호텔(호텔)·후지·KCCS를 고객 사례로 사용한다."},{"id":"dec-rf-056","class":"Decision","label":"AWS와 NDA 체결 필요성 확인","desc":"AWS가 RLWRLD 세일즈 자료를 직접 작성하는 맥락상 기존 NDA 기록이 없어 신규 NDA 체결이 필요하다고 결론지었다."},{"id":"dec-rf-057","class":"Decision","label":"WIRobotics(ALLEX) 로드쇼 공동 전시 보류 — 자사 Y1 데모 집중","desc":"장기 배포 파트너 확신 부족·제품팀 리소스 부담으로 ALLEX 공동 데모는 추진하지 않고 자사 Y1 데모에 집중, ALLEX가 이미 참석하는 경우만 재논의한다."},{"id":"dec-rf-058","class":"Decision","label":"Rainbow Robotics, 시카고 구간만 로봇 대여·현장 지원 확정","desc":"Rainbow Robotics는 시카고(8/11)에서만 RB-Y1 1대 대여·현장 엔지니어·사전 테스트를 지원하며 디트로이트 이후는 지원 불가, 이후 구간은 자체 RB-Y1 운송이 필요하다."},{"id":"dec-rf-059","class":"Decision","label":"RD·강욱은 SF 생략하고 시카고 직행, 미국 팀이 현지 물류 주도","desc":"데모용 데이터 사전 학습 시간을 최대화하기 위해 RD·강욱은 마지막 날까지 학습에 집중 후 SF를 건너뛰고 시카고로 직행하며 현지 물류는 미국 팀이 주도한다."},{"id":"dec-rf-060","class":"Decision","label":"Frontier/Impact 데모 시나리오로 DB-L1 Conveyor Pick 확정","desc":"Figure 물류 데모 형태의 DB-L1 Conveyor Pick을 시나리오로 고정하고 물체 종류를 다양화하며 현장 Edge Case(포장 파손 시 별도 Path)를 추가한다."},{"id":"dec-rf-061","class":"Decision","label":"BMW 데모 업데이트 버전 진행","desc":"기존 BMW 데모에서 객체를 BMW가 민감하지 않도록 변형해 같은 조립 데모를 시연하는 업데이트 버전으로 진행한다."},{"id":"dec-rf-062","class":"Decision","label":"CJ대한통운 데모 객체 10개 SKU 합의","desc":"CJ대한통운 진행 시 10개 SKU(박스 5 + 파우치 5)로 진행하기로 협의했고, 박스 파손 시 라인 제외해 별도 처리한다."},{"id":"dec-rf-063","class":"Decision","label":"Sales·Fundraising용 Video Demo 제작, 9/15 완성 목표","desc":"Sales·Fundraising을 위한 Video Demo를 상정하고 시나리오는 실제 진행해야 하는 POC 시나리오로 설정, 9/15 완성을 목표로 한다."},{"id":"dec-rf-064","class":"Decision","label":"2030년 매출 10억 달러 목표 설정","desc":"2030년까지 연 매출 10억 달러 이상 달성을 목표로 설정하고 IR덱에 2030~2035년의 과감·현실적 로드맵을 제시한다."},{"id":"dec-rf-065","class":"Decision","label":"IR덱을 실리콘밸리 스타일로 재구성하고 앞부분에 성과·기술 노하우 강조","desc":"단순 번역에서 벗어나 실리콘밸리 스타일 디자인·워딩으로 재구성하고 앞부분에 회사 성과와 30여 가지 기술 노하우를 담는다."},{"id":"dec-rf-066","class":"Decision","label":"RX와 POC 계약 분리 — RX 선행 후 POC 확장","desc":"RX와 POC를 묶지 않고 RX를 먼저 시작해 성과 입증 후 POC로 확장하며 이마트도 계약을 쪼개 단계적으로 진행하는 방안을 검토했다."},{"id":"dec-rf-067","class":"Decision","label":"2028년 첫 상업화 — 러프 성능 우선, 고정밀 단계적 고도화","desc":"2028년 첫 상업화를 목표로 초기에는 속도·환경 적응력 등 러프 성능을 먼저 확보하고 고정밀 작업은 단계적으로 고도화한다."},{"id":"dec-rf-068","class":"Decision","label":"원격조작 데이터 수집 장비를 Manus 장갑 대신 VIVE 등으로 전환 검토","desc":"학습 데이터 질·텔레오퍼레이션 속도/정밀도 개선을 위해 Manus 장갑 대신 VIVE 등 더 정확한 장비로 팔·손 움직임을 캡처하는 방안을 논의했다."},{"id":"dec-rf-069","class":"Decision","label":"일본 시장 하드웨어 포함 사업 및 양산 체계 협력 검토","desc":"일본은 하드웨어 보유가 빠른 진입의 열쇠가 될 수 있어 마진율이 낮더라도 하드웨어 포함 사업을 고려하고 장기 양산 체계를 위해 협력·브랜딩 전략을 세운다."},{"id":"dec-rf-070","class":"Decision","label":"정부 지원 사업 활용해 상업화 이전 공백·매출 확보","desc":"관광공사 바우처·서비스 로봇 도입 등 정부 지원 프로젝트를 활용해 2028년 완전 상업화 이전의 공백을 메우고 실전 경험·매출원을 확보한다."},{"id":"dec-slk-001","class":"Decision","label":"BMW Next PoC 확정 및 PoT(Proof of Technology)로 명칭 변경","desc":"BMW Next PoC가 확정되어 PoT로 명칭을 변경하고 RLDX-1 기반 E2E VLA로 기존 PoC와 동일하게 진행하기로 함. BMW 본부장 요청으로 개발 기간을 단축(중간결과 2월/최종 4~5월, 기존 최종 6월)하고, 견적서 작업에 착수해 8월 초 계약 체결을 목표로 함. 성공기준은 계약서에 미명시하고 연말에 양측 합의로 확정하는 방향을 제안."},{"id":"dec-slk-002","class":"Decision","label":"Honda 생산기술본부 Next Phase PoC 진행 합의","desc":"토치기현 혼다 워크샵 및 사륜차 생산기술부장(임원) 대면 미팅 결과, 어떤 공정을 physical AI로 자동화할지 혼다 내부 논의 후 next phase PoC를 진행하기로 함. 혼다 사내 PoC 추진 검토→대상 공정 압축→RLWRLD와 진행 방식·일정 상담→사내 정식 제안 순으로 진행 예정(대기업 특성상 1~2개월 소요 전망)."},{"id":"dec-slk-003","class":"Decision","label":"KDDI 경유 일본 총무성 국책과제 내정 및 계약 체결 예정","desc":"KDDI를 통해 일본 총무성 국책과제(1천만엔)에 내정. 계약은 KDDI와 7월말~8월 사이 체결 예정이며 매출 1천만엔 발생. 진행 중인 경제산업성 과제와 동일 TASK를 수행하고 파인튜닝은 8월부터 시작 예정."},{"id":"dec-slk-004","class":"Decision","label":"LG이노텍 MOU 잠정 보류(Holding)","desc":"LG이노텍 부문장(민존 CTO) 지시로 예정됐던 리얼월드와의 MOU가 잠정 보류됨. 부문장이 외부 검증 결과 대신 RFM 구조를 직접 분해해 리얼월드 모델이어야 하는 논리적 근거를 분석하라고 챌린지. 대응으로 LG이노텍 실무진은 타사 모델 비교 분석을 진행하고, NVIDIA 표준화 협력 세션은 MOU 성사와 무관하게 7월 2~3주차부터 정상 진행하기로 조율. 리얼월드는 신진우 교수 직접 미팅 및 NVIDIA Andy 지원사격 등 전문가 카드로 대응."},{"id":"dec-slk-005","class":"Decision","label":"LG이노텍 MOU 체결식(대면 서명+PR 보도) 진행 결정","desc":"LG이노텍과 MOU를 단순 체결이 아니라 상호 만나 서명·날인하는 체결식 이벤트와 미디어 보도를 함께 진행하기로 하고, 6월 8~9일 중 체결식을 진행하는 것이 가장 좋다고 합의. 이후 이노텍 홍보팀 요청으로 PR 보도는 8월 2주차로 조율 논의됨."},{"id":"dec-slk-006","class":"Decision","label":"LG CNS 제안 Phase 구분(1차 Tele Op 데이터수집+HW+라이센스, Human data는 Phase2)","desc":"LG CNS 견적을 1차에는 Tele Op 기준 데이터 수집 및 환경구축 HW 판매(로봇 및 수집장비) + RRC/RLDX-1 라이센스 비용을 포함해 제안하고, Human data 수집 방법론·장비는 내부 정리가 더 필요하므로 이번 제안에서 제외하고 Phase2로 명시하기로 함."},{"id":"dec-slk-007","class":"Decision","label":"농심엔지니어링 안양공장 방문 및 차기 미팅 6월 중 확정","desc":"농심측 프로젝트 방향·기간이 리얼월드와 잘 얼라인됨을 확인하고, RX팀과 함께 메인 생산 테스트베드인 안양공장을 방문해 핵심 태스크(비닐 개봉, 불량 선별 등) 현장 확인 및 니즈 청취를 진행하기로 협의. 현장 방문·세부 일정 조율 차기 미팅을 6월 중으로 진행하기로 확정."},{"id":"dec-slk-008","class":"Decision","label":"CJ대한통운 RX/Data 파트너십 1차 계약 범위 합의","desc":"CJ대한통운과 1차 계약 범위를 오네(택배) 사업부의 MP 인덕션 분류 작업에 집중(FT 사업부 피킹·포장은 제외)하기로 하고, 6개월 프로젝트로 간단한 공정 조건에서의 현장 PoC를 목표로 합의. RX 현장 진단과 데이터 파트너십(수집·학습·PoC 검증)을 단일 계약으로 포괄 추진하고, 실제 현장 조업 테스트 수준의 PoC를 지향. 6월 내 계약 마무리 추진."},{"id":"dec-slk-009","class":"Decision","label":"르네사스 협업/컨설팅 프로젝트 진행 결정","desc":"일본 반도체 대기업 르네사스와 ①공장내 Data+PoC, ②MCU+NPU 기반 협업 컨설팅을 진행하기로 함. 기존 리포트 구매(800~900만엔, 이번달 즉시 통과 가능)와 7월말까지 주 1회 정례미팅 형태로 착수하며, 향후 오이타공장 연계 통합 pricing 1억~1.5억 가능. 리더십(중희)도 삼성전자 NPU 투자 논의 맥락에서 NPU 회사들과 적극 추진하라고 지시."},{"id":"dec-slk-010","class":"Decision","label":"AWS APN 가입 및 ISVA 파트너 등급 취득 추진","desc":"AWS APN(Partner Network) 가입 및 상위 등급 ISVA 파트너 취득을 위해 AWS Marketplace에 리얼월드 Opportunity 15건을 등록하고 Qualified 여부 확인 절차를 진행. 각 Account별 AWS AM Consent 확보를 위해 고객사 카운터파트 정보를 정리하기로 함."},{"id":"dec-slk-011","class":"Decision","label":"APTO 파트너십: 공동 PoC 1건 우선 진행, MOU는 이후 검토","desc":"일본 데이터 수집 플레이어 APTO에 대해, 적합한 파트너인지 판단이 어려운 상황이라 우선 APTO가 제안하는 공동 PoC 1건을 진행하며 영업력·파인튜닝 능력을 가늠한 후 다음 단계를 결정하기로 함. APTO가 강하게 원하는 MOU 체결은 시리즈 A 도움 여부 확인 후 결정하되, 도움이 안 되면 공동 PoC 이후로 미루는 방향."},{"id":"dec-slk-012","class":"Decision","label":"LG이노텍(LGIT) 딜에 리서처 리소스 투입 지원 결정","desc":"미팅에서 중희가 LGIT 건은 리얼월드 리서처 리소스를 투입해서라도 성공률이 잘 나오도록 영업 비용 관점에서 지원하자는 방향을 제시. 신진우 교수·스톰과 미팅을 어레인지해 접근 방향을 논의하기로 하되, 전담 인력 배정·지원 방식은 신교수 피드백 후 별도 논의 예정."},{"id":"dec-slk-013","class":"Decision","label":"자동차 과제 용역 MOU 금액·역할 확정 (총 8천만원)","desc":"자동차 과제 용역 MOU를 총 8천만원(2·3·4차년도 각각 3천·3천·2천만원)으로 확정. 역할은 모델 제공 및 기술지원(질의응답), 수집 데이터 피드백, 재학습 모델 제공. MOU 초안 수령(차주 수)·전달(차주 금) 일정 확정."},{"id":"dec-slk-014","class":"Decision","label":"Compass 국책과제 예산 배분 확정 (인건비 6.4억 / 연구활동비·GPU 1.6억)","desc":"PM 확인 결과 전체 민간부담금 16억의 40% 현물이 인건비로 가능하여, 6.4억을 인건비로 잡고 나머지 1.6억은 연구활동비 및 GPU 임차 비용으로 편성하기로 확정."},{"id":"dec-slk-015","class":"Decision","label":"LG이노텍 MOU 체결 추진 (체결식 준비)","desc":"LG이노텍과의 MOU 체결식을 진행하기로 하여, 이사 예정 신규 오피스에서 체결식 장소 및 현수막 사이즈를 확정하기로 함."},{"id":"dec-slk-016","class":"Decision","label":"M.AX(제조 인공지능 전환) 얼라이언스 가입 신청 진행","desc":"제조 인공지능 전환(M.AX) 얼라이언스 가입신청서를 작성해 가입을 진행하기로 함."},{"id":"dec-slk-017","class":"Decision","label":"사업계획(PL Projection) 수립 담당자·일정 확정","desc":"미국·일본·한국 시장별 사업계획 담당자 선정(미국 Carl, 한국 Victoria), PoC는 Victoria·RX는 용재-Victoria 협의로 수립. PL 모델 1차 정렬 6/29, 최종 7/10, Finance 팀 초안 6/30·확정 7/10로 일정 확정."},{"id":"dec-slk-018","class":"Decision","label":"산업부 AI 응용제품 신속 상용화 과제, ARA와 진행 방향","desc":"산업부 AI 응용제품 신속 상용화(글러브·agent) 2차 공고 대응으로, 한자연에 품목요구서(암묵지 1장)와 AI agent 과제향 1장을 작성·제출하되 딥핑소스 역할을 줄여 ARA와 협업 가능하도록 정리. 세부 금액·요건은 스레드에서 후속 조정."},{"id":"dec-slk-019","class":"Decision","label":"25자유도 핸드 과제 드랍 (테솔로·위로보틱스 불참)","desc":"테솔로·위로보틱스가 불참하면서 25자유도 핸드 과제를 드랍하기로 정리(HK 싱크 안건)."},{"id":"dec-slk-020","class":"Decision","label":"경남 국책과제 스코프 정의 (LAM 비정형 작업)","desc":"경남 과제에서 리얼월드는 사출·선반 정보를 다루는 모델을 만드는 것이 아니라 LAM 영역의 비정형 작업 수행으로 스코프를 정의. 메가존 과제에서 전체 기계를 다루지 않음이 드러나도록 정리."},{"id":"dec-slk-021","class":"Decision","label":"BPS Weekly 정례 일정 변경 (매주 수요일 10:30)","desc":"BPS Weekly 정례 회의 일정을 이번 주부터 매주 수요일 오전 10:30으로 변경 확정."},{"id":"dec-slk-022","class":"Decision","label":"KCCS 파트너십, 비구속 MOU 기반 단계적 협력 프레임워크로 추진","desc":"KCCS/Kyocera가 요구한 구조화된 파트너십 정렬에 대응해, 비구속(Non-Binding) MOU v1.0 초안을 준비하고 KCCS를 물류 워크플로우에 VLA 로보틱스를 임베딩하는 시스템 인테그레이터(SI)로 포지셔닝하는 단계적 협력 프레임워크로 진행하기로 방향을 잡음. 초안은 RLWRLD에 유리/보호적으로 설계했고, 3/6 내부 논의 후 다음 주 초까지 첫 외부 draft를 공유하는 것을 목표로 함."},{"id":"dec-slk-023","class":"Decision","label":"KCCS MOU 데이터/IP 소유권 원칙 합의(raw=고객, 가공=RLWRLD)","desc":"제품팀(HK) 논의를 반영해 MOU의 데이터/IP 소유권 원칙을 정리: 원칙적으로 raw 데이터는 고객 소유, 가공(processed) 데이터는 사업적 필요에 따라 RLWRLD 소유로 하되, RLWRLD는 raw를 포함한 모든 수집 데이터에 대한 사용권/접근권을 반드시 보유. annotation·neural trajectory 등 기술 비중이 높은 일부 가공 데이터는 in-house로만 보유. 문서상 '2차 저작물'의 IP 언급과 유료 계약/서비스로서의 데이터 수집 표현은 회피(데이터 소유권 주장 약화 방지), 대신 '연구 협력 결과 공유'로 표현."},{"id":"dec-slk-024","class":"Decision","label":"Hitachi Systems RX/RD/PoC, 2026년 4월 신회계연도부터 1년간 추진","desc":"Hitachi Systems는 회계연도 종료(2026년 3월 말)까지 전담 인력 배정이 어려워, RX/RD/PoC 이니셔티브를 2026년 4월 신회계연도 시작 시점부터 1년간 검토·추진하기로 함. RX/PoC 장소는 Hitachi Systems에 국한하지 않고 Hitachi 그룹 내에서 적합 사이트를 탐색해 결정하기로 함."},{"id":"dec-slk-025","class":"Decision","label":"KCCS PoC 3종 계약·가격 확정 (JPY 20M)","desc":"KCCS(교세라 커뮤니케이션 시스템즈) 나가레야마 물류창고 3개월 온사이트 PoC의 3종 계약(기본거래+시스템개발+개별계약)이 지급조건 포함 전부 합의됨. 총액 JPY 2,000만, 50/50 분할(작업착수 확인 시 일부, 온사이트 납품·검사 시 잔액), PO 목표 6/30, 온사이트 킥오프 ~7/6."},{"id":"dec-slk-026","class":"Decision","label":"Ryoyo Ryosan 비구속 MOU 무수정 체결 결정","desc":"일본 tier-1 NVIDIA 유통사 Ryoyo Ryosan이 내부 법무·사업 검토 후 현재 비구속 MOU 초안을 레드라인 없이 그대로 서명하기로 함. RLDX·RRC를 Ryoyo 오퍼링에 추가하는 Co-GTM 및 공동 보도자료 추진에 합의."},{"id":"dec-slk-027","class":"Decision","label":"Macnica 파트너십 진행 방향·비즈니스 모델 합의","desc":"또 다른 tier-1 NVIDIA 유통사 Macnica와 NDA → 2단 MOU(장기 일본 Physical-AI 파트너십 + 3개월 공동 데모 구축) → 신요코하마 로봇검증센터 공동 데모 순으로 진행하기로 합의. 비즈니스 모델은 RLWRLD=SW 구독, Macnica=HW+배포 후 서비스로 정렬(Ryoyo와 동일)."},{"id":"dec-slk-028","class":"Decision","label":"APTO 비구속 MOU 프레임워크 합의","desc":"데이터 중심 AI 기업 APTO(RLWRLD K.K.)와 비구속 MOU 협의. RLDX-1 + RRC + APTO 데이터 수집/파인튜닝을 결합한 4단계 프레임워크로 협업하기로 함. 첫 유스케이스는 ~2026년 8월 착수, 상업 확장은 2027년 하반기 이후."},{"id":"dec-slk-029","class":"Decision","label":"농심 공장 로봇화 PoC 팔레타이징 최우선 과제 선정","desc":"농심 스마트팩토리팀과의 공장 로봇화 PoC에서 후보 작업 6가지 중 팔레타이징을 최우선 과제로 선정. 안양공장을 테스트베드로 지정하고 국내 계열공장·해외(아메리카) 공장까지 확대 검토."},{"id":"dec-slk-030","class":"Decision","label":"Toyota Systems 협업 구조 확정 (TS=인테그레이터, RLWRLD=기술/VLA)","desc":"Toyota Systems(TS)가 Toyota Motor(TMC) 대상 인테그레이터/창구 역할을 맡아 제안·배포·현장지원을 소유하고, RLWRLD는 기술/VLA 레이어에 집중하는 구조로 정렬. PoC를 첫 프로젝트로 진행. 타깃 과제 2개(양팔 VLA 고무코드 풀기, ~60cm 자동차 수지부품 빈피킹) 선정."},{"id":"dec-slk-031","class":"Decision","label":"Mitsui 협업 zero-base 재설정 결정","desc":"강욱(CEO)이 미쓰이가 공유한 Deck의 기존 PoC 예산안을 그대로 받지 말고, 미쓰이 협업을 zero base에서 재설정해 협업 범위·타깃 PoC·프라이싱을 새로 논의하기로 지시. Finetune 협업은 LG이노텍/LG CNS 진행건과 긴밀히 논의하며 진행."},{"id":"dec-slk-032","class":"Decision","label":"이마트·CJ대한통운 논의 가속화 우선순위 결정","desc":"강욱(CEO)이 이마트와 CJ대한통운 논의를 가속화하기로 결정하고, 관련 담당자들에게 금주 중 상황 논의 및 빠른 next step 진행을 지시."},{"id":"dec-slk-033","class":"Decision","label":"AWS를 KCCS 프로젝트에 투입하지 않고 케이스 스터디로만 활용 합의","desc":"AWS Japan과의 협의에서, 이미 상당히 진행된 KCCS 프로젝트에는 AWS를 투입하지 않고(디스럽션 리스크) 익명화된 케이스 스터디로만 활용하며 향후 다른 프로젝트에 AWS를 도입하기로 합의. 파트너 후보로 SCSK를 최우선(top pick)으로 두고 Okamoto팀이 AWS 내부 정렬 후 3자 딜 구조 스케치를 공유하기로 함."},{"id":"dec-slk-034","class":"Decision","label":"DSTA 제안서 패키지 방향 결정 (LG CNS 모델 준용)","desc":"DSTA(드론 생산 및 위험물 처리 유스케이스) 대상 제안서를 LG CNS 케이스와 마찬가지로 HW & Arm - RRC - finetuning 패키지를 메인으로 제안하기로 함. NDA 체결(DSTA측 버전 공유 예정) 후 작업영상 공유·태스크 타임라인 수립, 선호 핸드/암 조합 공유 및 제안서 작성."},{"id":"dec-slk-035","class":"Decision","label":"KDDI Data PoC 보류","desc":"KDDI 포트폴리오 중 Data PoC를 보류(on hold). KDDI 리소스가 국책과제에 묶여 있는 것이 사유. AIRoA RB-Y1 공급은 협상 중(9월 2대, 연말 ~50대), METI/NEDO GENIAC(10월'26~9월'27, ~JPY 50M, 채택 결정 9월 중순), MIC WattBit(~JPY 50M, 채택 7월 중순) 진행. BD 리드는 Hoon→Jihoon으로 전환."},{"id":"dec-slk-036","class":"Decision","label":"ICML Robotics Night 개최 (7/8 사옥 이전 기념 리서처 초대 행사)","desc":"ICML(서울 개최)을 계기로 7/8 사옥 이전 기념 리서처 초대 행사를 개최하기로 함. 데모 부스 대신 리서치 커뮤니티 침투·채용 활용을 목적으로 하고, rlwrld.co human-memorizable 단축링크 대시보드(/icml 등)와 라이브 데모로 운영. 6/15 In-N-Out 시점 ~23명 등록(ICML 저자 콜드메일 40명 중 ~10명 + 알음알음)."},{"id":"dec-slk-037","class":"Decision","label":"일본 시장 단계적 진입 전략 (RRC + RDX one)","desc":"일본 시장은 on-site 고성능보다 PoC 키트·플랫폼 try-out 수요가 중심이고, RLWRLD가 일본에서 physical AI on-site PoC를 제공하는 사실상 유일한 플레이어라는 판단 하에, RRC + RDX one으로 단계적으로 진입하는 방향을 설정."},{"id":"dec-slk-038","class":"Decision","label":"롯데호텔 PoC 프라이싱 합의 완료 및 계약 구조 확정","desc":"롯데호텔 PoC 프라이싱 합의가 완료되어 계약서 초안 검토에 진입했고, 6개월마다 갱신하는 구조로 논의 확정. 각 구간별 task 성공기준을 DX팀+집행부서 참관 하에 검수 후 대금이 지급되는 형태."},{"id":"dec-slk-039","class":"Decision","label":"첫 6개월 계약기간 50개 task 데이터 수집 계획 확정","desc":"첫 계약기간 6개월 동안 수행할 50개 task(객실 정비 중심) 데이터 수집 계획 수립을 완료하고 최종 확정. 데이터 수집이 안정화 단계에 진입했다고 판단."},{"id":"dec-slk-040","class":"Decision","label":"티스푼 배치 task를 Phase 1 스코프에서 제외","desc":"'티박스 티스푼 배치' task는 티스푼 두께가 얇아 Wuji 핀치가 잘 안 되고 억지 시도 시 고장을 유발하여 Phase 1 스코프에서 제외. 비즈니스 측(용재)도 'Phase 1 1개 task 조정 가능'으로 승인."},{"id":"dec-slk-041","class":"Decision","label":"3D Scan 기반 neural trajectory를 롯데 전달 결과물에서 제외","desc":"RD-RX 미팅 피드백 반영 결과, 3D Scan 기반 neural trajectory는 롯데에 전달할 결과물에서 제외하기로 결정. 3D Scan 결과물의 별도 활용 방안은 구체화 예정."},{"id":"dec-slk-042","class":"Decision","label":"롯데 전담 파일럿 추가 채용 확정","desc":"파일럿/GPU PC 부족으로 병렬 데이터 수집이 어려운 blocker 해소를 위해 롯데 전담 파일럿 추가 채용을 진행, 1명 채용 통보 완료(5/28 출근). 이후 전담 파일럿 2명 신규 입사 및 온보딩 완료."},{"id":"dec-slk-043","class":"Decision","label":"GR00T를 메인 모델로 진행","desc":"물컵 task 인퍼런스 비교(gr00t 1.5 70% vs RLDX 50%) 결과 gr00t를 메인 모델로 진행하기로 결정. 추가 데이터는 컵의 입 닿는 부분을 파지하지 않도록 수집 예정."},{"id":"dec-slk-044","class":"Decision","label":"Wuji 반복 고장으로 메인 핸드 HW를 Xhand로 교체","desc":"Wuji 하드웨어의 반복적인 고장(역구동성 부재로 파지 시 무리·양손 고장 빈발)으로 인해 롯데 데이터 수집 메인 핸드를 Xhand로 교체하기로 결정. Xhand는 Phase 1 텔레옵 수집에 문제없음을 사전 테스트로 확인, tactile 수집 upside도 존재."},{"id":"dec-slk-045","class":"Decision","label":"LG이노텍과 Non-binding broad MOU 체결 방침 확정","desc":"5/13 미팅 후 CTO 보고까지 완료하며, 이노텍(HW)과 RLWRLD(SW)의 상호보완 구조를 전제로 우선 Non-binding·broad 형태의 MOU를 먼저 체결하고 초기 MOU를 RLWRLD 런칭 행사에서 공고하기로 결정. 비즈니스 모델은 HW 개선 협업 + Co-GTM(양사 고객 풀 상호 활용)으로 합의."},{"id":"dec-slk-046","class":"Decision","label":"이노텍 제출 견적 약 12억 규모로 산출 및 인건비 표현 재정의","desc":"이노텍 제출용 견적을 약 12억원(11.95억) 규모로 확정: PoC 및 기술전수 약 8.9억, CES 협업 3.75억. 기존 'POC 직접 인건비'로 표현한 항목을 IP 영역임을 강조하기 위해 '전문기술서비스 및 지식자산 활용비'로 변경."},{"id":"dec-slk-047","class":"Decision","label":"PoC는 7DoF 불가, 자체 핸드로 진행 결정","desc":"6/17 내부 확정: LGIT 제공 7DoF 핸드는 자유도가 낮고 파지 속도(1.5초)가 느려 dexterous task·데이터 수집에 부적합하다고 판단, PoC는 7DoF로 불가하며 wuji/tesollo/Xhand 중 자체 핸드로 진행하기로 함(최종 스펙은 Product 15DoF 주장, Biz가 LGIT 개발속도에 맞춰 결정). 그러나 이후 6/29~6/30 MOU 협업 로드맵에서 이노텍 기 전달 7DoF 핸즈로 9월 1차 데모를 하고 13DoF 개선품으로 CES 최종 데모를 하기로 정리되며 '7DoF 절대 불가·자체 핸드' 방침은 번복됨."},{"id":"dec-slk-048","class":"Decision","label":"비전 모듈: 내부 얼라인 기능 탑재 요구 + inference용 저가 모듈 수용","desc":"비전 모듈은 내부적으로 얼라인된 기능이 탑재된 제품 개발을 이노텍에 요구하기로 결정. inference 용도로는 ZED 카메라 수준의 모듈을 훨씬 더 싸게 공급받을 수 있으면 OK로 방침 확정."},{"id":"dec-slk-049","class":"Decision","label":"CES POC 핸드 DOF는 LGIT 타임라인 기준 역산 논의, 비전 device는 장기 과제로 분리","desc":"6/17 미팅에서 (1)무조건 15DOF로 시작하기보다 LGIT 타깃 핸드 출시일정(9월말~10월)을 고려해 가능한 DOF(13DOF 포함) 기준으로 CES POC 데모씬을 역으로 논의하기로 함, (2)핸드 상세 스펙·URDF·택타일 정보와 scene 영상을 LGIT이 정리해 공유하기로 함, (3)비전 데이터 수집용 device 논의는 CES와 무관한 장기 협업 주제로 분리 진행하기로 결정."},{"id":"dec-slk-050","class":"Decision","label":"9월 1차 데모(7DoF+Tactile+Palm cam) → CES 최종 데모(13DoF) 단계 계획","desc":"MOU용 협업 로드맵으로 정리: 로봇핸즈는 이노텍에 기 전달된 7DoF 핸즈에 Tactile·Palm cam 모달리티를 포함해 9월 1차 데모를 수행하고, 이후 13DoF 핸즈(개선품)를 기준으로 최종 CES 데모 시연을 하기로 방향 설정. CES 일정은 최종 Target으로 변경 불가."},{"id":"dec-slk-051","class":"Decision","label":"이노텍 MOU 체결식 PR 보도문구 1안 채택","desc":"MOU 체결 PR 보도용 문구로 '글로벌 Physical AI 생태계 공동 구축을 위한 전략적 협력 양해각서(MOU) 체결식'(1안)을 채택. KW·Hensen·중희(Junghee) 모두 1안이 더 명확하고 전달력 있다며 동의해 1안으로 의견 수렴 완료."},{"id":"dec-slk-052","class":"Decision","label":"PoC를 RLWRLD 랩 환경에서 진행 합의","desc":"FUJI 아오키상과의 콜에서 PoC를 RLWRLD 랩 환경에서 진행하기로 합의. FUJI는 실제 피더/랙 사용을 강하게 선호하며, 페이로드 제약상 가벼운 피더부터 시작하는 것에 열려있음."},{"id":"dec-slk-053","class":"Decision","label":"PoC 기술 접근으로 Modular VLA 채택 검토","desc":"E2E VLA는 occlusion 이슈로 어려워 Modular VLA(홀 영역 bounding box 세그멘테이션 + 삽입 중 오브젝트 포즈 추정/트래킹 + 사전 수집 teleop 데이터 리플레이) 방향으로 검토. Object는 실제 FUJI 카세트 피더(3cm, ~3kg) 상정."},{"id":"dec-slk-054","class":"Decision","label":"PoC 피더를 Intelligence Feeder로, RLWRLD 제안 modified 환경 진행 합의","desc":"2/27 FUJI 방문 결과, PoC 대상 피더를 기존 Cassette가 아닌 볼륨존 Intelligence Feeder로 하기를 FUJI가 희망하고, PoC 성과물을 RLWRLD 제안 modified 환경에서 진행하는 것에 합의. RX 대상 공정은 FUJI가 볼륨존 기준으로 선정 예정."},{"id":"dec-slk-055","class":"Decision","label":"FUJI 계약서 '데이터' 조항 삭제/조정 추진","desc":"FUJI 계약서의 데이터 관련 조항은 삭제 혹은 조정이 필요하다고 판단, FUJI에 솔직히 전달하기로 함."},{"id":"dec-slk-056","class":"Decision","label":"FUJI PoC 상세 시나리오 확정(실제 Intelligence Feeder, 5/4/3cm)","desc":"실제 Intelligence Feeder(폭 8mm, 3kg) 대상, 천 소재 선반(높이 45cm)+divider, 폭 variation 5/4/3cm, Baseline은 5cm 넣기/빼기 성공률로 하는 상세 PoC 시나리오 확정 전달. RFM 확장성(학습 반복 시 성공률 유지·필요 학습량 감소)과 환경 tolerance 검증."},{"id":"dec-slk-057","class":"Decision","label":"PoC Object=아크릴 목업(손잡이 확대)·E2D 확정, 스토리 재설계","desc":"FUJI 6월 월례에서 PoC Object를 실제 Feeder가 아닌 손잡이를 키운 아크릴 목업으로, E2D(빼낸 뒤 넣기) 방식으로 진행 확정. PoC 스토리를 3cm에서 학습→4/5cm 수행 + 3cm 통제환경을 Base로 환경/오브젝트 변화 시 추가 학습량을 보여주는 방향으로 재설계."},{"id":"dec-slk-058","class":"Decision","label":"제시할 변화 시나리오 3종 내부 확정, 리얼 피더 8월 미사용","desc":"FUJI에 제시할 확장성 변화 시나리오 3종 확정 — (1)그림자/자연광 방향, (2)옆 사람/방해물(배경 세그멘테이션·depth 마스킹으로 커버), (3)피더 종류 변경(손잡이는 표준화, 하부 형태·두께만 상이). 리얼 피더는 8월엔 미사용(비즈적 도움 시 플러스알파로만 시도 여지). 목업은 손잡이 확대·각진 부분 제거 후 재프린트."},{"id":"dec-slk-059","class":"Decision","label":"시나리오 동작을 '피더 뺀 뒤 몸 돌려 삽입'으로 변경, Baseline 3cm 계획","desc":"공간 확보를 위해 시나리오를 피더를 뺀 뒤 몸을 돌려 집어넣는 동작으로 변경(몸통 회전 관련 RD 내부 논의 필요). 3cm baseline은 약 150 에피소드가 필요하며 7/29 FUJI 방문까지 습득 가능하다고 판단. 시나리오2는 좌우 2개 피더 중 1개만 픽업하는 형태로 정리."},{"id":"dec-slk-060","class":"Decision","label":"CJ대한통운 O-NE 협업 다음 단계 진행 (go)","desc":"CJ대한통운 구성용 상무가 O-NE 솔루션 담당 김민수 상무와 논의 후 RLWRLD와 다음 단계로 진행하자는 의견을 전달. 이에 따라 실무진 QnA 세션 및 후속 제안 준비로 진행하기로 함."},{"id":"dec-slk-061","class":"Decision","label":"6개월 PoC 범위를 '제한 조건 기반 핵심 동작 검증'으로 재정의","desc":"CJ대한통운 피드백을 반영해 6개월 내 PoC 목표를 '현장 생산성 검증'이 아니라 '제한 조건(제한 SKU·속도·payload) 기반 핵심 동작 검증'으로 재정의하고, 가능/조건부 가능/현재 불가 범위를 구분해 계약 전 목표를 수립하기로 함."},{"id":"dec-slk-062","class":"Decision","label":"CJ대한통운 PoC/현장방문 담당 Lead 배정 (제안)","desc":"Next step별 Lead를 제안: PoC 스펙 정교화 Lead는 RD PM(준수), 현장 방문 Lead 및 인덕션 한정 로드맵 구체화 Lead는 RX PM(Iris), 참여는 Product(Storm)·RD·BSP. 제안 수준으로 잠정 확정."},{"id":"dec-slk-063","class":"Decision","label":"CJ대한통운 현장 방문 참여 팀/인원 구성 (잠정)","desc":"CJ 방문 일정에 참여할 팀 구성을 정리: BSP팀 Victoria(수환 optional), RX팀 Iris+알파, RD팀 준수+알파, Product팀 Storm+알파. 각 팀 참여 인원 확정 요청과 함께 잠정 합의."},{"id":"dec-slk-064","class":"Decision","label":"데모 시나리오를 '곤지암 허브 인덕션'으로 잠정 협의","desc":"현장 방문 시 확인한 결과, 데모 시나리오를 '곤지암 허브 소형소터 인덕션' 시나리오로 하는 것으로 잠정 협의. 세부 조건(컨베이어 속도, Object 형태/사이즈/무게, 지속시간, 데모 장소)은 후속 정리 대상."},{"id":"dec-slk-065","class":"Decision","label":"PoC 대상/속도/무게 제약조건 가이드 (잠정)","desc":"PoC 제약조건 가안: 대상 Object는 박스로 10 SKU 내에서 사이즈 협의 결정, 무게는 500g 이하, 수행속도는 평균 1 SKU/5초, 데모장소는 모사환경 선호(현장 데모는 CJL 내부 의견 청취 후 협의). 우선 가이드 수준의 잠정안으로, 지속 논의하며 변경 가능."},{"id":"dec-slk-066","class":"Decision","label":"KDDI 에고센트릭 Trial PoC 촬영 가이드 초안 확정 및 KDDI 전달 결정","desc":"KDDI Ego-centric Trial PoC를 위한 촬영 가이드(작업자용 촬영 주의사항/셋업) 초안을 사내 검토 완료 후 확정하고, 일본어 번역을 거쳐 KDDI에 전달하기로 결정. 이후 본격 데이터 수집 전 가이드 하단 4가지 패턴에 대한 샘플 영상을 촬영하고 사내 협의로 최종 데이터 수집 셋업을 정하는 순서로 진행하기로 함."},{"id":"dec-slk-067","class":"Decision","label":"NVIDIA 협업 3대 트랙 및 진행 우선순위 확정","desc":"RLWRLD×NVIDIA 협업을 1) Industry-Standard Dexterity Benchmark 공동개발, 2) Robotics Dexterity Data Pipeline 표준화, 3) Joint Research 세 트랙으로 구성하고 Benchmark→Standardization→Joint Research 순으로 우선순위를 두어 진행하기로 확정. Benchmark는 즉시 착수. 방향성은 이미 NVIDIA 내부 임원 보고·엔도스먼트까지 완료되어 합의된 상태로 명시."},{"id":"dec-slk-068","class":"Decision","label":"협업 트랙별 Technical Champion(기술 담당) 지정","desc":"NVIDIA 협업 3개 아젠다별 Technical Champion 겸 Communication Gateway를 지정: 1) Benchmark 공동개발=Junho Cho(Jacey), 2) Data Pipeline 표준화=Seungcheol Park(승철), 3) Joint Research=Seungjun Moon(승준). 각자 기술 요소 검토·미팅 참여·팀내 협업 담당."},{"id":"dec-slk-069","class":"Decision","label":"DexBench Ver1 우선순위 4개 Task 영역 결정","desc":"18개 태스크를 한 번에 구현할 리소스가 없어, 지난주 미팅에서 DexBench Ver1의 우선순위 4개 Task 영역을 확정: T0 Special Picking, T03 Precision Insertion/Placing, T16 Tool-Use, T17 Moving Object Interaction. 산업 관련성·dexterity 커버리지·시뮬 구현 적합성 기준으로 선정, 우선 런칭 후 확장."},{"id":"dec-slk-070","class":"Decision","label":"DexBench 상세 시나리오 v5(Revised) 1차 확정","desc":"논의 사항을 반영한 DexBench_Revised 상세 시나리오 리스트(v5)를 1차 확정 버전으로 정하고, 해당 버전으로 Eval protocol 설계 후 익일 NVIDIA와 얼라인·구현 착수하기로 함. Special picking(T0), Precision placing/insertion(T03), Tool-use fastening(T16), Moving object interaction(T17) 세부 태스크 교체 반영."},{"id":"dec-slk-071","class":"Decision","label":"DexBench 4개 공유환경 구조로 재설계 확정 (NVIDIA 피드백 수용)","desc":"NVIDIA 피드백(환경별 개별 씬 대신 소수 공유환경에서 다수 태스크를 돌려 Arena composability를 부각)을 수용해, 13개 독립 시나리오를 4개 공유환경(Retail/Logistics/Manufacturing/Hotel)×13 태스크로 재아키텍처하기로 확정. 각 에피소드=Scene×Embodiment×Task×Object, 항공 등 과도하게 특정한 씬은 제거."},{"id":"dec-slk-072","class":"Decision","label":"DexBench 태스크/환경 세트 최종 확정 (4개 환경 × 14 태스크)","desc":"내부 정제와 NVIDIA KR팀 인풋을 거쳐 상세 태스크/환경 세트를 최종 확정: 4개 산업 환경(Retail/Logistics/Manufacturing·Hotel)×14 태스크. Design doc과 환경별 top-down 레이아웃·목업 렌더링까지 완성해 공유 가능한 수준으로 마감, NVIDIA 협업팀에도 공유."},{"id":"dec-slk-073","class":"Decision","label":"DexBench 이니셔티브 담당 실무 멤버 지정","desc":"Storm(배재경)이 DexBench 이니셔티브의 지정 담당 멤버로 Sejune Joo(세준), Seungjun Moon(승준), Donguk Lee(Duke), Changsung Jang(창성)을 배정. 이들이 Isaac Lab-Arena 상 환경/자산/태스크 구현 및 데이터 수집·sim2real 검증을 담당."},{"id":"dec-slk-074","class":"Decision","label":"Inception 파트너(N.DOT.LIGHT·Space AI) 협업 및 무비용·오픈소스 MOU 방식 확정","desc":"NVIDIA Inception 파트너 N.DOT.LIGHT(시뮬 자산)·Space AI(물리엔진)와 1차 콜 후 양사 모두와 협업 진행 확정. 협업 3사(+Physics Sim Lab) 모두 MOU 체결 후 별도 비용 없는 파트너십 형태로 진행하고, 결과물 IP는 Isaac Lab-Arena 기반 오픈소스인 만큼 IP 전부 오픈소스·무비용임을 MOU에 명시하기로 함. KW가 go-sign 승인."},{"id":"dec-slk-075","class":"Decision","label":"HEMotors 핸드 구동 모터 3종 구매 테스트 확정","desc":"Donghyun Kim 교수가 제안한 HEMotors 덱스터러스 핸드 모터 3종(HEM-16MS9-24-02CR, HEM-16MS15-24-01PG, HEM-16MS9-24-12PS)을 Jaewook Lee가 '확인해보고 바로 구매해보겠다'며 구매·테스트하기로 확정."},{"id":"dec-slk-076","class":"Decision","label":"국책과제 지원 업무분담 및 채널 운영방식 확정","desc":"국책과제 준비 지원을 위해 Finance 관련은 Olivia(전지연), 그 외 Ops 관련은 Jihye(지혜)가 팔로우업하기로 역할을 확정. 국책과제 apply/진행 정보는 민감사항이라 공개 help 채널이 아닌 이 별도 채널에서 관리하기로 함. FS 자료는 필요 시 Olivia에게 요청+용도 설명, 비용자료 중 인건비만 지혜가 직접 입력하고 그 외 비용은 Olivia/Claire가 대응."},{"id":"dec-slk-077","class":"Decision","label":"국책과제 finance 자료 요청 표준 포맷·리드타임 확정","desc":"finance에서 재무/투자자 자료가 나갈 때는 (1)제출 과제명 (2)제출 서류 (3)필요 기한(최소 1주일 전) (4)필요 정보를 엑셀 표로 정리, 형식으로 요청하기로 확정. hwp는 권한상 열람만 가능하므로 엑셀로 달라고 <!channel> 공지."},{"id":"dec-slk-078","class":"Decision","label":"보안 자율점검표 대응 보류(과제 선정 시 진행)","desc":"인공지능 개인정보보호 자율점검표 관련 급한 액션플랜은 없는 것으로 결론. HR에서 보안책임자만 지정·공유하고, 자율점검표에 대한 현재 입장은 시트에 정리해두며, 향후 과제가 선정되어 추가 증빙이 필요해지면 그때 진행하기로 함."},{"id":"dec-slk-079","class":"Decision","label":"국책과제 제출자료 SharePoint 통합관리 체계 도입","desc":"국책과제 제출 과정에서 받은 finance/HR 자료를 SharePoint 폴더 하나에 모아 관리하기로 결정. 구글시트로 문서 목록과 공유 유의사항을 로깅하고, 공유 권한은 최소화하며, 민감자료는 외부 제출이 필요할 때 컨펌을 받고 사용하기로 함."},{"id":"dec-slk-080","class":"Decision","label":"LG이노텍 계약 대금 어음지급 및 주거래은행 어음약정 체결","desc":"LG이노텍(이노텍) 계약(계약금액 약 10억원) 관련, 이노텍 내부정책상 1천만원 이상 계약은 어음 지급 방식으로 진행됨을 확인. 이에 따라 리얼월드는 주거래은행과 어음/전자어음 약정을 체결한 뒤 어음약정 체결서를 이노텍 측에 제출하기로 확정."},{"id":"dec-slk-081","class":"Decision","label":"모빌린트 온디바이스 AI 반도체 국책과제 3건 수요기업 확약서 제공","desc":"NPU 업체 모빌린트의 산통부(한국산업기술기획평가원) 과제 3건(1.휴머노이드용 온디바이스 AI반도체, 2.차세대 협동로봇용 온디바이스 AI반도체 및 SDK, 3.AI홈용 온디바이스 AI반도체 기술개발)에 대해 리얼월드가 수요기업 확약서에 날인·제공하기로 함."},{"id":"dec-slk-082","class":"Decision","label":"MAX 얼라이언스(산업부) 가입","desc":"산업부 관련 MAX 얼라이언스 가입신청서에 날인, 가입을 진행하기로 함."},{"id":"dec-slk-083","class":"Decision","label":"중기부 GMEP 불참 결정","desc":"중기부 GMEP 건에 대해 불참사유서에 날인, 불참하기로 함."},{"id":"dec-slk-084","class":"Decision","label":"Compass 국책과제 협약 및 자부담금 자금구조(잠정)","desc":"Compass 국책과제 협약 진행 시 자금구조: 정부출연금 4억원, 자부담금 4억원(그 중 60%가 현금). 자부담금 중 현금 2.4억원은 사업 종료 3개월 전(2027-01-31)까지 지급, 정부출연금은 1차년도 2.5억원 협약 후 입금·2차년도 1.4억원 후지급 구조로 공유됨."},{"id":"dec-slk-085","class":"Decision","label":"6/19 정부 행사 라이브 데모 범위·일정 확정","desc":"6/19 중구 소공동 더플라자호텔에서 위로보틱스 ALLEX 3호기와 레인보우로보틱스 RB-Y1이 협동하는 pinky 라이브 데모(마우스박스 포장·정리 자동화)를 10:15~10:25 10분간 비공개로 진행하기로 확정. 준비는 당일 00:00~09:55, 로봇 철수는 폐회 이후로 정함."},{"id":"dec-slk-086","class":"Decision","label":"RB-Y1 운반용 포장박스 메카넘휠 타입으로 확정","desc":"행사 운반을 위한 RB-Y1 포장박스를 메카넘휠 타입으로 받기로 결정."},{"id":"dec-slk-087","class":"Decision","label":"엠바고 해제로 프로젝트 채널 공개 전환","desc":"엠바고가 풀려 비공개로 운영하던 데모 프로젝트 채널을 워크스페이스 내 공개 채널로 전환하기로 결정."},{"id":"dec-slk-088","class":"Decision","label":"제조암묵지 AI 과제 컨소시엄 구성·역할 확정 방향","desc":"암묵지 AI 모델개발 과제의 컨소시엄을 리얼월드(주관), 성우하이텍(수요기업), 한자연(참여), 임종우 교수님 연구실(용역) 형태로 구성하기로 정리. '진행될 것으로 보입니다'로 아직 완전 확정 전."},{"id":"dec-slk-089","class":"Decision","label":"기관별 예산 배분 잠정안 (리얼월드 8억·성우 6억·한자연 2억)","desc":"과제 예산을 리얼월드 8억, 성우하이텍 6억, 한자연 2억 수준으로 잠정 논의. 리얼월드 8억은 멀티카메라 2천, 텔레옵 2천, 인건비 2억, GPU/HW 커스텀 미정 등으로 구성. '아직 확정은 아님'을 명시."},{"id":"dec-slk-090","class":"Decision","label":"데이터 수집·모델 개발 R&R 분장","desc":"하드웨어(센서 부착·텍타일 글러브 개조 등) 및 데이터 수집은 리얼월드가, 3D 스캐너/데이터 수집 자문은 임종우 교수님 측이 지원. 외주용역은 핵심기술로 인정 안 되므로 계획서상 모델 개발은 리얼월드가 내부 수행하고 교수님 연구실은 기술지원·자문 형태로 작성하는 방향."},{"id":"dec-slk-091","class":"Decision","label":"연구책임자·발표자를 Sangwoo Kim(Lennon)으로 지정","desc":"주관기관 책임자가 대면 발표를 진행해야 하는 규정에 따라, 과제 연구책임자 겸 발표자를 Sangwoo Kim(Lennon)이 맡기로 함. 5/27 동대구 대면발표를 Lennon이 수행."},{"id":"dec-slk-092","class":"Decision","label":"모델 아키텍처: 3D 스캔 파이프라인과 멀티모달 모델 분리","desc":"End-to-end 단일 모델이 아니라 3D 스캔 파이프라인과 멀티모달 모델을 분리해서 구성하는 방향으로 정리. 3D 스캐너는 별도 트랙, 텍타일/FT/핸드메시 등 멀티모달 입력은 별개 모델로."},{"id":"dec-slk-093","class":"Decision","label":"H100 GPU는 구매가 아닌 임차로 진행","desc":"평가 질의에서 H100 임차료 2억이 과도하다는 지적에 대해, 사내 클라우드 클러스터 통합 비용을 고려하면 임차가 효율적이라 판단해 임차 방식 유지. 단 2억 금액 적정성은 협약 단계에서 재검토하기로 함."},{"id":"dec-slk-094","class":"Decision","label":"휴머노이드/엑스핸드는 계획 포함하되 정량 지표에서 제외","desc":"6종 모달리티 센서는 성우하이텍 생산라인에 투입하고, 휴머노이드에 VLA 모델을 탑재해 명장 공정 대체 가능성을 확인하는 시도는 포함하되 정량 지표에는 미포함하기로 함. 타당성은 협약 단계에서 추가 소명 예정."},{"id":"dec-slk-095","class":"Decision","label":"제품화 로드맵 가칭을 'RLWRLD Robotics Platform'으로 변경","desc":"내부 제품명 RRC와 미팅에서 쓰는 RRC가 혼동을 유발하여, 로드맵/제안 문서상 가칭을 'RLWRLD Robotics Platform 제품화 로드맵'으로 변경하기로 하고 Notion 페이지 명칭을 즉시 수정 반영함."},{"id":"dec-slk-096","class":"Decision","label":"수집~평가(4-1~4-6) 중심의 working prototype 우선 구축","desc":"현재 진행 가능한 재료를 모아 working prototype으로 합치고, 데이터 수집·증강·정제·학습·평가(4-1~4-6) 모듈을 우선 구현하는 방향으로 합의. real product에 무엇을 어떻게 넣을지는 Gerald·Richard가 상의하기로 함."},{"id":"dec-slk-097","class":"Decision","label":"상용화 단계 모듈(Workflow Orchestration·Fleet Management·OTA)은 추후로 보류","desc":"4-7~4-9(Workflow Orchestration, Fleet Management, OTA & Updates)는 실제 로봇 Deployment·상용화 단계 모듈로, 현 프로토타입 범위에서 제외하고 추후 고민하기로 함. 다만 고객 요구/기시장 Product 관점의 자료 수집과 하이레벨 요구사항은 Victoria가 미리 정리."},{"id":"dec-slk-098","class":"Decision","label":"판매정책·Pricing 논의는 Biz 워크샵에서 일규가 전사 관점으로 주도","desc":"판매정책·Pricing 등 모델+플랫폼 팀을 포함한 논의는 Biz 워크샵에서 Ilgyu(일규)가 준비한 내용(경쟁사 비교 포함)과 함께 전사 관점에서 전개하기로 함."},{"id":"dec-slk-099","class":"Decision","label":"한/미/일 3개 버전 목업 및 상품제안서 제작","desc":"상품설계 목업을 기반으로 한국·미국·일본 버전 페이지 목업을 완료하고 각 시장용 상품제안서를 정리하기로 넥스트스텝 합의. 목업 수정 반영(숫자 등 마이너 사항)은 차주까지, 버전별 목업 완료·제안서 정리는 추가 논의 필요."},{"id":"dec-slk-100","class":"Decision","label":"LOOP Productize 로드맵 방향 설정 (수집/증강/정제/학습/평가 5단계)","desc":"Richard가 LOOP(EaaS 프로토타입) Productize 로드맵을 5단계로 진행하기로 방향을 정함: (4-1) 수집은 현상태 유지, (4-2) 데이터 증강 UI 요소 마련, (4-3) 정제 단계에 에피소드 직접 선택 및 반영 비중 지정 기능 추가하되 DAgger는 일단 제외, (4-4) 여러 모델 동시 학습 흐름 추가, (4-5) 대략적 평가 및 실제 로봇 task 단위 리더보드 형태 평가. HK에게 cc하여 의견 요청했고 큰 방향은 합의되었으나 세부는 조정 중."},{"id":"dec-slk-101","class":"Decision","label":"학습 UX 순서 확정: 데이터 → 모델 → 파라미터셋(스윕), 모델 선택 후 스윕","desc":"다수 모델 학습 시 모델마다 파라미터 복잡도가 커지므로, 모델 선택 후 하이퍼파라미터 스윕을 할 수 있는 쪽으로 포커스를 맞추기로 함. 전체 순서는 데이터 → 모델 → 파라미터 셋(스윕). HK가 제안하고 Richard가 '네, 알겠습니다'로 동의하여 확정."},{"id":"dec-slk-102","class":"Decision","label":"학습 하이퍼파라미터 흐름 개편 + GPU 클러스터 선택 단계(AWS/Kakao/Naver) 추가","desc":"HK의 '하이퍼파라미터 추천은 sweep 여부와 sweep 조합까지 시스템이 상황에 맞게 제안해야 한다'는 피드백을 반영해 학습 흐름을 변경하기로 함. 기존 SWEEP/단순 학습 실행 선택 흐름을 제거하고 시스템이 제안하는 하이퍼파라미터를 기본으로 학습을 진행하며, 추천 조합·옵션을 테이블로 제공(batch size, max steps, learning rate, 추천 사유, 예상 비용 표시). 학습 전 GPU 클러스터를 AWS/Kakao/Naver 중 선택하는 단계도 추가. mockup UI에 반영 완료."},{"id":"dec-tiro-001","class":"Decision","label":"삼성·LG·현대차 3사 별도 플레이북(2.0) 접근","desc":"이마트·롯데·CJ대한통운 등에 쓰던 기존 플레이북(1.0)과 달리, 삼성전자·LG전자·현대차 3사는 연 수백억 규모의 글로벌 테크 파트너십(플레이북 2.0) 관점에서 접근하기로 했다."},{"id":"dec-tiro-002","class":"Decision","label":"국책과제 참여 필터 3원칙 확정","desc":"①핵심 기술 우선순위와 직결되지 않는 과제 제외 ②연 5억 원 이상 원칙(핵심 어카운트 확보/전략적 기술 습득은 예외) ③코어 사업 연관 과제에 한해 주관 참여, 그 외 참여 형태 지양."},{"id":"dec-tiro-003","class":"Decision","label":"사업관리 KPI 4대 축 체계 전환","desc":"기존 매출액·인력 부족만 추적하던 사후 관리에서 Revenue·Pricing·Headcount·Data 4대 축의 선행 예방 지표 중심으로 전환하기로 했다."},{"id":"dec-tiro-004","class":"Decision","label":"비즈니스팀 역할 재정의 및 타 팀 업무 이관 합의","desc":"비즈니스팀은 영업·가격 협상·어카운트 관리에 집중하고, 하드웨어 리서치·제품 디자인 등 플랫폼·모델팀 고유 업무는 해당 팀으로 이관하기로 했다. 현 상태를 ‘vicious circle’로 진단하고 OM 제도로 역할 경계를 명확화한다."},{"id":"dec-tiro-005","class":"Decision","label":"배포 케이스 3종 공식 구분(Direct RaaS/SI 경유/모델 라이선스)","desc":"배포 경로를 Direct RaaS, SI 경유 플랫폼·모델 라이선스 공급, 모델 단독 라이선스의 세 가지로 공식 구분했다. 2028년 기반 구축 후 2029년부터 RaaS 수준 매출 달성을 목표로 한다."},{"id":"dec-tiro-006","class":"Decision","label":"Technical Support 체계 없이 상용 판매 착수 금지 원칙","desc":"담당자·SLA·Q&A 파이프라인 등 Technical Support 체계 없이 상용 판매에 착수하는 것을 리스크로 규정하고, 최소 담당자 배정 및 프로토콜 수립 후 출시하기로 했다."},{"id":"dec-tiro-007","class":"Decision","label":"R&D 미검증 기능 외부 출시 불가 원칙 + RRP 차별화 메시지 도출","desc":"내부 검증(R&D)에서 검증되지 않은 기능은 외부 출시할 수 없다는 원칙을 확립하고, RRP 차별화 포인트(한 문장 메시지) 도출을 모델 팀에 요청했다."},{"id":"dec-tiro-008","class":"Decision","label":"레시피·하이퍼파라미터 추천 기능 최우선 완성 과제 설정","desc":"플랫폼 Fine-tuning 파이프라인에서 데이터 레시피 추천·하이퍼파라미터 추천 기능을 최우선 완성 과제로 설정하고 다음 주 내 프로토타입 시연을 예정했다."},{"id":"dec-tiro-009","class":"Decision","label":"데이터 효율화 연구를 핵심 차별화 모토로 설정","desc":"소량 데이터 증강·고효율 학습 등 데이터 효율화 연구를 핵심 차별화 모토로 설정하고, 시뮬레이터는 당분간 Evaluation 용도로 한정하기로 했다."},{"id":"dec-tiro-010","class":"Decision","label":"모델 KPI 4종 정의(Speed·Atomic Skill·Precision·Task Generalization)","desc":"고객 배포 관점 핵심 KPI를 Speed, Atomic Skill 성공률, 정밀도(Precision), Task Generalization 네 가지로 정의했다."},{"id":"dec-tiro-011","class":"Decision","label":"파트너십 랜드스케이프를 수요 기업(회사별) 중심으로 정리","desc":"로봇 회사 관점의 테크·도메인·플랫폼 3분류 컬럼 대신, 수요 기업별로 어떤 로보틱스 회사와 무엇을 협업하는지 정리하는 회사별 방식으로 산출물 구조를 합의했다."},{"id":"dec-tiro-012","class":"Decision","label":"북미 아웃리치는 AWS 협업 경험 업체부터 우선 접근","desc":"북미 시장에서 AWS와 이미 협업해본 업체부터 접근하기로 방향을 설정했다. 이들이 Sanctuary·Agility 수준 데모만 해봤을 가능성이 높아 RFM 협업 여지가 있다는 판단이다."},{"id":"dec-tiro-013","class":"Decision","label":"파트너십 리서치 산출물을 강욱 기업 첫 접촉용 대화 소스로 설정","desc":"외부 리서치만으로는 경쟁사 파트너십의 구체적 페인포인트를 특정하기 어렵다고 판단해, 산출물을 강욱이 기업과 첫 대화를 시작할 수 있는 기업별 오프닝 멘트 성격의 소스로 방향을 정했다."},{"id":"dec-tiro-014","class":"Decision","label":"파트너 유형별 차등 분석 접근(수요기업 vs SI·테크회사)","desc":"수요기업은 성패와 무관하게 deploy 케이스의 태스크·환경을 먼저 정리하고, SI·테크회사·부품사는 공동연구 주제를 유형화하는 방식으로 나눠 접근하기로 했다."},{"id":"dec-tiro-015","class":"Decision","label":"컨베이어 벨트 벤치마크 보강 사양 확정","desc":"오브젝트 100개를 10번씩 던져 3초 안에 색상별 분류통에 넣는 방식으로 컨베이어 벨트 벤치마크를 보강하기로 했다. VLA가 단일 오브젝트로 치팅하지 못하도록 오브젝트를 다양화한다."},{"id":"dec-tiro-016","class":"Decision","label":"오케스트레이션 첫 과제로 RealDex·ZeroDex 오케스트레이션 채택","desc":"오케스트레이션 레이어의 첫 실험 과제로 양 극단에 있는 RealDex와 ZeroDex 두 모델을 오케스트레이션하는 것을 목표로 잡기로 했다."},{"id":"dec-tiro-017","class":"Decision","label":"비용 구조 통합·단순화 방식 채택","desc":"사업 모델의 비용 항목을 세목별로 쪼개지 않고 5~7개 카테고리로 통합하고, 하드웨어 대비 퍼센트 방식으로 단순화해 표기하기로 했다."},{"id":"dec-tiro-018","class":"Decision","label":"인퍼런스 비용 별도 산정 없이 기존 비용에 포함","desc":"인퍼런스 비용은 별도 항목으로 크게 잡지 않고 하드웨어/기존 비용에 포함된 것으로 처리하기로 했다."},{"id":"dec-tiro-019","class":"Decision","label":"계약서 문서 접근 권한 부여 대상 확정","desc":"계약서 문서 접근 권한은 필요한 사람에게만 부여하며, 오퍼레이션 측(지혜 등)과 비즈니스 측 용재·빅토리아를 대상으로 정했다."},{"id":"dec-tiro-020","class":"Decision","label":"이번 주 사업계획 산출물 우선순위 설정","desc":"데이터룸 채우기를 1순위로, 미국·일본 고객사·SI 리스트업과 IR 덱용 산업 케이스(롯데호텔·지자체) 한 페이지 작성을 이번 주 핵심 산출물로 설정했다."},{"id":"dec-tiro-021","class":"Decision","label":"국책·B2G 지원금 재무모델 별도 섹션 반영","desc":"국책과제 등 국가로부터 받는 지원 금액을 매출이 아닌 별도 섹션으로 재무(엑셀) 모델에 반영하고, GPU 지원(할인가 약 50억)은 현금성 국책과제와 분리해 표기하기로 논의했다. 최종 반영은 경영진 판단을 받기로 했다."},{"id":"dec-tiro-022","class":"Decision","label":"고객 KPI(속도·성공률) 현수준·목표치 정리 합의","desc":"고객 KPI(속도·성공률)의 현재 수준과 목표치·시점을 정리해 계약과 고객 디플로이 요구 간 격차를 관리하기로 했다."},{"id":"dec-tiro-023","class":"Decision","label":"US 로드쇼 타겟 기업 분석 방향 채택","desc":"221개 롱리스트를 4개 축으로 필터링해 28개 기업으로 좁힌 US 로드쇼 타겟팅 분석과 기업별 원 라이너 제안 방식을 그대로 진행하기로 했다."},{"id":"dec-tiro-024","class":"Decision","label":"니즈·페인포인트 기반 파트너십 접근 방식 채택","desc":"탑다운 아웃사이드인 레퍼런스 조사로는 답이 안 나온다고 보고, 엔드 커스터머·SI의 여정에서 도출되는 니즈·페인포인트를 리스트업해 파트너십 유형·기술과 매핑하는 비(非)트레디셔널 앵글로 접근하기로 했다."},{"id":"dec-tiro-025","class":"Decision","label":"이밸류에이션 모델을 제미나이 API에서 RLGX 액션헤드 기반 진행도 예측으로 전환","desc":"롯데호텔 RD 프로젝트에서 초기에 쓰던 제미나이 API 이밸류에이션 모델의 레이턴시가 너무 커서, RLGX 액션헤드가 넘겨주는 패턴 피처를 별도 모델이 받아 테스트 진행도를 예측·판정하는 방식으로 전환해 구현했다."},{"id":"dec-tiro-026","class":"Decision","label":"하드웨어·데이터 수집 벤더 소싱 진행","desc":"WAIC 출장 후속으로 로보테라·덱스로봇 등 휴머노이드/핸드 하드웨어와 데이터 글로브·데이터 수집 업체를 다수 소싱·검토·구매·테스트하는 워크스트림을 진행하기로 했다."},{"id":"dec-rl-project-group-goals","class":"Decision","label":"RL 프로젝트 그룹 목표 설정","desc":"리얼 로봇 가동 24시간 이내 base policy 성공률 95%↑ 달성 RL 파이프라인 내재화를 그룹 목표로 확정"},{"id":"dec-1step-denoising-rl","class":"Decision","label":"1-step denoising RL 진행 여부","desc":"DSRL-NA 외 대안으로 1-step denoising RL도 함께 시도하기로 결정 (우선 1-step SFT 성능 확인 후 진행)"},{"id":"dec-rl-research-direction-worldmodel-vla","class":"Decision","label":"향후 RL 연구 방향 align — World Model-VLA","desc":"월드모델-VLA를 '병목 없는 VLA cycle 완성'의 키로 보고, 이를 위해 dense data annotation 방향을 탐색키로 align"},{"id":"dec-rtc-experiment-design","class":"Decision","label":"RTC 실험 설계 확정 (RLDX 테크리포트용)","desc":"RLDX 테크리포트용 RTC 실험을 Conveyor_Mouse 타겟으로 설계 확정 — baseline(sync) vs RTC+kernel opt 성공률·inference 속도 비교"},{"id":"dec-dexbench-tasklist-13","class":"Decision","label":"DexBench 작업 목록 13개 정리 + 시나리오 영상 + POC 정렬","desc":"DexBench 초기 15개 태스크를 13개로 정리·정량화(물체사양·초기조건·성공기준), 개별영상 대신 하나의 시나리오/티저 영상으로 G0·S0 대표, 태스크 그룹 기반 비즈 POC + RX/RD 로드맵 정렬"},{"id":"dec-msra-collab-approach","class":"Decision","label":"MSRA 협업 방식 — 시뮬 병행 후 분담","desc":"MSRA와 시뮬레이션에서 동일 태스크를 각자 먼저 진행하고 2~3주 간격으로 progress 공유, 잘 되면 다음 단계 협업으로. 구체 task 선정은 추후 확정 예정"},{"id":"dec-rrc-release-1-0-0","class":"Decision","label":"RRC first release version = 1.0.0","desc":"RRC(Robotics Runtime/Control) 첫 릴리스 버전을 1.0.0으로 확정"},{"id":"dec-dataset-id-prefix","class":"Decision","label":"Dataset ID prefix 개념 도입","desc":"dataset ID 관리를 쉽게 하기 위해 prefix 개념 도입 결정 (+ RRC 1.0.0 버전 재확인)"},{"id":"dec-wujihand-sw-force-     L("Deck:IR4.2.1","Nar:biz","containsNarrative"); L("Deck:Business3.7","Nar:biz","containsNarrative"); L("Deck:IR4.2.1","Nar:tech","containsNarrative");
    L("Nar:biz","SI Progress DB","backedBy"); L("Nar:tech","Prod:RLDX","backedBy");
    N("PR:US런칭","comms","PREvent","RLDX-1 US"); L("PR:US런칭","Prod:RLDX","relatedTo");

    const SRC=[["SI Progress DB","NotionPage","딜 마스터"],["국책 Dashboard","NotionPage",""],["Partnership Log","NotionPage",""],
      ["BD status","NotionPage",""],["경쟁 파이프라인","ExternalSource","기존 자동화"],["Benchmark 주간리포트","NotionPage",""],
      ["VLab 워크스페이스","NotionPage",""],["VLab 회의록DB","NotionPage",""],["Platform Team","NotionPage",""],
      ["slack:proj-rx-fuji","SlackChannel",""],["slack:proj-rx-cjl","SlackChannel",""],["slack:proj-rx-ana","SlackChannel",""],
      ["slack:natl","SlackChannel",""],["slack:news","SlackChannel","뉴스"],["slack:knowledge-feed","SlackChannel",""],
      ["slack:vlab","SlackChannel","가상랩"],["slack:kr-jp-sync","SlackChannel",""],
      ["slack:__momentum","SlackChannel","집계"],["slack:__biz","SlackChannel","집계"],["slack:__product","SlackChannel","집계"],["slack:__rd","SlackChannel","집계"],
      ["gcal:Business","CalendarEvent",""],["gdrive:덱","ExternalSource",""],["github:RLWRLD","ExternalSource",""]];
    SRC.forEach(s=>N(s[0],"sources",s[1],s[2]));
    L("경쟁 파이프라인","Benchmark 주간리포트","emits"); L("경쟁 파이프라인","slack:news","reads");
    L("VLab 회의록DB","RP:ResearchEng","feeds"); L("Platform Team","Prod:RRC","feeds");
    L("FUJI RX","slack:proj-rx-fuji","discussedIn"); L("CJL RX","slack:proj-rx-cjl","discussedIn"); L("ANA GH RX","slack:proj-rx-ana","discussedIn");
    L("국책:GITCC-MAX","slack:natl","discussedIn"); L("VLab:ALINLAB","slack:vlab","discussedIn"); L("SI Progress DB","BD status","relatedTo");
    L("gdrive:덱","Deck:IR4.2.1","holds"); L("github:RLWRLD","Prod:RRC","holds");

    N("Decision:212","strategy","Decision","212건 · 기술 12 + Biz 회의 98 + Slack 102");
    N("ActionItem:404","strategy","ActionItem","404건 · Decision 하류 실행항목");
    L("Decision:212","ActionItem:404","resultsIn");
    N("Align:VLab-Product","strategy","AlignmentTopic","가상랩↔제품팀 시너지");
    N("Align:KR-JP","strategy","AlignmentTopic","한일 정렬");
    L("Align:VLab-Product","Unit:ProductTeam","betweenUnits"); L("Align:VLab-Product","VLab:ALINLAB","betweenUnits");
    L("Align:KR-JP","Unit:Japan","betweenUnits"); L("Align:KR-JP","Unit:BizStrategy","betweenUnits");
  })();
  // Validator-backed Decision/ActionItem instances. Hidden until explicitly expanded.
  (function(){
    const raw=document.getElementById("strategy-data").textContent;
    const data=JSON.parse(raw||'{"nodes":[],"links":[]}');
    data.nodes.forEach(n=>INST_NODES.push([n.id,n.class==="Person"?"org":"strategy",n.class,n.label+(n.desc?" · "+n.desc:""),0,1]));
    data.links.forEach(l=>INST_LINKS.push(l));
  })();
  // 클래스(타입) 앵커 + instanceOf 링크 — "타입 노드 표시" 토글로만 켜짐(기본 꺼짐).
  // 각 개체가 자기 클래스로 'is a' 점선을 뻗어 Account/Competitor/Industry/… 부모 노드가 등장.
  (function(){
    const inst=INST_NODES.slice(), clsDom={};
    inst.forEach(n=>{ const c=n[2]; if(c && !clsDom[c]) clsDom[c]=n[1]; });   // 클래스 → (첫 개체의)도메인 색
    Object.keys(clsDom).forEach(c=>INST_NODES.push(["◆ "+c, clsDom[c], c, "클래스(타입) — instanceOf 부모", 1]));
    inst.forEach(n=>{ if(n[2]) INST_LINKS.push([n[0], "◆ "+n[2], "is a", 0, 1]); });   // [s,t,rel,isa,instanceOf]
  })();

  function build(nodesRaw, linksRaw, schema){
    const nodes = nodesRaw.map((n,i)=>({
      id:n[0], label:schema?n[0]:n[0], domain:n[1],
      cls: schema?null:n[2], desc: schema?n[2]:n[3], isClass: schema?false:!!n[4], strategyDetail: schema?false:!!n[5],
      x:0,y:0,vx:0,vy:0, fx:null,fy:null, deg:0
    }));
    const byId={}; nodes.forEach(n=>byId[n.id]=n);
    const links=[];
    linksRaw.forEach(l=>{
      const s=byId[l[0]], t=byId[l[1]];
      if(!s||!t) return;
      const inst=!!l[4];
      links.push({s,t,rel:l[2]||"", isa:!!l[3], instanceOf:inst});
      if(inst){ t.deg++; }          // instanceOf는 클래스 노드 크기에만 반영(개체 크기 왜곡 방지)
      else { s.deg++; t.deg++; }
    });
    return {nodes,links,byId};
  }
  const GRAPHS = {
    schema: build(SCHEMA_NODES, SCHEMA_LINKS, true),
    instance: build(INST_NODES, INST_LINKS, false)
  };

  // ---------- canvas / render ----------
  const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  let W=0,H=0,DPR=1;
  let view="schema", G=GRAPHS.schema;
  let tf={s:1,x:0,y:0};
  let hoverN=null, selN=null;
  const hiddenDom=new Set();
  let showTypes=false;   // "타입(클래스) 노드 표시" 토글 (인스턴스 뷰)
  let showStrategyDetails=false;
  let alpha=1, running=true, rafId=null;
  function nodeActive(n){ if(hiddenDom.has(n.domain)) return false; if(n.isClass && !showTypes) return false; if(n.strategyDetail && !showStrategyDetails) return false; return true; }
  function linkActive(l){ if(l.instanceOf && !showTypes) return false; return nodeActive(l.s)&&nodeActive(l.t); }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    kick();
  }
  function seed(){
    const cx=W/2, cy=H/2, R=Math.min(W,H)*0.34;
    G.nodes.forEach((n,i)=>{
      const a=i/G.nodes.length*Math.PI*2;
      n.x=cx+Math.cos(a)*R*(0.6+0.5*Math.random());
      n.y=cy+Math.sin(a)*R*(0.6+0.5*Math.random());
      n.vx=0;n.vy=0;n.fx=null;n.fy=null;
    });
    tf={s:1,x:0,y:0};
  }
  // 버블 크기 = 연결 수(degree)에 비례. 제곱근 스케일로 허브가 확실히 커진다.
  function radius(n){ return (view==="schema"?5.5:4) + Math.sqrt(n.deg)*(view==="schema"?2.2:2.7); }

  function step(){
    const cx=W/2, cy=H/2;
    const N=G.nodes.filter(nodeActive);   // 숨긴 클래스 노드는 물리 계산에서 제외
    const many=N.length>60;
    // 여유 있는 배치 + 허브 분리: 반발력을 degree('전하')에 비례시켜 연결 많은 노드끼리 더 멀어지게, 중력은 약하게
    const REP=many?900:1600, GRAV=many?0.006:0.004, SPRINGL=many?150:150;
    // repulsion (charge-weighted)
    for(let i=0;i<N.length;i++){
      const a=N[i], ca=1+a.deg*0.16;
      for(let j=i+1;j<N.length;j++){
        const b=N[j];
        let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
        if(d2<1)d2=1;
        const d=Math.sqrt(d2);
        const f=REP*ca*(1+b.deg*0.16)/d2;
        const fx=dx/d*f, fy=dy/d*f;
        a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
      }
    }
    // springs (허브에 매달린 링크는 조금 더 길게)
    G.links.forEach(l=>{
      if(!linkActive(l)) return;
      const hub=Math.max(l.s.deg,l.t.deg);
      const L=(l.isa||l.instanceOf)?90:(SPRINGL+Math.min(hub,20)*4);
      let dx=l.t.x-l.s.x, dy=l.t.y-l.s.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-L)*0.035;
      const fx=dx/d*f, fy=dy/d*f;
      l.s.vx+=fx; l.s.vy+=fy; l.t.vx-=fx; l.t.vy-=fy;
    });
    // gravity + integrate
    N.forEach(n=>{
      n.vx+=(cx-n.x)*GRAV; n.vy+=(cy-n.y)*GRAV;
      if(n.fx!=null){ n.x=n.fx; n.y=n.fy; n.vx=0; n.vy=0; return; }
      n.vx*=0.86; n.vy*=0.86;
      const sp=Math.hypot(n.vx,n.vy), max=18;
      if(sp>max){ n.vx=n.vx/sp*max; n.vy=n.vy/sp*max; }
      n.x+=n.vx*alpha*1.6; n.y+=n.vy*alpha*1.6;
    });
    alpha*=0.985;
  }

  function toScreen(n){ return [n.x*tf.s+tf.x, n.y*tf.s+tf.y]; }
  function neighborsOf(n){
    const set=new Set([n]);
    G.links.forEach(l=>{ if(l.s===n)set.add(l.t); if(l.t===n)set.add(l.s); });
    return set;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const focus = selN||hoverN;
    const nbr = focus?neighborsOf(focus):null;
    const isDim = n => (hiddenDom.has(n.domain)) || (focus && !nbr.has(n));

    // edges
    G.links.forEach(l=>{
      if(!linkActive(l)) return;
      const dashed = l.isa || l.instanceOf;
      const active = focus && (l.s===focus||l.t===focus);
      const dim = focus && !active;
      const [sx,sy]=toScreen(l.s), [tx,ty]=toScreen(l.t);
      ctx.beginPath();
      ctx.moveTo(sx,sy); ctx.lineTo(tx,ty);
      ctx.strokeStyle = active?domColor(l.s.domain):(dashed?cssv("--edge-isa"):cssv("--edge"));
      ctx.globalAlpha = dim?0.12:(active?0.9:(l.instanceOf?0.35:0.5));
      ctx.lineWidth = active?2:1;
      if(dashed){ ctx.setLineDash([4,4]); } else { ctx.setLineDash([]); }
      ctx.stroke();
      ctx.setLineDash([]);
      // arrowhead + rel label on active
      if(active && !dashed){
        const ang=Math.atan2(ty-sy,tx-sx), r=radius(l.t)*tf.s+3;
        const ax=tx-Math.cos(ang)*r, ay=ty-Math.sin(ang)*r, hd=7;
        ctx.globalAlpha=0.95; ctx.fillStyle=domColor(l.s.domain);
        ctx.beginPath();
        ctx.moveTo(ax,ay);
        ctx.lineTo(ax-Math.cos(ang-0.5)*hd, ay-Math.sin(ang-0.5)*hd);
        ctx.lineTo(ax-Math.cos(ang+0.5)*hd, ay-Math.sin(ang+0.5)*hd);
        ctx.closePath(); ctx.fill();
        if(l.rel){
          const mx=(sx+tx)/2, my=(sy+ty)/2;
          ctx.font="600 11px "+cssv("--font-mono");
          const w=ctx.measureText(l.rel).width;
          ctx.globalAlpha=0.95; ctx.fillStyle=cssv("--surface");
          ctx.fillRect(mx-w/2-4,my-8,w+8,16);
          ctx.fillStyle=cssv("--ink"); ctx.textAlign="center"; ctx.textBaseline="middle";
          ctx.fillText(l.rel,mx,my);
        }
      }
    });
    ctx.globalAlpha=1;

    // nodes
    const many=G.nodes.length>60;
    const labelDegCut = many?7:(view==="schema"?6:4);
    const showAllLabels = (!many && tf.s>0.9) || tf.s>1.5;
    G.nodes.forEach(n=>{
      if(!nodeActive(n)) return;
      const [x,y]=toScreen(n); const r=radius(n)*tf.s;
      const dim=isDim(n);
      ctx.globalAlpha=dim?0.2:1;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=domColor(n.domain); ctx.fill();
      // 클래스(타입) 앵커는 흰 테두리를 굵게 + 점선 느낌으로 구분
      ctx.lineWidth=(n===focus)?3:(n.isClass?2.5:1.5);
      ctx.strokeStyle=(n===focus)?cssv("--ink"):(n.isClass?cssv("--ink-soft"):cssv("--surface"));
      ctx.stroke();
      // label
      const lab = n.label;
      const showLabel = !dim && (showAllLabels || n===focus || (nbr&&nbr.has(n)) || n.deg>=labelDegCut);
      if(showLabel){
        ctx.font=(n===focus?"700 ":"500 ")+ (view==="schema"?"12px ":"11.5px ")+cssv("--font-sans");
        ctx.textAlign="left"; ctx.textBaseline="middle";
        const tx=x+r+4;
        ctx.globalAlpha=dim?0.25:1;
        ctx.fillStyle=cssv("--ink");
        ctx.fillText(lab, tx, y);
      }
    });
    ctx.globalAlpha=1;
  }

  function loop(){
    if(alpha>0.02){ step(); }
    draw();
    if(alpha>0.02 || running===false){}
    rafId=requestAnimationFrame(loop);
  }
  function kick(){ alpha=Math.max(alpha,0.5); }

  // ---------- interaction ----------
  let drag=null, panning=null;
  function nodeAt(px,py){
    for(let i=G.nodes.length-1;i>=0;i--){
      const n=G.nodes[i]; if(!nodeActive(n))continue;
      const [x,y]=toScreen(n); const r=radius(n)*tf.s+4;
      if((px-x)**2+(py-y)**2<=r*r) return n;
    }
    return null;
  }
  function evtPos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }

  cv.addEventListener("pointerdown",e=>{
    cv.setPointerCapture(e.pointerId);
    const [px,py]=evtPos(e); const n=nodeAt(px,py);
    if(n){ drag={n, ox:0, oy:0}; n.fx=n.x; n.fy=n.y; cv.classList.add("grabbing"); }
    else { panning={px,py,tx:tf.x,ty:tf.y}; cv.classList.add("grabbing"); }
  });
  cv.addEventListener("pointermove",e=>{
    const [px,py]=evtPos(e);
    if(drag){ drag.n.fx=(px-tf.x)/tf.s; drag.n.fy=(py-tf.y)/tf.s; kick(); }
    else if(panning){ tf.x=panning.tx+(px-panning.px); tf.y=panning.ty+(py-panning.py); }
    else {
      const n=nodeAt(px,py);
      if(n!==hoverN){ hoverN=n; cv.style.cursor=n?"pointer":"grab"; }
    }
  });
  function endPtr(e){
    if(drag){ drag.n.fx=null; drag.n.fy=null; drag=null; }
    panning=null; cv.classList.remove("grabbing");
  }
  cv.addEventListener("pointerup",e=>{
    const [px,py]=evtPos(e);
    if(drag && Math.hypot(drag.n.x-((px-tf.x)/tf.s), drag.n.y-((py-tf.y)/tf.s))<3){
      selectNode(drag.n);
    } else if(!drag && panning && Math.hypot(px-panning.px,py-panning.py)<3){
      const n=nodeAt(px,py); selectNode(n);
    }
    endPtr(e);
  });
  cv.addEventListener("pointercancel",endPtr);
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    const [px,py]=evtPos(e);
    const f=Math.exp(-e.deltaY*0.0016);
    const ns=Math.max(0.35,Math.min(3,tf.s*f));
    tf.x=px-(px-tf.x)*(ns/tf.s); tf.y=py-(py-tf.y)*(ns/tf.s); tf.s=ns;
  },{passive:false});

  // ---------- detail panel ----------
  const dEl=document.getElementById("detail");
  function selectNode(n){
    selN=n;
    if(!n){ dEl.classList.remove("show"); return; }
    document.getElementById("dkind").textContent=(view==="schema"?"클래스":(n.isClass?"클래스(타입) 앵커":(n.cls||"인스턴스")));
    document.getElementById("dkind").style.color=domColor(n.domain);
    document.getElementById("dname").textContent=n.label;
    document.getElementById("ddesc").textContent=n.desc||"";
    const out=[],inc=[];
    G.links.forEach(l=>{
      if(!linkActive(l)) return;
      if(l.s===n) out.push(l);
      else if(l.t===n) inc.push(l);
    });
    let html="";
    if(out.length){
      html+='<div class="rel-h">이 노드가 가리키는 관계</div>';
      out.forEach(l=>{ html+=rowHTML(l.rel||(l.isa?"is-a":""), l.t, l.isa); });
    }
    if(inc.length){
      html+='<div class="rel-h">이 노드를 가리키는 관계</div>';
      inc.forEach(l=>{ html+=rowHTML(l.rel||(l.isa?"is-a":""), l.s, l.isa, true); });
    }
    document.getElementById("drels").innerHTML=html;
    dEl.classList.add("show");
  }
  function rowHTML(rel,other,isa,incoming){
    const arrow=incoming?"←":"→";
    const relTxt=isa?"is-a":rel;
    return '<div class="rel"><span class="rn">'+arrow+' '+relTxt+'</span>'+
           '<span class="rt">'+other.label+'</span></div>';
  }
  document.getElementById("dclose").addEventListener("click",()=>{selN=null;dEl.classList.remove("show");});

  // ---------- controls ----------
  document.querySelectorAll("#viewToggle button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll("#viewToggle button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      view=b.dataset.v; G=GRAPHS[view]; selN=null; hoverN=null; dEl.classList.remove("show");
      seed(); alpha=1; updCount();
    });
  });
  document.getElementById("resetBtn").addEventListener("click",()=>{ seed(); alpha=1; selN=null; dEl.classList.remove("show"); });
  document.getElementById("typeToggle").addEventListener("change",e=>{
    showTypes=e.target.checked; selN=null; hoverN=null; dEl.classList.remove("show"); kick(); updCount();
  });
  document.getElementById("strategyToggle").addEventListener("change",e=>{
    showStrategyDetails=e.target.checked; selN=null; hoverN=null; dEl.classList.remove("show"); seed(); alpha=1; updCount();
  });

  function updCount(){
    const nn=G.nodes.filter(nodeActive).length;
    const ll=G.links.filter(linkActive).length;
    document.getElementById("cnt").textContent=nn+"개 노드 · "+ll+"개 관계";
  }
  // legend
  const legEl=document.getElementById("legend");
  Object.keys(DOMAINS).forEach(d=>{
    const el=document.createElement("div"); el.className="lg";
    el.innerHTML='<span class="sw" style="background:'+domColor(d)+'"></span>'+DOMAINS[d].ko;
    el.addEventListener("click",()=>{
      if(hiddenDom.has(d)){hiddenDom.delete(d);el.classList.remove("off");}
      else{hiddenDom.add(d);el.classList.add("off");}
    });
    legEl.appendChild(el);
  });

  window.addEventListener("resize",resize);
  // theme change repaint (colors are read live, so just ensure a repaint happens)
  window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{});

  // ---------- expose API for the query console tab ----------
  window.RLWRLD = {
    DOMAINS: DOMAINS,
    data: function(){ return GRAPHS.instance; },
    refresh: function(){ resize(); kick(); },
    focusInstance: function(id){
      document.querySelectorAll("#viewToggle button").forEach(function(x){ x.classList.toggle("on", x.dataset.v==="instance"); });
      view="instance"; G=GRAPHS.instance; hoverN=null; seed(); alpha=1; updCount();
      resize();
      var n=G.byId[id]; if(n) selectNode(n);
    }
  };

  resize(); seed(); updCount(); loop();
})();
</script>
<script>
(function(){
  var vg=document.getElementById("view-graph"), vl=document.getElementById("view-lineage"), fr=document.getElementById("lf-frame");
  var btns=document.querySelectorAll("#modeSwitch button");
  btns.forEach(function(b){ b.onclick=function(){
    var m=b.getAttribute("data-mode");
    btns.forEach(function(x){ x.classList.toggle("on", x===b); });
    vg.classList.toggle("on", m==="graph");
    vl.classList.toggle("on", m==="lineage");
    if(m==="lineage" && !fr.getAttribute("src")) fr.setAttribute("src","lineage-flow.html");
  };});
})();
</script>
