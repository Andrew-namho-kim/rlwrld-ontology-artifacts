<meta charset="utf-8">
<title>RLWRLD Ontology — Knowledge Graph</title>
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6;
    --ink:#141d2b; --ink-soft:#54627a; --ink-faint:#8b98ad; --line:#d6dce6;
    --accent:#245fd0;
    --edge:#c2cad6; --edge-isa:#d8dee8;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    /* domain categorical palette */
    --d-business:#3b74e8; --d-tech:#12a69c; --d-ecosystem:#e07b2f;
    --d-market:#c65ca0; --d-comms:#8b62d6; --d-ops:#6f7d90;
    --d-sources:#3fa45f; --d-strategy:#db4b4b; --d-org:#c99a1e;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0c1119; --surface:#141c27; --surface-2:#1b2430;
      --ink:#e9eef5; --ink-soft:#97a5ba; --ink-faint:#6a788d; --line:#28323f;
      --accent:#6fa4ff; --edge:#38424f; --edge-isa:#2b3542;
      --d-business:#5b90ff; --d-tech:#33c2b8; --d-ecosystem:#f0965a;
      --d-market:#e07bbd; --d-comms:#a684ee; --d-ops:#8b99ac;
      --d-sources:#54c47c; --d-strategy:#f16a6a; --d-org:#e6bd4a;
    }
  }
  :root[data-theme="light"]{
    --bg:#f5f7fa;--surface:#ffffff;--surface-2:#eef1f6;--ink:#141d2b;--ink-soft:#54627a;
    --ink-faint:#8b98ad;--line:#d6dce6;--accent:#245fd0;--edge:#c2cad6;--edge-isa:#d8dee8;
    --d-business:#3b74e8;--d-tech:#12a69c;--d-ecosystem:#e07b2f;--d-market:#c65ca0;
    --d-comms:#8b62d6;--d-ops:#6f7d90;--d-sources:#3fa45f;--d-strategy:#db4b4b;--d-org:#c99a1e;
  }
  :root[data-theme="dark"]{
    --bg:#0c1119;--surface:#141c27;--surface-2:#1b2430;--ink:#e9eef5;--ink-soft:#97a5ba;
    --ink-faint:#6a788d;--line:#28323f;--accent:#6fa4ff;--edge:#38424f;--edge-isa:#2b3542;
    --d-business:#5b90ff;--d-tech:#33c2b8;--d-ecosystem:#f0965a;--d-market:#e07bbd;
    --d-comms:#a684ee;--d-ops:#8b99ac;--d-sources:#54c47c;--d-strategy:#f16a6a;--d-org:#e6bd4a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  header{padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--surface);z-index:5}
  .htop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:1.12rem;font-weight:750;letter-spacing:-.02em;margin:0}
  .sub{font-size:.82rem;color:var(--ink-soft)}
  .kbd{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint)}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px}
  .toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .toggle button{border:none;background:none;font:inherit;font-size:.82rem;font-weight:600;color:var(--ink-soft);
    padding:6px 13px;border-radius:6px;cursor:pointer}
  .toggle button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font:inherit;font-size:.8rem;
    padding:6px 12px;border-radius:8px;cursor:pointer}
  .btn:hover{color:var(--ink)}
  .count{font-size:.78rem;color:var(--ink-faint);font-family:var(--font-mono)}

  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:11px}
  .lg{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-soft);cursor:pointer;
    user-select:none;padding:2px 4px;border-radius:5px}
  .lg:hover{background:var(--surface-2)}
  .lg.off{opacity:.35}
  .sw{width:11px;height:11px;border-radius:50%;flex:none}

  .stage-wrap{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.grabbing{cursor:grabbing}

  #detail{position:absolute;top:14px;right:14px;width:290px;max-width:calc(100vw - 28px);
    background:var(--surface);border:1px solid var(--line);border-radius:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);padding:15px 16px;font-size:.85rem;display:none;z-index:6}
  #detail.show{display:block}
  #detail .dclose{position:absolute;top:10px;right:12px;border:none;background:none;color:var(--ink-faint);
    font-size:1.1rem;cursor:pointer;line-height:1}
  #detail .dkind{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:5px}
  #detail h3{margin:0 0 3px;font-size:1.02rem;font-weight:750;letter-spacing:-.01em;padding-right:16px}
  #detail .ddesc{color:var(--ink-soft);font-size:.8rem;margin-bottom:10px}
  #detail .rel-h{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);margin:11px 0 5px}
  #detail .rel{display:flex;gap:7px;align-items:baseline;font-size:.8rem;padding:3px 0}
  #detail .rel .rn{font-family:var(--font-mono);color:var(--accent);flex:none}
  #detail .rel .rt{color:var(--ink)}
  #detail .rel .ri{color:var(--ink-faint);font-family:var(--font-mono);font-size:.72rem}

  .hint{position:absolute;left:14px;bottom:12px;font-size:.74rem;color:var(--ink-faint);
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:6}

  /* ---- tabs ---- */
  .tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .tab{border:none;background:none;font:inherit;font-size:.84rem;font-weight:650;color:var(--ink-soft);
    padding:6px 15px;border-radius:6px;cursor:pointer}
  .tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* ---- views ---- */
  .view{flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden}
  .view.on{display:flex}
  .subbar{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface);z-index:4}
  .subbar .controls{margin-top:0}
  .subbar .legend{margin-top:10px}

  /* ---- cli console ---- */
  .cli{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
  .cli-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 20px 12px;
    font-family:var(--font-mono);font-size:.82rem;line-height:1.6;color:var(--ink)}
  .cli-entry{margin:0 0 20px;max-width:880px}
  .cli-cmd{color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
  .cli-cmd .p{color:var(--accent);font-weight:700;margin-right:8px}
  .cli-res{margin-top:9px}
  .r-line{color:var(--ink)} .r-line b{font-variant-numeric:tabular-nums}
  .r-muted{color:var(--ink-faint)}
  .r-head{color:var(--ink-faint);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;margin:0 0 9px}
  .cli code{font-family:var(--font-mono);background:var(--surface-2);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;font-size:.92em;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
    border-radius:999px;padding:4px 12px;font-size:.78rem;color:var(--ink);cursor:pointer;
    font-family:var(--font-sans);transition:border-color .12s,transform .12s}
  .chip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip.ex{font-family:var(--font-mono);color:var(--ink-soft)}
  .node-card{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:15px 17px;max-width:580px}
  .nc-kind{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
  .node-card h4{margin:0 0 3px;font-size:1.05rem;font-family:var(--font-sans);font-weight:750;letter-spacing:-.01em}
  .nc-desc{color:var(--ink-soft);font-size:.82rem;font-family:var(--font-sans);margin-bottom:4px}
  .rel-h{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);margin:12px 0 5px}
  .rel-row{display:flex;gap:8px;align-items:baseline;padding:3px 0;flex-wrap:wrap}
  .rel-row .rn{color:var(--accent);flex:none;font-size:.78rem}
  .rel-row .rt{color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--ink-faint)}
  .rel-row .rt:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .rel-row .rc{color:var(--ink-faint);font-size:.74rem}
  .gobtn{margin-top:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
    font-family:var(--font-sans);font-size:.76rem;padding:6px 12px;border-radius:8px;cursor:pointer}
  .gobtn:hover{color:var(--ink);border-color:var(--accent)}
  .stat-rows{display:flex;flex-direction:column;gap:6px;max-width:470px}
  .stat-row{display:grid;grid-template-columns:120px 1fr 42px;align-items:center;gap:10px}
  .stat-name{font-family:var(--font-sans);font-size:.8rem;color:var(--ink);cursor:pointer}
  .stat-name:hover{color:var(--accent)}
  .stat-row .bar{height:9px;border-radius:5px;min-width:3px}
  .stat-num{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-soft);font-size:.8rem}
  .path{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:660px}
  .path-rel{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint)}
  .help{display:flex;flex-direction:column;gap:7px;max-width:580px}
  .help-row{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:baseline}
  .help-row span{font-family:var(--font-sans);font-size:.82rem;color:var(--ink-soft)}
  .welcome code{cursor:default}

  @media (max-width:640px){
    #detail{width:auto;left:14px;right:14px} .hint{display:none}
    .htop .sub{display:none}
    .stat-row{grid-template-columns:88px 1fr 34px}
    .help-row{grid-template-columns:1fr}
  }
  #view-lineage{padding:0}
  #lf-frame{width:100%;height:100%;border:0;flex:1;background:var(--bg)}
</style>

<div id="app">
  <header>
    <div class="htop">
      <h1>RLWRLD 온톨로지 · 지식 그래프</h1>
      <span class="sub">클래스와 인스턴스가 관계로 엮인 망. <span class="count" id="cnt"></span></span>
      <div class="toggle" id="modeSwitch" style="margin-left:auto">
        <button data-mode="graph" class="on">지식 그래프</button>
        <button data-mode="lineage">데이터 계보 흐름</button>
      </div>
    </div>
  </header>

  <section id="view-graph" class="view on">
    <div class="subbar">
      <div class="controls">
        <div class="toggle" id="viewToggle">
          <button data-v="schema" class="on">클래스 관계 (스키마)</button>
          <button data-v="instance">실제 데이터 (인스턴스)</button>
        </div>
        <button class="btn" id="resetBtn">보기 초기화</button>
        <label class="btn" id="typeToggleWrap" style="display:inline-flex;align-items:center;gap:7px;cursor:pointer">
          <input type="checkbox" id="typeToggle" style="margin:0"> 타입(클래스) 노드 표시
        </label>
        <label class="btn" id="strategyToggleWrap" style="display:inline-flex;align-items:center;gap:7px;cursor:pointer">
          <input type="checkbox" id="strategyToggle" style="margin:0"> Decision/Action 펼치기
        </label>
        <span class="kbd">드래그로 이동 · 휠로 확대 · 노드 클릭 시 상세</span>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="stage-wrap">
      <canvas id="cv"></canvas>
      <div id="detail">
        <button class="dclose" id="dclose" aria-label="닫기">×</button>
        <div class="dkind" id="dkind"></div>
        <h3 id="dname"></h3>
        <div class="ddesc" id="ddesc"></div>
        <div id="drels"></div>
      </div>
      <div class="hint" id="hint">화살표 = 관계(동사) · 점선 = is-a/타입 · 버블 클수록 연결 많음 · "타입 노드 표시" 켜면 ◆클래스 부모 등장</div>
    </div>
  </section>
  <section id="view-lineage" class="view">
    <iframe id="lf-frame" title="Data Lineage Flow"></iframe>
  </section>
</div>

ionItem","label":"여러 모델 동시 학습 흐름 추가 및 모델별 Preset 등록 통로 구성","desc":"진행중"},{"id":"ai-400","class":"ActionItem","label":"모델별 학습 Preset 제공 (등록 통로에 반영)","desc":"제안됨"},{"id":"ai-401","class":"ActionItem","label":"평가(대략적 평가) 상위 N개 모델 replay 기반 평가 및 미추천 사유 확인 흐름 UI 구성","desc":"진행중"},{"id":"ai-402","class":"ActionItem","label":"실제 로봇 평가용 task 단위 리더보드(모델·데이터셋·설정별 성능 비교) 대시보드 형태 검토","desc":"제안됨"},{"id":"ai-403","class":"ActionItem","label":"학습 UI 구성 확정 후 데이터 예시 및 표현(문구) 개선","desc":"제안됨"},{"id":"ai-404","class":"ActionItem","label":"RLDX 데모/파인튜닝 실험 조합 및 노션 문서 취합해 fine-tuning recipe 작성","desc":"진행중"},{"id":"dec-w30-001","class":"Decision","label":"RLDX 상용 프리트레이닝 NC 데이터 3종 배제 및 사내 재현 확정","desc":"non-commercial 라이선스 데이터 3종(Galaxea Open-World·AgibotWorld·Fourier ActionNet)을 배제하고 RLDX-1 pre-training을 사내에 내재화·재실행하기로 확정. L0(재현)→L1(NC 배제, must-ship) 변수 사다리 방식 채택. 컴퓨트는 네이버(데이터 소재지)."},{"id":"dec-w30-002","class":"Decision","label":"RLDX 모델 버전 체계(versioning scheme) 확정","desc":"GitHub model-code-versioning-survey.md에서 제안한 버전 체계를 채택하기로 확정. 다음 릴리즈 모델의 구체적 버전 번호(RLDX-1.1-PT 등)는 모델팀 내부 논의로 후속 결정."},{"id":"dec-w30-003","class":"Decision","label":"Renesas 건 핸드+AI만 전제로 재검토, HW 확정 후 재협의","desc":"Renesas 측 예산(500만 엔 이하)과 RLWRLD 제안(2000만 엔+)의 대폭 괴리로 금액 합의 불가. Renesas가 8~9월 중 평가용 휴머노이드를 확정·공유하면 그 후 대응 가부·견적을 재제시하기로 함. 리소스/우선도 불일치 시 사양도 선택지."},{"id":"dec-w30-004","class":"Decision","label":"KDDI Summit(10/27-28) 5본지 핸드 데모 전시 확정","desc":"KDDI Summit(10/27-28)에 5본지 핸드 실기 데모 전시 참가가 거의 확정됨. 메디어 대응은 KDDI 측과 연계 준비."},{"id":"dec-w30-005","class":"Decision","label":"프레스 릴리즈 월 1건 자체완결 정보 중심 발신 방침 합의","desc":"PR 에이전시 Platinum과 프레스 릴리즈를 월 1건 기준으로, 자사 내에서 완결 가능한 정보 위주로 발신하는 방침에 합의."},{"id":"dec-w30-006","class":"Decision","label":"마루노우치 웰니스 이벤트 사내 주력 이벤트로 확정","desc":"마루노우치 웰니스 이벤트(10/14-21 중 2일, 三菱地所/TMIP 연계)를 사내 주력 이벤트로 위치시키고 실기 라이브 데모를 실시하기로 함."},{"id":"dec-w30-007","class":"Decision","label":"NVIDIA Physical AI 생태계 보도자료 RLWRLD 주도 작성","desc":"NVIDIA 협업(DexBench 등) 관련 보도자료를 RLWRLD가 주도로 작성하기로 합의. 스페이스AI 등 참여사도 피기백 별도 자료 가능."},{"id":"dec-w30-008","class":"Decision","label":"HW Plan B — ODM/OEM 기성품 적극 탐색 미팅 kick-off","desc":"양산형 로봇이 27년 말 예상이어서 준양산형(올해 말)만으로는 부족. 스펙 기준 기성품/ODM/OEM을 적극 탐색하는 HW 미팅을 ASAP으로 kick-off하기로 결정."},{"id":"dec-w30-009","class":"Decision","label":"KDDI NEDO 사업계획서 8/4 제출 추진","desc":"KDDI NEDO 과제 사업계획서를 8/4까지 제출하기로 확정."},{"id":"dec-w30-010","class":"Decision","label":"Samsung DS A-FAB 초도 미팅 Discovery 진행","desc":"삼성전자 DS A-FAB기술팀 초도 미팅을 Discovery 중심으로 진행."},{"id":"dec-w30-011","class":"Decision","label":"Open Graph Labs wrist 모듈 후속 평가 추진","desc":"wrist pose 모듈 단독 활용 실익이 있어 후속 공급 문의 및 평가 유닛 대여를 추진하기로 함."},{"id":"dec-w30-012","class":"Decision","label":"UAE ADIO data center 협업 탐색","desc":"UAE ADIO에서 data center 관련 비디오콜 제안. CBO가 직접 챙기기로 함."},{"id":"dec-w30-013","class":"Decision","label":"모빌린트 NPU 과제 kick-off 8월 참여","desc":"선정된 모빌린트 NPU 과제 kick-off에 모델/platform/RD 각 1명 참여."},{"id":"dec-w30-014","class":"Decision","label":"K-AI Tech Week @ Silicon Valley 참여 검토","desc":"NIPA가 9월 실리콘밸리 행사 참여 추천. 의견 취합 중."},{"id":"dec-w30-015","class":"Decision","label":"AWS Roadshow 후속 HS효성/HD현대 네트워킹 추진","desc":"AWS Roadshow에서 HS효성·HD현대 접촉. 차주 follow-up 미팅 추진."},{"id":"dec-b30-001","class":"Decision","label":"2028 deployment 성공 변수를 정밀도 아닌 속도·생산성으로 규정","desc":"2028년 배포의 성공을 가르는 변수를 정밀도가 아니라 속도와 생산성으로 규정했다. 시간당 생산성이 사람과 비슷해지는 시점부터 투입 타당성이 발생하며, 속도가 사람의 70~50% 수준이 되는 순간 로봇 대수 증가로 ROI가 붕괴한다는 판단이다."},{"id":"dec-b30-002","class":"Decision","label":"기술 전략 two-track 병행 확정(빠른 generalization + high-precision)","desc":"기술 전략을 두 트랙으로 병행하기로 했다. 트랙1은 정밀도 요구가 낮고 빠른 generalization이 확보되는 작업(계산대 pick&place → 매대 정렬 → 삽입류 순 난이도 상승), 트랙2는 BMW 데모형 고정밀 작업으로 기존 모듈러 방식을 VLA 방식으로 전환한다. 트랙2 성공 시 precision·속도·generalization 동시 돌파로 2028 배포 가능 영역이 확대된다."},{"id":"dec-b30-003","class":"Decision","label":"산업별 우선순위 물류 > 유통 > 제조 > 호텔로 정리","desc":"2028 배포 기준 산업별 우선순위를 물류·유통·제조·호텔 순으로 정리했다. 물류는 물량이 가장 많고 조기 구현 가능성이 최고이며, 제조는 precision·insertion 난이도가 높아 전공정 부품 준비·kitting·공장 내 물류를 대안으로 둔다. 호텔은 난이도 상으로 재검토가 필요하다고 판단했다."},{"id":"dec-b30-004","class":"Decision","label":"호텔 2028 ROI 달성 곤란 판단 — 현실적 타임라인 정직 커뮤니케이션","desc":"호텔은 고객 대면 업무가 많아 성공 기준이 높고 residential과 industry의 중간 성격으로, 롯데호텔은 industry 기준 최고 난이도라고 판단했다. 2028년 ROI 달성이 어렵다고 보고 추가 밸류 제시 또는 현실적 ROI 타임라인의 정직한 커뮤니케이션으로 대응하기로 했다. 대안으로 사람 마무리 직전 단계의 broad한 선처리(체크아웃 후 쓰레기 수거, 어메니티 일괄 이동, 연회 스푼 정렬 후 박스 적재), 5성 대비 4성 우선 돌파, 비가동 시간의 고객 안내·엔터테이닝 활용을 검토했다."},{"id":"dec-b30-005","class":"Decision","label":"이마트 RX를 물류+유통 통합으로, 2028년은 물류 우선","desc":"난이도는 물류가 낮으나 그간 유통을 선택해 왔던 배경을 재검토해, 2028년에는 물류를 먼저 하고 결국 둘 다 하기로 정리했다. RX를 물류와 유통 통합 형태로 설계한다."},{"id":"dec-b30-006","class":"Decision","label":"이마트 표준 환경을 각 점포 강점 요소 조합으로 정립","desc":"역삼·송파·마포·은평·월계·왕십리 6개 점포 실사 결과 단일 점포가 전 항목 최고는 아니라고 판단해, 각 점포의 강점 요소를 모아 '이마트 표준 환경'을 정립하기로 했다. 송파(전 매대 표준 작업·관리 체계·암묵지), 역삼(관리 가능한 고객 밀도·주거 상권 표준형), 은평(매장 고객 배송·다층 물류 이동), 마포(법인 전환 후 첫 매장 상징성) 등 요소별로 취합한다."},{"id":"dec-b30-007","class":"Decision","label":"CJ대한통운 RX 1개월 유지 여부를 곤지암 핵심 공정 개방 컨펌에 연동","desc":"인덕션 한정 계약만으로는 RX의 의미에 의구심이 있다고 보고, 차기 PoC 설계를 위해 곤지암허브 핵심 공정을 열어주는 것이 컨펌되면 1개월 RX가 충분히 의미 있다고 정리했다. 거부될 경우 1개월을 유지할 이유가 없으므로 가격 네고 시 기간 조정도 함께 검토한다(2주 이내). RX 종료 후 팀은 HS효성으로 집중한다."},{"id":"dec-b30-008","class":"Decision","label":"롯데호텔 4성·위탁경영 RX 올해 4Q 착수(대금은 내년 이관)","desc":"롯데시티 마포(4성), L7 광명(위탁경영 전환 예정), 브리브 광주·L7 광주(위탁경영) 실사 결과를 바탕으로 4성·위탁경영 RX를 올해 4Q에 시작하고 대금 지급 등은 내년으로 이관하기로 정리했다. 연말 추가 예상되는 3성급까지 포함하면 6개월이 소요될 것으로 보며, 8월 이후 차년도 예산 수립 시 반영을 추진한다."},{"id":"dec-b30-009","class":"Decision","label":"효성 베트남은 공장 내 물류를 우선 검증 대상으로 설정","desc":"베트남 현지 인건비 대비 ROI 확보 난이도가 높다고 보면서도, 효성이 전략적으로 베트남 공장을 확대 중이고 자동화 확산 의지가 있어 공장 내 물류부터 우선 검증하기로 했다. 베트남 단일 타겟이 아니라 한국 공장 확산 가능성을 포함한 제조 전체 확장을 전제로 한다. RX SS 실시 후 2주 내 결과를 정리해 경영진 보고회 일정을 진행한다."},{"id":"dec-b30-010","class":"Decision","label":"롯데호텔 신규 데이터 큐레이션 재학습(실패 근접 궤적 제외)","desc":"신규 데이터의 실패 원인을 수집 당시 액션 비일관성과 실패에 가까운 궤적이 성공으로 라벨링된 데 있다고 진단했다. 모델이 그 패턴까지 모방하므로 약 150 에피소드 중 실패 근접 궤적을 제외하고 재학습(큐레이션)하기로 했다."},{"id":"dec-b30-011","class":"Decision","label":"BMW PoC embodiment를 Franka Research 3 + Inspire F1로 확정","desc":"BMW PoC / Modular VLA의 embodiment를 Franka Research 3 + Inspire F1으로 확정했다. RRC에 신규 로봇으로 통합, SpaceMouse + Manus 조합 텔레옵 리더 통합, RL/HIL용 impedance controller(force compliance) 구현까지 시스템 엔지니어링 3건을 완료해 직전 주의 '공수 큼' 블로커를 해소했다. 다음 단계는 이 시스템 위에 호출 가능한 스킬(expert)을 구현해 RLDX로 학습하는 expert calling modular VLA 아키텍처다. Franka는 7/22 입고, 자산코드 RW-RB-0387로 등록됐다."},{"id":"dec-b30-012","class":"Decision","label":"CJL PoC 예외처리 본 Phase 제외 + 속도 KPI 5~8초 정의","desc":"CJ대한통운 인덕션 PoC 제안서·KPI 확정 작업에서 예외처리는 본 Phase에서 구체화하지 않고 초당 SKU에 집중한 뒤 안정화 시 재논의하기로 확정했다. 수행속도 KPI는 5~8초 범위, 7~8초 수준으로 정의 제안했다. 7/23 제안서를 배포하며 Teleop 수집시간 500시간(1일 4시간 × 6개월), 모사환경 인덕션 2 SET(텔레옵 전용 1 / 휴먼데이터 수집용 1)을 명기했다."},{"id":"dec-b30-013","class":"Decision","label":"CJL 멀티카메라 수집을 ZED X 4세트로 진행(글래스형 제외)","desc":"CJL 멀티카메라 수집을 ZED X로 진행하기로 했다. 1세트는 ZED Box Orin 1 + ZED X 4 + GMSL2 연장케이블 10m 4로 구성하며, 곤지암 허브 인덕션이 4개 라인이므로 4세트가 필요하다. 글래스형은 대규모 수집 안정성이 미검증이라 이번에는 제외하고, Ego View는 롯데호텔 장비 유용을 검토한다."},{"id":"dec-b30-014","class":"Decision","label":"DEXCAP-GL 1대 구매 확정, ROBOTIS exoskeleton 미사용","desc":"일본 RD 텔레옵 장비로 DEXCAP-GL 1대 구매를 확정했다(Woody 제안 → 준수 승인, 8월 내 배송). ROBOTIS exoskeleton 2종은 구동범위 문제로 미사용하고 현재 Manus 글러브를 주력으로 쓴다. DexRobot 측은 2개 USD 9,000을 제안했다."},{"id":"dec-b30-015","class":"Decision","label":"AI Worker DDS 스택 정리 — rmw_zenoh 기본 + Manus 연동 CycloneDDS 통일","desc":"AI Worker 릴리스는 rmw_zenoh를 기본으로 하고 Zenoh 라우터 실행을 필수로 정리했다. Manus(Humble)와 AI Worker(Jazzy) 간 연동은 Fast DDS의 2.6 vs 2.14 호환 이슈 때문에 CycloneDDS로 통일한다. Gazebo 시뮬에서는 통신이 확인됐으나 Orin을 host PC에 LAN 연결하고 ROBOTIS Hand를 Orin에 연결한 실제 구성에서 PC–Orin 구간 serialization 오류가 발생해 디버깅 중이다."},{"id":"dec-b30-016","class":"Decision","label":"Evaluator를 성공/실패 직접 판정에서 진행률 기반 판정으로 전환","desc":"Long Horizon Evaluation Model에서 성공/실패 직접 판정의 정확도가 낮아 진행률 기반 판정으로 전환하기로 했다. VLA의 VLM backbone feature에 Mamba head를 붙여 O(n) 복잡도를 확보하고, Gemini로 4개 task 약 600 에피소드의 진행률을 라벨링하며 정지·역동작 삽입으로 데이터를 증강한다. 레포는 RLWRLD/rd-long-horizon이다."},{"id":"dec-b30-017","class":"Decision","label":"RB-Y1 롯데호텔 → L7 이동 및 신규 로봇 입고 전 휴먼데이터 집중 수집","desc":"7/28 RB-Y1을 롯데호텔에서 L7 사무실로 이동(15:00 상차)했다. 파일럿 4명 중 용화·지윤은 신규 로봇 입고 시까지 L7로 출근하고, 8월 초 입고 전까지 휴먼데이터(Mannequin) 수집에 집중한다. 다음 주 계획으로 Human Data Pipeline(Mannequin) sim 롤아웃과 RB-Y1 롯데 재배치·초기 셋업을 8/7까지 두었다."},{"id":"dec-b30-018","class":"Decision","label":"밸류 추정을 VLM 기반에서 로보미터(RoboMeter) 기반으로 전환","desc":"VLM 기반 밸류 추정이 노이즈가 많고 신뢰도가 낮음을 확인해 로보미터 기반 밸류 산출로 결정했다. 오프라인 상황에서는 액션 탐색이 데이터셋에 제한되어 복잡한 크리틱 알고리즘 적용에 한계가 있으므로, 온라인 Q함수 이식보다 로보미터 기반 밸류 라벨링을 우선한다. 어드밴티지 예측 노이즈 억제를 위해 EMA/가우시안 필터를 도입한다."},{"id":"dec-b30-019","class":"Decision","label":"RL Subgroup 회의 운영 변경 — 발표 시간 제한 및 토픽 분리","desc":"회의 효율화를 위해 발표 시간을 제한하고 토픽을 분리하기로 했다. 리캡(Re-cap) 안정화와 크리틱(Critic) 개선 토픽을 분리해 논의하며 발표 순서와 자동화 템플릿을 조정하고, 발표 참여는 선택적으로 운영한다."},{"id":"dec-b30-020","class":"Decision","label":"실세계 배포용 RL을 레지듀얼 RL 중심으로 탐색","desc":"레지듀얼 방식과 플로우 스페이스 변형 방식 중 레지듀얼 RL 중심으로 탐색하기로 하고 TD3 기반 Q값 분석을 진행했다. 안정화 기법으로 KL 레귤러라이제이션으로 베이스 폴리시와의 편차를 관리하고, L2 대신 L1 로스로 차원별 선택적 레지듀얼 액션을 생성해 성능 향상을 확인했다. 크리틱 아키텍처는 FiLM 구조처럼 액션 정보를 네트워크 중간에 주입하는 방식이 액션 분별력 향상에 효과적이었다."},{"id":"dec-b30-021","class":"Decision","label":"인적 개입 전략은 넛지보다 텔레옵 직접 개입 채택","desc":"인적 개입(HI) 전략 비교에서 넛지(Nudge)보다 롤아웃을 멈추고 텔레오퍼레이션으로 전환하는 직접 개입이 성공률 개선에 더 효과적이라고 판단했다. 첫 테스트를 진행할 예정이며, 스페이스 마우스는 노이즈 등 제어 이슈로 추가 시험·검증이 필요해 Manus Viper 셋업으로 재개한다."},{"id":"dec-biz-001","class":"Decision","label":"파스토 물류 자동화 실증 범위 축소 접근 결정","desc":"전면 자동화 대신 특정 고객사·제한된 박스 사이즈로 범위를 좁혀 검수·피킹 자동화를 실증하기로 함"},{"id":"dec-biz-002","class":"Decision","label":"8월 로봇 데모 시나리오 1차 방향 설정","desc":"8월 알렉스 핸드 데모를 우유 붓기·피규어 진열·붓펜 글씨 3개 필수 + 젤리 글자 만들기는 옵션(고도화)으로 구성"},{"id":"dec-biz-003","class":"Decision","label":"우유 붓기 데모 투명컵 진행 결정","desc":"투명컵 RGB 세그멘테이션 인식이 가능함을 확인하고 우유 붓기 데모를 투명컵으로 진행하기로 함"},{"id":"dec-biz-004","class":"Decision","label":"데모 구현 방식 - 모델 기반 후 러닝 기반 발전","desc":"8월 데모는 로봇팀 중심 모델 기반으로 구현하되, 로봇팀+인텔리전스팀이 러닝 기반으로 발전시키기로 함"},{"id":"dec-biz-005","class":"Decision","label":"만도 공장 우선 적용 과제 선정","desc":"노조 반감 최소화를 위해 인력 대체가 아닌 작업자 기피 단순반복 업무(Base Assy 입하·바코드 매칭) 보조를 우선 과제로 설정"},{"id":"dec-biz-006","class":"Decision","label":"만도 로봇 타입 - 휠베이스 양팔 로봇 채택","desc":"기술적 안정성과 노조 저항감을 고려해 이족보행 대신 휠 베이스 기반 모바일 베이스 양팔 로봇으로 실증하기로 함"},{"id":"dec-biz-007","class":"Decision","label":"시나노켄시-RLWRLD 로봇핸드 공동개발 방향 합의","desc":"시나노켄시의 소형 3지 액추에이터 모터 기술과 RLWRLD의 5-finger 핸드 기술을 결합해 공동 개발하는 방향으로 합의"},{"id":"dec-biz-008","class":"Decision","label":"로봇 핸드 PoC 검토 기준을 Option 3 사양으로 확정","desc":"Maxon 협업 로봇 핸드 PoC의 목표 스펙을 RLWRLD Option 3 사양으로 재확인하고, 손가락 길이를 핵심 제약으로 고정했다."},{"id":"dec-biz-009","class":"Decision","label":"칩 벤더를 ST로 고정하지 않고 복수 옵션 비교 검토","desc":"MCU/칩 벤더를 ST에 묶지 않고 TI 등 대안을 포함해 복수 옵션을 비교 검토하기로 결정."},{"id":"dec-biz-010","class":"Decision","label":"PoC 단계에서 CANopen 적용 허용","desc":"장기적으로 CAN FD가 유력하더라도 초기 PoC에서는 구현 난이도를 낮추기 위해 CANopen 적용을 허용하기로 결정."},{"id":"dec-biz-011","class":"Decision","label":"PoC에서 카탈로그 외 신규 모터/샘플 및 대형 보드 사용 허용","desc":"양산형에 가까운 구조 탐색을 위해 off-the-shelf 외 신규 모터/샘플도 테스트하고, PoC 단계에서는 기존/큰 보드 사용과 form factor 제약 완화를 허용."},{"id":"dec-biz-012","class":"Decision","label":"MSRA 협업 첫 데모 task로 Candidate 1(전구 소켓 작업) 선정","desc":"MSR과의 RL+VLA 협업에서 3개 후보 중 양손 조작 활용이 가능한 Candidate 1(전구 소켓 작업)로 시작하는 데 합의."},{"id":"dec-biz-013","class":"Decision","label":"DexBench 벤치마크 태스크 리스트 13개로 정리 및 파이널라이즈","desc":"초기 15개 태스크를 용재 피드백 반영해 13개로 정리하고, 난이도별 레벨 체계로 발전시키며 다음 금요일까지 1차 확정하기로 함."},{"id":"dec-biz-014","class":"Decision","label":"태스크 그룹 기반 비즈니스 POC 진행 및 RX/RD 로드맵 정렬","desc":"정리된 태스크 그룹을 기반으로 비즈니스 PoC를 진행하고 RX·RD 팀 로드맵을 동일 프레임워크에 맞춰 정렬하기로 함."},{"id":"dec-biz-015","class":"Decision","label":"벤치마크 데모 영상을 시나리오형 티저로 제작","desc":"개별 작업 영상 대신 하나의 시나리오를 담은 긴 영상/티저로 제작해 G0·S0를 대표하기로 방향 합의."},{"id":"dec-biz-016","class":"Decision","label":"국책과제 그룹별 대표(그룹장) 기관 확정","desc":"WFM은 NC AI, RFM은 리얼월드, 시뮬레이터는 한국자동차연구원, 데이터는 NC AI(임시)로 그룹 대표 기관을 확정함."},{"id":"dec-biz-017","class":"Decision","label":"시뮬레이터 파트 참여기관 확정 (펑션베이+서울대 위탁)","desc":"펑션베이는 참여기관으로, 서울대 이동준 교수는 위탁 형태로 참여시켜 시뮬레이터 파트를 보강하기로 확정함."},{"id":"dec-biz-018","class":"Decision","label":"테스트베드 기업은 수요기업 형태로 참여 결정","desc":"테스트베드 기업들은 컨소시엄 참여기관이 아니라 수요기업 형태로 참여시키기로 결정함."},{"id":"dec-biz-019","class":"Decision","label":"로봇 하드웨어 플랫폼 레인보우 로보틱스 1순위 추진","desc":"데이터셋 일관성과 기술 노하우 확보를 위해 레인보우 로보틱스를 1순위로 추진하고, 로보로스·위로보틱스 등을 대안으로 검토하기로 함."},{"id":"dec-biz-020","class":"Decision","label":"KETI 컨소시엄(IITP 국책과제) 1단계 불참 결정","desc":"KETI 주관 IITP 국책과제 참여 제안에 대해 참여 어려움(불참)을 전달하되, 향후 협력 여지는 지속 유지하기로 함."},{"id":"dec-biz-021","class":"Decision","label":"과기부 과제 실증 범위를 덱스트러스 서브스킬 우선 검증으로 확정","desc":"롱 호라이즌 전체 공정 이전에 덱스트리티가 요구되는 특정 서브스킬(필름 떼어 컨베이어에 올리기)을 우선 검증하고, 연구실 내 모사 환경을 구축해 텔레오퍼레이션 데이터를 수집하기로 함."},{"id":"dec-biz-022","class":"Decision","label":"이마트 대표이사 첫 미팅을 공식 보고 형식으로 진행 결정","desc":"티타임 선제안이 있었으나 대표이사 스타일을 고려해 첫 미팅은 공식 보고 형식으로 진행하기로 하고 3/30 주간 보고 일정을 셋업하기로 함."},{"id":"dec-biz-023","class":"Decision","label":"이마트 접근 전략을 전략 컨설팅형 장기 선투자 관점으로 설정","desc":"단순 PoC 비용 집행 부담을 줄이기 위해 전략 컨설팅 형태의 상위 담론 형성을 병행하고, 단기 수익보다 5년 이상 장기 선투자 관점으로 접근하기로 함."},{"id":"dec-biz-024","class":"Decision","label":"B200 GPU 국책과제 주관기관을 RLWRLD가 맡기로 결정","desc":"B200 GPU 256장 지원 특화모델 과제에서 카이스트 대신 RLWRLD가 주관기관을 맡고 국책과제 경험 부족은 다른 강점으로 보완하는 방향으로 가닥을 잡음."},{"id":"dec-biz-025","class":"Decision","label":"Model Weekly 운영 방식 개편","desc":"Model Weekly 아젠다에 Key Updates from Other Teams(준원 담당)와 Project Progress Review를 추가하기로 함"},{"id":"dec-biz-026","class":"Decision","label":"SK 로보틱스 프로젝트 진행 방식 확정","desc":"전통 컨설팅 대신 공동 문제해결 및 Field Trip 기반 가설검증 방식으로 진행하기로 확정."},{"id":"dec-biz-027","class":"Decision","label":"벤치마킹 대상 지역 확정","desc":"벤치마킹 대상을 중국 심천 로봇 제조·부품 생태계와 미국 서부 AI/로봇 스타트업으로 확정."},{"id":"dec-biz-028","class":"Decision","label":"자료 공유 및 NDA 체결 절차 확정","desc":"RX 분석 데이터·글로벌 동향 자료를 구글드라이브/팀즈로 공유하고, 상호 NDA 체결 후 자료 공유 및 계약 진행하기로 함."},{"id":"dec-biz-029","class":"Decision","label":"Dexterity 벤치마크 학술 협력 방식 합의","desc":"RLWRLD가 Dexterity 분류 가설·문헌 자료를 공유하고 윤명환 교수가 학술적 피드백·아이디어를 제공하는 형태로 협력하기로 협의."},{"id":"dec-biz-030","class":"Decision","label":"택타일 데이터 수집 병렬 전략 채택","desc":"단일 방식 올인을 지양하고 외부구매·아웃소싱·자체수집을 병렬 탐색하며 소량씩 iterative하게 테스트하는 접근으로 합의."},{"id":"dec-biz-031","class":"Decision","label":"외부 데이터 구매 원칙: 상용 라이선스 우선","desc":"외부 데이터는 commercial 라이선스로 사용 가능한 데이터를 우선하고, 업체당 1시간 무료 샘플 테스트 후 필요 시 2차 유상 샘플(10~100시간)을 구매하기로 함."},{"id":"dec-biz-032","class":"Decision","label":"장영재 교수 대형 국책과제 VLM/VLA 파트 전담 확정","desc":"장영재 교수 대형 정부과제에서 VLM/VLA 파트를 신진우 교수가 전담하기로 확정."},{"id":"dec-biz-033","class":"Decision","label":"이마트 Physical AI 도입 긍정 검토 합의","desc":"이마트 현장의 고인건비·고령화 문제 해결을 위해 RLWRLD 피지컬 AI 도입을 긍정적으로 검토하기로 함."},{"id":"dec-biz-034","class":"Decision","label":"이마트-RLWRLD JV 등 협업모델 구축 합의","desc":"투자를 포함한 양사 간 적극적 협업 모델(JV 등)을 구축해 나가기로 합의."},{"id":"dec-biz-035","class":"Decision","label":"S0 백본을 G0 v1.4 8b로 확정","desc":"3b 모델을 새로 만들지 않고 G0 v1.4 8b를 S0 백본으로 사용하기로 결정, G0/S0 모델 라인을 통합."},{"id":"dec-biz-036","class":"Decision","label":"MSRA와 전구 조작 태스크 협업 진행 결정","desc":"Microsoft Research Asia(MSRA)와 협업으로 테이블 전구를 잡아 소켓에 꽂고 돌려 켜는 태스크(알렉스 시뮬레이션)를 진행하기로 함."},{"id":"dec-biz-037","class":"Decision","label":"프로젝트별 임시 조직(프로젝트팀) 구성 결정","desc":"조직 규모 확대에 따라 장기 관점 주요 과제에 집중하기 위한 프로젝트 팀(Tele-op, Human data, Data, RL)을 구성하기로 함."},{"id":"dec-biz-038","class":"Decision","label":"연구실별 국책/공동연구 과제 합의 및 계약 진행","desc":"shin·cho·joo·lim·choi 연구실별 과제 내용이 상호 합의되어 계약을 진행하기로 함."},{"id":"dec-biz-039","class":"Decision","label":"Cube_Box_Box 벤치마크 데이터 V4로 재취득 결정","desc":"1차 수집 데이터의 추론 성능이 좋지 않아 Cube_Box_Box 태스크를 V4로 재취득하기로 함(취득일 미정, 다른 중요 task 수행 후)."},{"id":"dec-biz-040","class":"Decision","label":"나비프라 AMR 연동 ROS2 기반 확정 및 주행 API 권한 개방","desc":"RLWRLD 상부 모듈과 나비프라 AMR을 ROS2 기반으로 연동하고, 나비프라가 이동 제어(V, Omega)·지도 정보 등 주행 API 권한을 개방·제공하기로 합의함."},{"id":"dec-biz-041","class":"Decision","label":"로봇 대여·인수 일정 1월 중순~말 잠정 합의","desc":"1월 중순~말 경 나비프라 로봇을 대여하여 RLWRLD가 인수해가는 일정으로 잠정 합의함."},{"id":"dec-biz-042","class":"Decision","label":"모빌린트가 RLWRLD를 VLA 과제 주관부서(KETI/ETRI)와 연결","desc":"신동주 대표가 KETI·ETRI 담당자와 논의 후 VLA 과제 주관 부서와 RLWRLD를 연결해주기로 결정함."},{"id":"dec-biz-043","class":"Decision","label":"코넥티브-리얼월드 협업 및 ARPA-H 국책과제 공동 지원 합의","desc":"코넥티브의 수술 로봇 하드웨어·데이터와 리얼월드의 로봇 제어 모델을 결합해 수술 보조 시스템을 개발하기로 합의하고, ARPA-H 과제에 컨소시엄으로 공동 지원하기로 함."},{"id":"dec-biz-044","class":"Decision","label":"코넥티브 수술실 3D 데이터 샘플 공유로 학습 유효성 검증","desc":"코넥티브가 보유한 수술실 3D 영상 데이터(연구용 승인본)를 리얼월드에 샘플로 공유하여 학습 유효성을 검증하기로 합의함."},{"id":"dec-biz-045","class":"Decision","label":"RUKA·ORKA·G1 담당자 지정 보류","desc":"RUKA, ORKA, G1 하드웨어 담당자 지정은 경환님 합류 후 결정하기로 하고 그 전까지는 Storm이 택배 수령 등만 임시로 챙기기로 함"},{"id":"dec-biz-046","class":"Decision","label":"AWS와 3대 축 협업 모델 구축 합의","desc":"AWS와 비즈니스(RX컨설팅·GTM)·테크(클라우드 인퍼런스·공동 벤치마크)·인프라(R&D·디플로이먼트) 3대 축의 원팀 협업 프레임워크를 구축하기로 합의."},{"id":"dec-biz-047","class":"Decision","label":"금요일 APJ 미팅 발표 팩 구성 확정","desc":"금요일 AWS APJ 통합 TF 미팅용 발표 자료를 비즈니스·테크·인프라 3대 축 오버럴 협업 프레임워크 장표와 롯데호텔 RX 영문 사례로 구성하기로 함."},{"id":"dec-biz-048","class":"Decision","label":"ARPA-H 2차년도 기관별 R&R 분담 확정","desc":"리얼월드는 핸드 인터랙션·파운데이션 모델 학습·데이터 처리, 로엔서지컬은 시스템 통합·정밀 제어·팔 경로계획, 서울대병원은 공간 제공·데모 시나리오 검토로 역할 분담 확정."},{"id":"dec-biz-049","class":"Decision","label":"11월 데모 하드웨어 플랫폼 로엔 휴머노이드 채택","desc":"11월 데모용 하드웨어로 로엔서지컬이 5월 말까지 완성할 머리-토르소-팔 구조 휴머노이드 플랫폼을 공통 활용하기로 함."},{"id":"dec-biz-050","class":"Decision","label":"데이터 수집 서울대병원 공간 확보 계획","desc":"6월 이후 서울대병원 내 공간(11층 회의실 등)을 확보해 멀티카메라 기반으로 집중 데이터 수집하기로 함."},{"id":"dec-biz-051","class":"Decision","label":"한-독 국책과제 GITCC 공동 참여 추진","desc":"5월 29일 마감인 KIAT 주관 한-독 GITCC 국책과제(5년 100억 규모)에 Fraunhofer IPT와 컨소시엄으로 공동 참여를 적극 추진하기로 함."},{"id":"dec-biz-052","class":"Decision","label":"장기 산업용 로봇 벤치마크 공동개발·GTM 협력","desc":"장기적으로 실제 제조 현장 적용 가능한 산업용 로봇 조작 벤치마크 공동 개발과 Fraunhofer 네트워크 기반 시장 진출 협력을 이어가기로 함."},{"id":"dec-biz-053","class":"Decision","label":"NIPA AX 스프린트 RFP를 RLWRLD 제공 정보 기반으로 작성","desc":"NIPA가 리얼월드 제공 정보를 바탕으로 AX 스프린트(피지컬 AI) 과제의 RFP 요구사항과 목표 기준을 설정하기로 함."},{"id":"dec-biz-054","class":"Decision","label":"수요조사 자료 핵심 내용 위주로 이메일 제출 합의","desc":"정식 수요조사 양식을 쓰되 모든 항목이 아닌 핵심 내용(모델 스펙, 후보 도메인 시나리오) 위주로 작성해 이메일 제출하기로 협의."},{"id":"dec-biz-055","class":"Decision","label":"HL만도와 3월 RX 착수·6월 POC 목표 및 NDA 착수","desc":"양사가 3월 중 RX 프로젝트 착수, 6월 POC 진행을 목표로 하고 NDA 체결 및 실무 논의에 착수하기로 함."},{"id":"dec-biz-056","class":"Decision","label":"ANA 데모 우선 영역을 수화물 pick and place로 선정","desc":"ANA 데모에서 기존 PoC 집행 예산이 있는 수화물(UDL baggage handling) pick and place를 우선 실행 영역으로 선정."},{"id":"dec-biz-057","class":"Decision","label":"MCI 데모 태스크 확정","desc":"MCI 제공 태스크(실린더 테이프 포장/드라이브 기판 조립)로 데모 안 확정."},{"id":"dec-biz-058","class":"Decision","label":"KDDI/LAWSON·Shimadz 데이터 파트너십은 8월 데모 결과 이후 결정","desc":"KDDI/LAWSON SKU 데이터 습득 및 Shimadz 협업 진행 여부는 8월 데모 결과 검토 이후로 결정을 보류."},{"id":"dec-biz-059","class":"Decision","label":"GTC Taipei RLWRLD 부스 참가 확정","desc":"GTC Taipei에 RLWRLD 부스 참가가 확정되고 부스 배정이 완료됨."},{"id":"dec-biz-060","class":"Decision","label":"4/29 NVIDIA 본사팀 방한 미팅 오후 4~5시로 잠정 합의","desc":"4월 29일 NVIDIA 본사팀 방한 미팅 시간을 당초 3~5시에서 오후 4~5시로 조율해 잠정 합의(캘린더 블락 및 내부 확정 필요)."},{"id":"dec-biz-061","class":"Decision","label":"LGE 3D 도면부터 전달받아 Mini PoC·Rx 설계 제안 진행","desc":"LGE 부품 자동화 검토를 위해 우선 3D 도면부터 전달받고, RLWRLD가 이를 활용해 Mini PoC 및 Rx 설계 제안과 샘플 핸들링 테스트를 진행하기로 협의."},{"id":"dec-biz-062","class":"Decision","label":"1단계 데모는 자체 개발 로봇으로 시연","desc":"상용 로봇 구매 대신 자체 개발 로봇으로 1단계 최종 데모를 시연하기로 의견 일치."},{"id":"dec-biz-063","class":"Decision","label":"엔드이펙터는 상용도구 어댑터 우선, 전용도구 단계 개발","desc":"과제 기간 내 복잡한 로봇 핸드 개발은 어렵다고 보고, 1차로 상용 수술도구 어댑터를 개발한 뒤 단계적으로 전용 도구를 개발하는 방향 채택."},{"id":"dec-biz-064","class":"Decision","label":"데모 시나리오·R&R은 차기 워크숍에서 확정","desc":"구체적 데모 시나리오, 기관별 R&R 및 연차별 일정, AI 모델 입출력 데이터 형식은 차기 워크숍에서 확정하기로 함."},{"id":"dec-biz-065","class":"Decision","label":"과제 범위를 스크럽·리트랙션 중심 단계적 접근으로 설정","desc":"수술 전체 자동화는 리스크가 높아, 스크럽·리트랙션 두 영역 중심의 단계적 접근으로 과제 범위를 좁히는 데 의견 일치."},{"id":"dec-biz-066","class":"Decision","label":"비루틴·돌발 상황을 초기 과제 범위에서 제외","desc":"루틴 수술 중심으로 데이터를 수집하고, 비루틴·돌발 상황(약 5~10%)은 초기 과제 범위에서 제외하는 전략 채택."},{"id":"dec-biz-067","class":"Decision","label":"척추측만증 수술 대상 리트랙션 데이터 수집 우선 진행","desc":"장시간(4~8시간) 수술로 자동 리트랙션 수요가 있는 척추측만증 수술을 대상으로 리트랙션 데이터 수집을 우선 진행하기로 함."},{"id":"dec-biz-068","class":"Decision","label":"테스트 로봇은 프로젝티브 로봇 활용, 로봇 핸드는 협업 개발","desc":"수술실 진입 인증을 받은 프로젝티브 개발 로봇을 테스트에 활용하고, 로봇 핸드(엔드이펙터)는 협업으로 개발하는 방향."},{"id":"dec-biz-069","class":"Decision","label":"오네 MP 인덕션 분류에 집중, 피킹·포장 전면 제외","desc":"FT본부(풀필먼트)의 피킹·포장 자동화(Wave 2~3)를 과제 범위에서 전면 제외하고, 오네본부(택배)의 MP 인덕션 분류(바코드 상향 투입) 작업에 역량을 집중하기로 확정."},{"id":"dec-biz-070","class":"Decision","label":"현장진단(RX)과 데이터 파트너십을 단일 계약으로 통합","desc":"현장 진단(RX) 프로세스와 데이터 파트너십 구축을 분리하지 않고 하나의 단일 계약서 체계로 통합 진행하기로 함."},{"id":"dec-biz-071","class":"Decision","label":"신규 MOU에 JV 설립·중장기 로드맵 명시, 브랜드 론칭에 연동 공표","desc":"작년 포괄 MOU보다 구체화하여 2028년 현장 대규모 적용·2029년 JV 설립을 포함한 중장기 로드맵을 신규 MOU에 담고, CJ대한통운 7~8월 신규 기술 브랜드 론칭 일정에 연계해 대외 공표하기로 함."},{"id":"dec-biz-072","class":"Decision","label":"데이터·기술 권리 구조 원칙 정리","desc":"원본 데이터는 CJ대한통운 소유, 가공 데이터는 공동 소유, 외부 반출·수익화는 양사 합의를 전제로 하는 원칙으로 정리."},{"id":"dec-biz-073","class":"Decision","label":"1차 POC 기간·수준 확정, 세부 성능지표는 RX 후 확정","desc":"2026년 7~12월 6개월간 실제 현장 조업 테스트 수준의 POC를 지향하기로 확정하고, 세부 기술 성능 목표치는 착수 직후 약 5주간 RX 현장 진단 후 협의·확정하기로 함."},{"id":"dec-biz-074","class":"Decision","label":"스테이셔너리 환경 PoC로 설정, 12월까지 동영상 결과물","desc":"모바일 매니퓰레이터 대신 스테이셔너리 환경에서 복잡 형상 부품 피킹·플레이스 PoC로 범위를 축소하고, 최종 결과물은 12월까지 동작 시연 동영상으로 설정."},{"id":"dec-biz-075","class":"Decision","label":"3개 작업 중 핀 꽂기 제외, 단순 피킹·홈 끼우기 2개 진행","desc":"3가지 대상 작업 중 힘 제어가 필요한 Fixed scroll 핀 꽂기 작업은 제외하고, Main frame 단순 피킹과 Orbit scroll 홈 끼우기 2가지를 진행하는 방향으로 협의."},{"id":"dec-biz-076","class":"Decision","label":"손 형태 그리퍼 사용 추진(페이로드 2.5kg 한계 내)","desc":"일반 2-Finger 대신 손(Hand) 형태 그리퍼 사용을 추진하되, 현재 상용 손 그리퍼(Tesslo)의 페이로드 약 2.5kg 한계 내에서 PoC를 진행하기로 논의."},{"id":"dec-biz-077","class":"Decision","label":"BGF 제안을 단기 PoC 중심 전략으로 확정","desc":"BGF 경영진 눈높이에 맞춰 중장기 전략보다 인건비 절감·매장 효율화 등 단기 성과를 보여주는 PoC 중심 접근으로 제안 방향을 확정함."},{"id":"dec-biz-078","class":"Decision","label":"3월 중 BGF 식품공장·물류센터 실사 진행 확정","desc":"진천 소재 BGF 식품공장·물류센터를 3월 중 방문해 1인칭 영상·마노 장비로 현장 데이터를 수집하고, 전무급 미팅에서 제안서 초안을 검증·수정하기로 함."},{"id":"dec-biz-079","class":"Decision","label":"SK 프로젝트 종료 후 내부 인력 BGF/푸즈로 전환 배치","desc":"SK 프로젝트 마무리에 맞춰 일규 등 내부 인력을 BGF/푸즈 프로젝트로 단계적으로 전환 배치해 실행력을 확보하기로 함."},{"id":"dec-biz-080","class":"Decision","label":"IITP 월드 파운데이션 모델 선도사업 참여 의사 표명","desc":"340억 규모 IITP 피지컬 AI 월드 파운데이션 모델 선도사업(선행과제)에 로봇 파운데이션 모델(정교한 로봇 손) 분야로 참여 의사를 표명함."},{"id":"dec-biz-081","class":"Decision","label":"동원F&B PoC를 EY와 공동 개발 추진","desc":"동원F&B 식품공장(라인당 12명 중 50% 로봇화, 전국 13개 공장)을 첫 실증 유즈케이스로 EY와 공동 개발 추진하기로 함."},{"id":"dec-biz-082","class":"Decision","label":"EY와 협업 공식화 및 역할 분담 합의","desc":"RLWRLD(모델·데이터·로봇HW·텔레옵·학습가이드) + EY(PM·고객네트워크·AI/디지털트윈 인력·DCS/PLC 연계) 역할 분담에 합의하고, 협업 deck 공동 작성 및 협업 기사 publish를 추진하기로 함."},{"id":"dec-biz-083","class":"Decision","label":"NIPA 국책과제(4/17 마감) 연계 추진","desc":"동원F&B 실증을 과기부/NIPA 과제(2년 30억, 4/17 마감)와 연계 추진하기로 하고, 수락 시 마음AI 협업 제안 정리가 필요함."},{"id":"dec-biz-084","class":"Decision","label":"NVIDIA+AWS+EY+RLWRLD 글로벌 벤치마크 케이스 구축 방향 합의","desc":"양사 모두 보유한 NVIDIA·AWS 글로벌 협업 프레임워크를 활용해 한국에서 Physical AI 벤치마크 케이스를 함께 만들자는 중장기 방향에 초기적으로 합의함."},{"id":"dec-biz-085","class":"Decision","label":"3SECONDZ와 PoC·데이터 협력 추진 및 NDA 우선 체결","desc":"양사가 PoC 및 데이터 비즈니스 협력을 긍정적으로 추진하기로 합의하고, 구체 정보 공유를 위해 NDA를 우선 체결하기로 함."},{"id":"dec-biz-086","class":"Decision","label":"PoC는 로봇 핸드 사용·하이브리드 접근으로 확정","desc":"PoC 핵심은 RLWRLD 정체성인 '로봇 핸드' 사용(그리퍼 배제)이며, 100% 학습 기반일 필요는 없으나 비전/정교조작에는 학습 기반 기술을 반드시 일부 포함하는 하이브리드 방식을 원칙으로 함."},{"id":"dec-biz-087","class":"Decision","label":"본격 PoC 전 프리 PoC(중간 마일스톤) 선행 진행","desc":"본격 PoC에 앞서 3SECONDZ가 단순 제스처·쉬운 Pick&Place, 편의점 상품 진열 등 특정 과제를 단순화해 먼저 개발하는 '프리 PoC' 단계를 갖기로 함."},{"id":"dec-biz-088","class":"Decision","label":"백서에 기여자(Acknowledgement)로 이름 명시하기로 합의","desc":"백서가 95% 완성 단계라 공동 저자 등재는 어려우므로, 코멘트를 통한 수정 제안을 반영하되 기여자(Contributor/Reviewer)로 감사의 글 섹션에 이름을 명시하기로 합의함."},{"id":"dec-biz-089","class":"Decision","label":"Inspire + Franka 조합으로 확정","desc":"Allex sim/real 이외 조합으로 Inspire + Franka 조합을 채택하기로 hk가 결정, 우선순위 상으로 바로 착수."},{"id":"dec-biz-090","class":"Decision","label":"교수님·프로젝트별 전담 담당자 배정","desc":"인텔리전스팀은 스톰/네오, 로봇팀은 제랄드/로이가 전담하고 교수님별(신진우·조민수·주한별·임종우·최성준·김용재) 담당자를 배정, 영입은 hk가 담당하기로 함."},{"id":"dec-biz-091","class":"Decision","label":"RLDX 데모, Qwen 3 기반으로 우선 진행","desc":"최종 모델은 Qwen 3.5 기반이지만 릴리즈 지연으로, 이번주 릴리스되는 Qwen 3 기반으로 데모/실험을 먼저 진행하기로 확정"},{"id":"dec-biz-092","class":"Decision","label":"G0 v1.4 video only 모델로 RL task 우선 적용","desc":"G0 1.4 video+memory가 지연되어 리스크 축소 차원에서 1.4 video only 모델로 먼저 RL task 적용 및 BC 학습을 진행하기로 결정"},{"id":"dec-biz-093","class":"Decision","label":"MSRA 협업 프로젝트 리드를 Simon이 담당","desc":"앞으로 Simon(손선일)이 MSRA 협업 프로젝트를 리드하기로 결정"},{"id":"dec-biz-094","class":"Decision","label":"IKEA 스피커 데모 볼트 삽입은 6D pose estimation+motion planning으로 처리","desc":"IKEA 스피커 데모에서 볼트 넣는 부분은 RL 대신 6D pose estimation + motion planning으로 해결하는 방향으로 진행"},{"id":"dec-biz-095","class":"Decision","label":"G0 3/19 video only(bs=1024) 버전 기준으로 실험 진행","desc":"3월 19일 릴리즈된 G0 목요일 버전(video only, batch size 1024)을 기준으로 데모 실험을 진행하기로 결정"},{"id":"dec-biz-096","class":"Decision","label":"데모 촬영 일정 4월 3일 확정","desc":"RLDX 데모 촬영 일정을 4월 3일로 확정"},{"id":"dec-biz-097","class":"Decision","label":"TopReward 개발 보류(유기)","desc":"TopReward reward modeling 접근을 사실상 보류(유기)하기로 함, 디버깅 필요 상태로 남김"},{"id":"dec-biz-098","class":"Decision","label":"Torque 정보 기반 reward model 접근 시도","desc":"manipulation task progress 모델링에 torque 정보가 유의미할 것으로 보고, torque 기반 reward model 제작 접근을 시도하기로 함"},{"id":"dec-gd-001","class":"Decision","label":"고객 현황판 업데이트 및 시장 벤치마크 기준 설정 합의","desc":"고객 현황판 업데이트와 시장에 제시할 벤치마크 기준 설정의 중요성에 합의했다."},{"id":"dec-gd-002","class":"Decision","label":"비즈니스 채용 강화를 위한 테스트 도입 검토","desc":"채용 기준 강화를 위해 비즈니스 리크루팅 테스트 도입을 검토하기로 했다."},{"id":"dec-gd-003","class":"Decision","label":"POC 개수·난이도 반영 프라이싱 조정 방향 설정","desc":"프로젝트별 POC 개수와 난이도에 따른 리소스 투입을 반영해 프라이싱을 조정하기로 했다."},{"id":"dec-gd-004","class":"Decision","label":"RD 인력·전용 하드웨어 확보 및 POC 준비 진행","desc":"RD의 인턴 인력 운영과 Rlex·Openarm 등 전용 하드웨어 확보, MCI 하드웨어 준비를 진행한다."},{"id":"dec-gd-005","class":"Decision","label":"롯데 RX 5성 확장 제안 및 연간 계획 구체화","desc":"롯데에 대한 RX 5성 확장 제안과 연간 계획 구체화, 프라이싱 정리를 진행하기로 했다."},{"id":"dec-gd-006","class":"Decision","label":"덱스터리티를 비즈니스·기술·공학 교집합으로 정의하는 방향 설정","desc":"덱스터리티를 비즈니스 요구, 기술적 실현 가능성(S0·G0), 공학적 연관성의 교집합으로 정의하기로 했다."},{"id":"dec-gd-007","class":"Decision","label":"클라이언트 메시지 정리를 1월 목표로 설정","desc":"고객 대상 메시지 정리를 1월 목표로 설정하고 관련 재료를 모으기로 했다."},{"id":"dec-gd-008","class":"Decision","label":"일본 PoC 파이프라인 업데이트 및 ANA POC 준비 진행","desc":"고객사별 일본 PoC 현황을 사업계획에 반영·업데이트하고 ANA ground handling POC를 준비한다."},{"id":"dec-gd-009","class":"Decision","label":"내부 논의 포맷 1월 파일럿 후 2월 전사 확대 합의","desc":"새로운 내부 논의 포맷을 1월 한 달 파일럿 운영한 뒤 2월부터 전사 확대하기로 합의했다."},{"id":"dec-gd-010","class":"Decision","label":"롯데·KCCS POC 후보 태스크 선정 및 RD 실행가능성 검토 진행","desc":"KCCS·롯데 태스크 후보와 선정 기준을 공유하고 RD팀의 실행 가능성 의견을 다음 주 금요일까지 수렴하기로 했다."},{"id":"dec-gd-011","class":"Decision","label":"로보틱스 리포트 감사 섹션에 RLWRLD 개인 기여자 이름 포함 합의","desc":"리포트에 회사 단위 참여는 배제하되, 편집·리뷰 기여자로 RLWRLD 개인 이름을 감사 섹션에 포함하기로 했다."},{"id":"dec-gd-012","class":"Decision","label":"휴먼 데이터 수집을 위한 세 개 팀 구성","desc":"데이터 팀, 텔레오퍼레이션 툴 개선 팀, 휴먼 데이터 팀의 세 팀을 구성하기로 함."},{"id":"dec-gd-013","class":"Decision","label":"휴먼 데이터 캡처 셋업을 빠르게 완료 후 반복 개선하는 전략 채택","desc":"정답이 없는 상황에서 초기 셋업을 1월 말~2월 초 빠르게 완료하고 반복을 통해 노하우를 축적하기로 함."},{"id":"dec-gd-014","class":"Decision","label":"오클루전 최소화를 데이터 캡처 핵심 원칙으로 채택","desc":"카메라 개수가 아니라 오클루전을 최소화해 손·물체 상호작용을 캡처하는 것을 미션으로 삼고 기본 셋업(정면 1대+사이드 4대)을 제안."},{"id":"dec-gd-015","class":"Decision","label":"AI 기반 수술 보조 로봇 프로젝트에 자문으로 참여하며 향후 기회 모색","desc":"당장의 타겟은 아니지만 진입장벽 높은 산업이라 자문 수준으로 참여하며 나중에 기회를 모색하기로 함."},{"id":"dec-gd-016","class":"Decision","label":"S0 벤치마크에 산업용 오브젝트 핸들링·도구 사용 태스크 반영","desc":"경쟁사와 차별화되도록 S0 벤치마크에 산업용 오브젝트 핸들링과 도구 사용, 롯데·일본 물류 태스크를 반영하는 방향을 잡았다."},{"id":"dec-gd-017","class":"Decision","label":"연구 주제별 교수 배정(모듈러VLA·데이터·POC·설계시뮬)","desc":"모듈러 VLA는 임종훈, 로보틱스 데이터는 주한별, POC는 최성준, 설계·시뮬은 조민수 교수에게 배정하기로 했다."},{"id":"dec-gd-018","class":"Decision","label":"다음 주 미팅 벤치마크 중심으로 순서 변경","desc":"다음 주 버추얼 랩 미팅을 데이터·월드모델보다 벤치마크 위주 논의로 순서를 변경하기로 했다."},{"id":"dec-gd-019","class":"Decision","label":"연구실 Slack 유료 버전 전환 합의","desc":"커뮤니케이션 개선을 위해 연구실 차원에서 Slack 유료 버전으로 전환하기로 합의했다."},{"id":"dec-gd-020","class":"Decision","label":"이마트와 '강결합' 형태 협력 추진 합의","desc":"VLA 성공을 위해 프로세스·데이터 결합이 필요하다고 보고 이마트 대표이사를 설득해 강결합 형태로 협력하기로 했다."},{"id":"dec-gd-021","class":"Decision","label":"초기 상용화 3대 작업(피딩·진열·키팅) 선정","desc":"확장성이 높은 피딩(물류)·진열·키팅 세 가지를 초기 상용화 핵심 작업으로 선정했다."},{"id":"dec-gd-022","class":"Decision","label":"VLA용 고품질 오브젝트 데이터 확보 투자 필요성 동의","desc":"정교한 조작 영역에서 오브젝트 데이터 없이 성공 여부를 알 수 없으므로 데이터 확보에 투자하기로 동의했다."},{"id":"dec-gd-023","class":"Decision","label":"비즈&테크 내부/외부 커뮤니케이션 2주 파일럿 진행","desc":"Biz & Tech 내부/외부 커뮤니케이션 파일럿을 2주간 진행하기로 했다."},{"id":"dec-gd-024","class":"Decision","label":"서울대병원 데이터 활용 및 과기부 발표·국책과제 준비 진행","desc":"서울대병원 데이터 활용 검토, 과기부 브라운 발표, 국책과제 준비를 진행하기로 했다."},{"id":"dec-gd-025","class":"Decision","label":"POC 우선순위 롯데>ANA>KDDI 확정","desc":"RD팀 POC 우선순위를 1순위 롯데, 2순위 ANA, 3순위 KDDI로 확정했다."},{"id":"dec-gd-026","class":"Decision","label":"RD 정기미팅 시간 1.5시간으로 연장","desc":"쌍방향 논의 확보를 위해 RD 미팅 시간을 한 시간 반으로 늘리기로 했다."},{"id":"dec-gd-027","class":"Decision","label":"VL 모듈화 임종우 교수 담당 확정","desc":"VL 모듈화 작업을 임종 교수님이 담당하기로 확정했다."},{"id":"dec-gd-028","class":"Decision","label":"ANA 기내청소 POC로 KDI 과제 대체·KDI는 데이터수집 축소","desc":"ANA 기내청소 POC가 KDI 프로젝트를 대체하고, KDI는 데이터 수집만 하는 수준으로 축소됐다."},{"id":"dec-gd-029","class":"Decision","label":"RD POC 하드웨어 방향: G1·AI워커로 오픈암 리스크 완화","desc":"하드웨어 구성을 좁히고 G1·AI워커를 활용해 오픈암 리스크를 완화하는 방향에 노력을 집중한다."},{"id":"dec-gd-030","class":"Decision","label":"RD 팀 채용·팀빌딩 추진","desc":"RD 팀빌딩과 채용에 자원을 집중해 인력을 확보한다."},{"id":"dec-gd-031","class":"Decision","label":"Hoon Lee POC 후속운영·일본사업 관리","desc":"Hoon Lee가 ANA·MCI·KDDI 등 POC 후속 운영과 일본 사업 관련 팔로업을 관리한다."},{"id":"dec-gd-032","class":"Decision","label":"ANA POC 하드웨어로 X암 사용 확정","desc":"두 달 기간 내 POC를 위해 연구실이 주로 쓰는 X암을 사용하기로 했다."},{"id":"dec-gd-033","class":"Decision","label":"이코노미석 의자 2개 세팅으로 진행","desc":"시연 효과를 위해 이코노미석 의자 두 개를 두고 테스트를 진행하기로 했다."},{"id":"dec-gd-034","class":"Decision","label":"메인 대상 물품 베개·페트병으로 설정","desc":"메인 픽업 대상은 베개와 페트병으로, 담요·헤드폰은 시도 수준으로 풀기로 했다."},{"id":"dec-gd-035","class":"Decision","label":"한국에서 유니트리로 병행 데모 준비","desc":"주교수는 X암으로, 한국 팀은 유니트리로 병행 데모를 준비해 ANA에 두 시연을 보여주기로 했다."},{"id":"dec-gd-036","class":"Decision","label":"ANA 기내청소 POC 추진","desc":"ANA 항공을 대상으로 기내 청소 관련 POC를 추진한다."},{"id":"dec-gd-037","class":"Decision","label":"데이터 확보 집중·차별화 데이터셋 전략 채택","desc":"데이터 확보에 집중해 리얼월드 모델의 확실한 차별화 우위를 확보하기로 결론냈다."},{"id":"dec-gd-038","class":"Decision","label":"월요일 아침 회의를 데이터 논의 시간으로 운영","desc":"당분간 매주 월요일 아침 회의 시간을 데이터 논의에 할애한다."},{"id":"dec-gd-039","class":"Decision","label":"RX 팀 인력 채용 추진","desc":"3월부터 돌아가는 팀을 위해 인턴·정직원 2~3명 충원 채용을 빠르게 진행한다."},{"id":"dec-gd-040","class":"Decision","label":"학생 커뮤니케이션 Slack BMW 프로젝트 채널로 전환","desc":"학생 간 프로젝트 커뮤니케이션을 이메일·카톡 대신 Slack BMW 프로젝트 채널에서 진행하기로 했다."},{"id":"dec-gd-041","class":"Decision","label":"정기미팅 격주 목요일 10시 확정","desc":"로봇 이클리 부재로 격주 목요일 10시 정기 미팅을 확정했다."},{"id":"dec-gd-042","class":"Decision","label":"VAMTO 카메라 4대 셋업 통일·리얼월드 구매 진행","desc":"양쪽 연구실 하드웨어를 VAMTO 4대 셋업으로 통일하고 리얼월드가 구매를 진행하기로 했다."},{"id":"dec-gd-043","class":"Decision","label":"멀티카메라 캘리브레이션·초기버전 개발 진행","desc":"이번 주에 멀티카메라 캘리브레이션을 마무리하고 1월말까지 초기 버전을 개발한다."},{"id":"dec-gd-044","class":"Decision","label":"벤치마크 첫 태스크셋으로 픽앤플레이스 설정","desc":"벤치마크 첫 태스크로 정밀도·충돌 회피를 고려한 픽앤플레이스를 설정하기로 했다."},{"id":"dec-gd-045","class":"Decision","label":"오브젝트 프로토콜 1에 우선 집중","desc":"프로토콜 2(미지 카테고리)는 먼 미래로 두고 당장은 프로토콜 1에 집중한다."},{"id":"dec-gd-046","class":"Decision","label":"태스크당 100개 데모로 시작","desc":"파인튜닝을 위해 태스크당 100개의 데모로 시작하기로 의견을 모았다."},{"id":"dec-gd-047","class":"Decision","label":"벤치마크·데이터셋 구축 진행 방향 설정","desc":"학계 가시성 확보를 목표로 벤치마크·데이터셋을 구축하는 방향을 잡았다."},{"id":"dec-gd-048","class":"Decision","label":"다음 미팅을 VLA 아키텍처·온오프라인 러닝 주제로 연구실별 슬라이드 방식 진행","desc":"다음 주 아젠다를 VLA 아키텍처와 온-오프라인 러닝으로 정하고, S0·G0 현황 공유 후 연구실별 학생 슬라이드 한 장을 받아 논의하기로 함."},{"id":"dec-gd-049","class":"Decision","label":"리얼월드 벤치마크에 Minsu CHO 연구실 정리 내용 반영 및 RealDex·S0·G0 통합 방향 설정","desc":"리얼월드 벤치마크를 계속 만들며 조민수 교수 연구실 정리 내용을 반영하고, 내부 RealDex와 S0·G0를 통합할 필요가 있음을 확인."},{"id":"dec-gd-050","class":"Decision","label":"G4는 KDDI 공동수행 우선, E4는 KCCS 업무위탁 진행","desc":"G4를 KDDI와 공동수행으로 우선 추진하고, E4는 KCCS와 업무 위탁 형태로 진행하기로 결정했다."},{"id":"dec-gd-051","class":"Decision","label":"회사를 '일본법인 보유 미국회사'로 포지셔닝","desc":"일본 국책과제가 미국 업체에 호의적인 점을 활용해 미국 회사로 포지셔닝하기로 했다."},{"id":"dec-gd-052","class":"Decision","label":"국책과제 대응·빅텍/AWS 협력 강화 추진","desc":"제니학 과제 대응을 위해 AWS 등 빅텍과의 협력·인게이지를 강화한다."},{"id":"dec-gd-053","class":"Decision","label":"Heecheol Kim·Hyunji Song PM 지정·요구사항 채널 일원화","desc":"Heecheol Kim과 Hyunji Song을 PM 역할로 지정해 공식 채널로 요구사항을 일원화한다."},{"id":"dec-gd-054","class":"Decision","label":"오브젝트 스캐너 단일 제품 구매 결정","desc":"품질·사용편의성이 압도적인 스캐너 한 제품을 구매하기로 결정했다."},{"id":"dec-gd-055","class":"Decision","label":"RD가 POC 시나리오·벤치마크 리스트 작업 분담 수행","desc":"Storm 제안으로 RD팀이 POC 시나리오 같은 벤치마크 리스트 작업을 직접 수행하기로 했다."},{"id":"dec-gd-056","class":"Decision","label":"Grok(N) 1.6 중심 셋업","desc":"RD팀은 Grok 1.6을 중심으로 셋업하고 향후 다양한 모델을 활용한다."},{"id":"dec-gd-057","class":"Decision","label":"피트니 채용 탈락","desc":"코딩 테스트 결과가 좋지 않은 피트니를 탈락시키는 것으로 진행하되 재논의한다."},{"id":"dec-gd-058","class":"Decision","label":"RD 채용·리크루팅 추진","desc":"역량 위주로 시니어·중간 리더 인재를 확보하는 채용을 추진한다."},{"id":"dec-gd-059","class":"Decision","label":"롯데 POC 데이터 캡처·태스크 우선순위 추진","desc":"롯데 POC 태스크 효과를 검토해 다음 주에 최종 우선순위를 정하고 데이터 캡처 방안을 추진한다."},{"id":"dec-gd-060","class":"Decision","label":"BMW 프로젝트 교수 연구실 지원·관계 재정립","desc":"BMW 프로젝트 교수 연구실과 관계를 재정립하고 하드웨어·커뮤니케이션을 적극 지원한다."},{"id":"dec-gd-061","class":"Decision","label":"월드모델 국책과제에 LG 참여","desc":"올드(월드)모델 과제에 LG가 NC와 함께하는 컨소시엄으로 참여하기로 했다."},{"id":"dec-gd-062","class":"Decision","label":"POC 3D 자산 스캐너 ARTEC Spider 2 도입(우선 1대)","desc":"POC 3D 자산 확보를 위해 ARTEC Spider 2로 진행하되 우선 1대를 운영하기로 했다."},{"id":"dec-gd-063","class":"Decision","label":"데이터 TF 발족","desc":"데이터 TF를 오늘 발족하고 POC 킥오프 미팅을 5시에 진행하기로 했다."},{"id":"dec-gd-064","class":"Decision","label":"코다상 영입·일본 시장 플레이북 담당","desc":"넥스트리티 일본 오피스 대표 출신 코다상을 영입해 일본 시장 플레이북·전략 수립을 맡긴다."},{"id":"dec-gd-065","class":"Decision","label":"월드모델 과제에 삼성 SDS 수요기업 참여","desc":"월드모델 과제에 삼성 SDS가 수요 기업으로 참여했으며 리얼월드와 협력을 희망한다."},{"id":"dec-gd-066","class":"Decision","label":"한국 고객 미팅 추진(CJ대한통운 등)","desc":"KW 한국 방문에 맞춰 CJ대한통운·BGF·만도·LX·LG전자 등 고객 미팅을 잡는다."},{"id":"dec-gd-067","class":"Decision","label":"리크루팅·조직 운영 추진","desc":"외부활동 지원 인력 리크루팅과 문서 관리·RD 공간 확보 등 조직 운영을 추진한다."},{"id":"dec-gd-068","class":"Decision","label":"데이터 TF 발족 및 격주 미팅·모듈별 소그룹 운영 체계 확정","desc":"다음 주부터 데이터 태스크 그룹을 시작해 5개 주제 중심으로 격주 미팅과 모듈별 소그룹을 운영하기로 함."},{"id":"dec-gd-069","class":"Decision","label":"G0팀 동영의 데이터 논의 참여 확정","desc":"각 모델 파이프라인 데이터 핵심 인력 참여 차원에서 G0팀 동영의 데이터 논의 참여를 확정."},{"id":"dec-gd-070","class":"Decision","label":"롯데호텔 페니슐라 라운지 테이블 세팅 POC 1월 말 성공 목표 확정","desc":"Teleop을 활용해 페니슐라 라운지 테이블 세팅(칼각 세팅) POC를 1월 말까지 성공시키기로 확정."},{"id":"dec-gd-071","class":"Decision","label":"ANA 정비 POC 2월 착수, 그라운드 핸들링은 3월 이후 논의","desc":"ANA 정비 프로젝트는 2월에 시작하고 그라운드 핸들링 프로젝트는 3월 이후 논의하기로 함."},{"id":"dec-gd-072","class":"Decision","label":"RX 전사 설명회 개최 및 RX 자료 활용 추진","desc":"RX가 핵심 차별화 포인트인 만큼 필수 참석자를 초청한 RX 설명회를 개최하고 관련 자료를 팀에서 활용하기로 함."},{"id":"dec-gd-073","class":"Decision","label":"덱스터리티 4단계 분류 및 OSC(Object State Complexity) 프레임워크 정립 추진","desc":"덱스터리티를 안정적 파지·반응적·동적 힘조절·인지적 시퀀싱 4단계로 정의하고 OSC 개념과 매칭하는 프레임워크를 정립하기로 함."},{"id":"dec-gd-074","class":"Decision","label":"고난도 작업 수행 위한 다섯 손가락 핸드 및 포스/촉각 센서 필요 결론","desc":"OSC의 어려움을 해결하려면 결국 다섯 손가락 핸드와 포스/촉각(Tactile) 센서가 필요하다고 결론지음."},{"id":"dec-gd-075","class":"Decision","label":"S0/G0 벤치마크 데모 시나리오 및 벤치마크 대상 태스크 선정 방향 설정","desc":"산업 임팩트 있는 롱텀 데모 시나리오를 선별하고 5개 내외의 벤치마크 테스트를 정해 하드웨어(Alex/Inspire/우지)별 데이터 수집 방향을 잡기로 함."},{"id":"dec-gd-076","class":"Decision","label":"SK 프로젝트 기간 2~4월 조정 및 워크숍 완료 후 후불 구매 합의","desc":"구매팀 챌린지로 선구매가 불가해 기간을 2~4월로 조정하고 2~3월 워크숍 완료 후 구매하는 형태로 합의."},{"id":"dec-gd-077","class":"Decision","label":"온디바이스 모델 과제 오토 리그레시브 경량화 방식 채택 합의","desc":"노타와의 논의 끝에 LM 경량화가 가능한 오토 리그레스 방식으로 온디바이스 과제를 가져가기로 합의."},{"id":"dec-gd-078","class":"Decision","label":"월드 모델 국책과제 컨소시엄 구성 및 1년차 GPU 미수령·2년차 수령 계획","desc":"NC·RFM·니어골드·씨메스·펑션베이·컨피그 등으로 컨소시엄을 구성하고, GPU 과제 충돌 회피 위해 1년차 GPU 미수령·2년차 수령으로 계획."},{"id":"dec-gd-079","class":"Decision","label":"인턴 인터뷰 없이 필요 시 즉시 채용","desc":"인턴은 인터뷰 없이 필요할 때 바로 뽑도록 지시."},{"id":"dec-gd-080","class":"Decision","label":"폭증한 국책과제 병행 추진 및 업무 부담 구조적 지원 검토","desc":"Physical AI 부상으로 국책과제가 몰리는 상황에서 다수 과제를 병행 추진하되 업무 과부하에 대한 구조적 지원 방안을 검토하기로 함."},{"id":"dec-gd-081","class":"Decision","label":"주요 고객(CJ·이마트·SK) 미팅 및 BSP 영업 추진","desc":"CJ·이마트·SK·만도 등 주요 고객 미팅 자료 준비와 잠재 협력 업체 리스트 정리 등 BSP 영업을 추진."},{"id":"dec-gd-082","class":"Decision","label":"르네사스 NDA 체결 후 POC 진행 및 레인보우 로보틱스 소개","desc":"르네사스와 NDA 체결 후 반도체 설비 수동 조작 자동화 POC를 진행하고, 중국 로봇 배제 조건에 따라 레인보우 로보틱스를 소개하기로 함."},{"id":"dec-gd-083","class":"Decision","label":"국책과제 Maniac E4 KCCS와 공동 진행 확정","desc":"정부 과제 Maniac E4를 KCCS와 함께 진행하기로 확정."},{"id":"dec-gd-084","class":"Decision","label":"핵심 어카운트 3~4개 대상 RX·RD 집중 전략 채택","desc":"핵심 어카운트 3~4개에 RX와 RD를 함께 논의하고 넥스트 개발은 일본에서 훈이 시딩하는 방식으로 전략적 집중을 강화하기로 함."},{"id":"dec-gd-085","class":"Decision","label":"전사 문서를 모두가 이해할 수 있는 영어로 작성","desc":"일본어가 익숙하지 않은 엔지니어도 참여하므로 전사 문서는 영어로 작성하는 방향으로 함."},{"id":"dec-gd-086","class":"Decision","label":"일본 정부관계(GR) 및 Shogo 온보딩 대응 진행","desc":"글로벌 브레인과의 GR 미팅을 진행하고 Shogo의 온보딩 및 번역 이슈 대응을 위한 별도 논의 시간을 마련하기로 함."},{"id":"dec-gd-087","class":"Decision","label":"OpenArm+F1 셋업 우선순위 재확인 및 G1 지속 투자 재검토","desc":"G1 플랫폼 지속 투자에 의문을 제기하며 OpenArm+F1 셋업의 우선순위를 재확인."},{"id":"dec-gd-088","class":"Decision","label":"BrainCo 햅틱 모델 구매 진행","desc":"G1 텔레오퍼레이션 데이터 캡처 준비를 위해 BrainCo 햅틱 모델 구매를 진행하기로 함."},{"id":"dec-gd-089","class":"Decision","label":"영어 소통 능력을 최우선 채용 기준으로 확정","desc":"글로벌 운영을 위해 영어 소통 능력을 가장 중요한 채용 기준으로 강조."},{"id":"dec-gd-090","class":"Decision","label":"BMW POC 미팅을 매주 진행으로 변경","desc":"BMW 미팅에서 POC 진척이 늦어지는 점을 설명하고 미팅을 매주 진행하는 것으로 변경 공지하기로 함."},{"id":"dec-gd-091","class":"Decision","label":"글로벌 인재 채용 파이프라인 추진","desc":"한국·일본 채용 파이프라인을 가동하고 우수 지원자에 대한 다단계 인터뷰를 진행하기로 함."},{"id":"dec-gd-092","class":"Decision","label":"RD 장비·공간·데이터 오퍼레이션 셋업 추진","desc":"Manos 추가 구매, POC 물품 수납장·업무 공간 확장, 텔레업 외주 검토, 액추에이터 스펙 정의 등 RD 오퍼레이션 셋업을 추진."},{"id":"dec-gd-093","class":"Decision","label":"S0 벤치마크 방향성 정렬(덱스터리티·다이내믹 포스 제어 강조)","desc":"기술적 난이도와 비즈니스 시나리오를 정렬하고, 단순 그래스프를 넘어선 덱스터리티와 다이내믹 포스 제어의 중요성을 강조."},{"id":"dec-gd-094","class":"Decision","label":"롯데호텔 POC 데이터 인풋 소스를 RD 팀으로 전환 합의","desc":"롯데호텔 POC 실행을 위해 데이터 인풋 소스를 RD 팀으로 전환하는 데 합의."},{"id":"dec-gd-095","class":"Decision","label":"롯데호텔 4성·5성 POC 제안 구조 및 6개월/연간 옵션 설정","desc":"4성 2억 원/2개월, 5성 연간 계약 7억 원 플러스 알파의 제안 구조와 6개월·연간 POC 옵션을 설정하기로 함."},{"id":"dec-gd-096","class":"Decision","label":"RD 팀 구성 가속 및 G0/신진호 교수 미팅 연계","desc":"RD 팀을 빠르게 구성하고 월요일 저녁 G0팀·신진호 교수 미팅에 준수를 참여시키기로 함."},{"id":"dec-gd-097","class":"Decision","label":"Dex Bench 및 OSC 프레임워크로 전사 Dexterity 기준 통일 추진","desc":"Dex Bench와 OSC 프레임워크를 통해 전사의 일관성을 확보하고 Dexterity 2.0을 정리하기로 함."},{"id":"dec-gd-098","class":"Decision","label":"4월 미국 시연회 및 6~7월 시리즈 A 목표 개발 로드맵 설정","desc":"차별화된 '와우' 요소와 휴먼 데이터 기반 리타겟팅 데모를 구성하고 6~7월 시리즈 A 투자 유치를 목표로 하는 개발 로드맵을 제시."},{"id":"dec-gd-099","class":"Decision","label":"SK 대상 로봇 산업·RFM 협업 방향 공유 및 차기 워크숍 진행","desc":"로봇 밸류체인·휴머노이드 트렌드와 '서비스로서의 로봇 훈련' 비즈니스 모델을 SK와 공유하고, 후속 질문 및 차기 워크숍을 진행하기로 함."},{"id":"dec-gd-100","class":"Decision","label":"VLA 모듈러 접근 및 6D 포즈·모방학습 연구 방향 논의","desc":"VLA 모듈러 접근의 구성요소·액션 프리미티브 정의, 6D 포즈 추정, 인간 데모 기반 모방학습, 오픈월드 픽앤플레이스 등 연구 방향을 논의하고 후속 협력에 합의."},{"id":"dec-gd-101","class":"Decision","label":"6D 포즈 추정·객체 재구성 연구 방향 및 시스템 통합 추진","desc":"멀티모달 통합 기반 6D 포즈 추정·객체 재구성 연구를 진전시키고 제안된 시스템 통합 버전을 개발한다."},{"id":"dec-gd-102","class":"Decision","label":"Dexterity Framework 개발로 고객 요구사항 정리 및 시장 대응","desc":"다양한 고객 요구사항을 체계적으로 정리하고 시장 대응을 위한 Dexterity Framework를 개발하기로 했다."},{"id":"dec-gd-103","class":"Decision","label":"SI 협업 위한 데이터 표준화·방법론 레시피 구축","desc":"SI 파트너와의 효율적 협업을 위해 데이터 표준화와 방법론 레시피를 구축하기로 했다."},{"id":"dec-gd-104","class":"Decision","label":"비즈니스 리콰이먼트 풀리 도출 착수","desc":"엔드커스터머·SI·RX·RD·BSP 관점을 포함한 비즈니스 리콰이먼트를 완전히 도출하기로 했다."},{"id":"dec-gd-105","class":"Decision","label":"포인트 폴리시 사전학습·시뮬레이션 파인튜닝으로 로봇 핸드 일반화 추진","desc":"휴먼 핸드 데이터에서 로봇 핸드로의 일반화를 포인트 폴리시 사전학습과 시뮬레이션 파인튜닝, 데이터 증강으로 추진한다."},{"id":"dec-gd-106","class":"Decision","label":"AI 활용 최적 핸드 설계 연구 협업 체계 마련","desc":"AI를 활용한 최적의 핸드 설계 연구를 위해 실무 학생과 협업 체계를 마련했다."},{"id":"dec-gd-107","class":"Decision","label":"코드보다 스펙 개선에 집중하는 반복적 개발 방식 채택","desc":"스펙 개선에 집중하는 반복적 개발 방식을 채택하고, 완성 스펙이 작업의 70~80%를 차지하며 구현은 컴파일에 가까운 과정으로 정립했다."},{"id":"dec-gd-108","class":"Decision","label":"마크·나무 업무 역할 할당","desc":"마크는 엔비디아 제품화와 중국 실행을 전담하고, 나무는 고객사 대응 계획 수립을 맡기로 했다."},{"id":"dec-gd-109","class":"Decision","label":"하드웨어 업체 장비 평가 후 엔비디아 추천 및 세일즈 협력 확보","desc":"레인보우 등 파트너사로부터 장비 지원·세일즈 협력을 확보하고, 모든 업체 장비를 평가해 엔비디아에 추천하기로 했다."},{"id":"dec-gd-110","class":"Decision","label":"파이썬 코드 바이너리 패키징 방식 채택","desc":"제품의 실질적 구현·시연을 위해 파이썬 코드를 바이너리로 패키징하는 방식을 채택했다."},{"id":"dec-gd-111","class":"Decision","label":"로봇 작업 성공 정의 위한 정량적 평가 매트릭·KPI 설계 구축","desc":"성공적인 로봇 작업 정의를 위해 정량적 평가 매트릭을 설계·구축하고 덱스벤치로 성과를 입증하기로 했다."},{"id":"dec-gd-112","class":"Decision","label":"온보딩 과정 통한 휴먼 데이터 확보","desc":"연구 수준을 넘어선 소프트웨어 패키징과 온보딩 과정을 통해 휴먼 데이터를 확보하기로 했다."},{"id":"dec-gd-113","class":"Decision","label":"넥스트라이즈 로봇 데모 준비 체제 확정","desc":"넥스트라이즈 이벤트 로봇 데모를 빅토리아 총괄·유서 서포트 체제로 준비하기로 했다."},{"id":"dec-gd-114","class":"Decision","label":"버추얼 랩 연구 8월 내 마무리 및 RealDex 성과·노하우 정리 추진","desc":"진행 중 연구를 늦어도 8월까지 마무리·논문 제출하고, RealDex 1 파인튜닝 노하우를 기술리포트·영상으로 정리해 다음 버전 개발에 얼라인한다."},{"id":"dec-gd-115","class":"Decision","label":"데이터 수집 속도 향상 위해 파일럿 4명 증원·GPU PC 1대 추가 구매","desc":"데이터 수집 속도 향상을 위해 파일럿 인원을 4명으로 증원하고 GPU PC 1대를 추가 구매하기로 했다."},{"id":"dec-gd-116","class":"Decision","label":"롯데 프로젝트 페이스1 기간 3→6개월 연장","desc":"롯데 프로젝트 페이스1을 6개월로 연장해 데이터 품질과 기술 내재화에 집중하기로 했다."},{"id":"dec-gd-117","class":"Decision","label":"롯데 프로젝트 성공 기준 70% 인퍼런스 성능으로 정의","desc":"롯데 프로젝트 성공 기준을 3번 중 2번 성공(70%) 수준의 인퍼런스 성능 영상 제출로 정의했다."},{"id":"dec-gd-118","class":"Decision","label":"AI 워커 하드웨어 개선·팀 소통 실시간화·역량 강화 추진","desc":"슬랙 기반 실시간 소통과 주간 기술 훈련 세션을 도입하고, AI 워커 핸드 개선을 위한 교수 협업·로보티즈 컨택을 추진한다."},{"id":"dec-gd-119","class":"Decision","label":"CJ대한통운 3개월 RX 프로젝트 비용·데이터 소유권 텀시트 명시","desc":"CJ대한통운 대상 3개월 RX 프로젝트의 비용과 데이터 소유권을 텀시트 형태로 명시하기로 했다."},{"id":"dec-gd-120","class":"Decision","label":"신규 POC는 리소스 중복 방지·기존 과제 시너지 우선 고려","desc":"신규 POC 제안 시 리소스 중복을 방지하고 기존 과제와의 시너지를 우선 고려하기로 했다."},{"id":"dec-gd-121","class":"Decision","label":"CJ대한통운에 RX·POC 단계 구분한 명확한 오퍼 제시","desc":"CJ대한통운에 'RX 온리' 안과 'RX+POC+기술전수' 안을 구분해 명확한 오퍼를 제시하기로 했다."},{"id":"dec-gd-122","class":"Decision","label":"모든 비즈니스 논의·커뮤니케이션 슬랙 중심 활성화","desc":"향후 모든 비즈니스 논의와 커뮤니케이션을 슬랙 중심으로 활성화해 팀 전체 가시성을 확보하기로 합의했다."},{"id":"dec-gd-123","class":"Decision","label":"LG이노텍 기술 데모·세션 다음 주 준비","desc":"LG이노텍 요청에 따라 기술 데모 세션을 다음 주 중 준비하고, 신진호 교수 RealDex 파인튜닝 매뉴얼과 연계하기로 했다."},{"id":"dec-gd-124","class":"Decision","label":"로봇 민첩성 벤치마크 지표 및 리더보드 구축을 주요 과제로 채택","desc":"로봇의 민첩성을 측정할 적절한 벤치마크 지표와 리더보드 구축을 핵심 과제로 삼기로 함."},{"id":"dec-gd-125","class":"Decision","label":"대기업·하드웨어 제작사 대상 페르소나 및 유저 시나리오 작성 합의","desc":"대기업 및 하드웨어 제작사 대상 페르소나와 유저 시나리오를 작성하고 Namho Kim이 주도하기로 합의함."},{"id":"dec-gd-126","class":"Decision","label":"결정론적 시스템 통합 방식에서 벗어나 새 접근법 적용 결정","desc":"불확실성이 높은 VLA 프로젝트에 맞춰 기존 결정론적 시스템 통합 방식을 버리고 새 접근법을 적용하기로 함."},{"id":"dec-gd-127","class":"Decision","label":"해외 선도 기업 사례를 레퍼런스로 활용하는 전략 채택","desc":"프로젝트 설득력을 높이기 위해 해외 선도 기업 사례를 레퍼런스로 활용하기로 함."},{"id":"dec-gd-128","class":"Decision","label":"대외 공개 자료는 사전 승인된 로고만 사용하도록 결정","desc":"모든 대외 공개 자료(유튜브, 리플래시 등)는 사전에 승인된 파트너사 로고만 사용하기로 하고, 미승인 노출 자료·기사는 삭제 요청함."},{"id":"dec-gd-129","class":"Decision","label":"R&D 전략을 모델 일반화 성능 중심으로 수정","desc":"노동 집약적 파인튜닝 방식에서 벗어나 모델 자체의 일반화 성능을 높이는 방향으로 R&D 전략을 수정하기로 함."},{"id":"dec-gd-130","class":"Decision","label":"엔비디아·AWS 파트너십 성과를 마케팅·영업에 적극 활용","desc":"엔비디아 및 AWS와의 협업 성과를 각 지역 비즈니스 마케팅·홍보에 적극 연계하기로 함."},{"id":"dec-gd-131","class":"Decision","label":"프로덕트 기술 스택의 현장 적용 및 R&D-프로덕트 협업 강화","desc":"프로덕트 팀 기술 스택을 현장 운영팀에서 신속 적용하고, 비즈니스 팀이 스코핑한 기술 과제를 R&D 팀에 전달·실행하기로 함."},{"id":"dec-gd-132","class":"Decision","label":"에이전트 중심 개발 전환 및 3계층 하네스 구조 도입 결정","desc":"얇은 하네스·지능형 레이어·결정론적 기반 레이어의 3계층 구조를 도입하고 에이전트 루프와 지능형 기능을 분리하기로 함."},{"id":"dec-gd-133","class":"Decision","label":"홈페이지·언론·발표자료 로고 사용 승인을 일괄 통합 요청하기로 결정","desc":"홈페이지, 언론 보도, 발표 자료 세 영역의 로고 사용 승인을 기업별로 한 번에 통합 요청하는 전략을 확정함."},{"id":"dec-gd-134","class":"Decision","label":"홈페이지·발표 자료 로고 사용 승인 전면 재점검 합의","desc":"이번 기회에 홈페이지와 발표 자료에 포함된 기업 로고 사용 승인을 전면 재점검하고 회사별 가이드라인을 정립하기로 함."},{"id":"dec-gd-135","class":"Decision","label":"기술 컴퓨팅 요건 대응 위해 클라우드 사용 커스터마이징 채택","desc":"GPU·CPU 등 기술 요건을 지원하기 위해 클라우드 사용을 커스터마이징하고 시뮬레이터를 활용하기로 함."},{"id":"dec-gd-136","class":"Decision","label":"표준 계약서를 세 가지 메시지 전략에 맞춰 재구조화·표준화","desc":"계약 조건 유형화, 재량 항목 사이드노트, 미니/데이터 POC 세트 구분 등 세 가지 메시지 전략에 맞춰 표준 계약서를 재배치·표준화하기로 함."},{"id":"dec-gd-137","class":"Decision","label":"국가별 법률 기준에 따라 계약서를 별도로 작성하는 원칙 채택","desc":"미국·한국 등 국가별 법률 기준이 상이하므로 계약서를 국가별로 별도 작성하고 각국 변호사 자문을 참고하기로 함."},{"id":"dec-gd-138","class":"Decision","label":"이고 비디오 데이터 리타게팅 파이프라인 구축 후 외주 업체 수요 검토","desc":"올해 3~4분기 로봇 데이터 리타게팅 파이프라인을 구축한 뒤 외부 데이터 외주 업체 수요를 검토하고, 사전 조사로 대응 가능한 업체를 확보하기로 함."},{"id":"dec-gd-139","class":"Decision","label":"CJ대한통운 9억원 6개월 계약 및 RX 1개월 확정","desc":"9억 원 규모 6개월 계약을 확정하고 RX 단계에서 1개월간 현장 분석·데이터 수집 프로세스를 구축한다."},{"id":"dec-gd-140","class":"Decision","label":"POC 전략을 데이터 파트너십·연말 현장 데모 중심으로 조정","desc":"POC 용어 오해를 줄이고자 기술 검증보다 데이터 파트너십과 연말 현장 데모에 중점을 두기로 함."},{"id":"dec-gd-141","class":"Decision","label":"연말 데모는 모사 환경에서 시작하되 실제 환경 POC 병행","desc":"연말 데모를 모사 환경에서 시작하되 임팩트 있는 실제 환경에서도 POC를 병행하기로 합의함."},{"id":"dec-gd-142","class":"Decision","label":"2028년 현장 배치 목표 협동 모델 5대 핵심 영역 사업 모델 구축","desc":"2028년 실제 현장 배치를 목표로 사람-휴먼노이드 협동 5대 핵심 영역 중심 사업 모델을 구축한다."},{"id":"dec-gd-143","class":"Decision","label":"제안서 번역에 DeepL 대신 Claude Opus 사용","desc":"번역 품질 확보를 위해 DeepL을 지양하고 Claude Opus 등 다른 AI 도구로 제안서를 번역하기로 함."},{"id":"dec-gd-144","class":"Decision","label":"AI 번역 거친 전체 제안서 초안 팀 공유","desc":"제안서 품질이 높다고 평가하고 AI 번역을 거친 전체 제안서 초안을 팀에 공유하기로 함."},{"id":"dec-gd-145","class":"Decision","label":"고객사별 RX+데이터 파트너십 결합 오퍼링 전략 채택","desc":"LG이노텍·CJ·이마트 등 고객에게 RX와 데이터 파트너십을 결합한 1.5억~10억 규모 오퍼링을 구성한다."},{"id":"dec-gd-146","class":"Decision","label":"R&D 강화 위한 시니어급 리더 채용 추진","desc":"엔지니어 성장을 견인할 시니어급 리더 채용을 추진하고 백경빈 님 등 인재를 지속 영입한다."},{"id":"dec-gd-147","class":"Decision","label":"서울 이벤트 VIP 좌석 '리얼월드' 구역 지정 및 대응 전략 수립","desc":"일본 사례를 참고해 앞 좌석 일부를 '리얼월드' 구역으로 지정하고 VIP 의전·대응 전략을 수립한다."},{"id":"dec-gd-148","class":"Decision","label":"듀얼 트랙 시장 진입 전략 채택","desc":"비디오 데모로 시장 약속을 세우고 실제 배치로 운영 신뢰성·가동률을 검증하는 듀얼 트랙 전략에 정렬함."},{"id":"dec-gd-149","class":"Decision","label":"데이터 수집·성능 스케일링 전략 수립 착수","desc":"향후 모델 성능 개선을 위한 데이터 수집·성능 스케일링 전략을 정의하기로 함."},{"id":"dec-gd-150","class":"Decision","label":"공급자·수요자 관점 통합 UJM 작성","desc":"공급자와 수요자 관점을 모두 포함하는 통합 사용자 여정 지도를 작성하기로 결정함."},{"id":"dec-gd-151","class":"Decision","label":"데이터 수집을 최우선 과제로 통합 문서 관리","desc":"5가지 과제 중 확장성·중요도가 가장 높은 데이터 수집을 우선순위로 삼아 통합 문서로 관리함."},{"id":"dec-gd-152","class":"Decision","label":"11개 프로세스에 맞춰 사용자 재정의 및 UJM 재구성","desc":"데이터 수집부터 OTA까지 11개 프로세스에 맞춰 사용자 그룹을 새롭게 정의하고 UJM을 재구성한다."},{"id":"dec-gd-153","class":"Decision","label":"반복 UJM 작업을 나무 님에게 위임","desc":"초안 작성 업무가 과다한 상황에서 반복적인 UJM 작업을 나무 님에게 전달해 진행하기로 협의함."},{"id":"dec-gd-154","class":"Decision","label":"인석·태연 SOTA 작업을 헨슨이 통합 정리하는 프로세스 구축","desc":"인석·태연의 SOTA 작업 결과를 헨슨이 받아 최종 통합 정리하여 수환의 업무 부담을 줄인다."},{"id":"dec-gd-155","class":"Decision","label":"데이터 큐레이션 엔진 제품화 및 AWS 협력 전략 수립","desc":"데이터 큐레이션 엔진을 제품화해 AWS와 협력·외부 제공하고 엔비디아 등 외부 파트너 강점을 매핑한다."},{"id":"dec-gd-156","class":"Decision","label":"텔레오퍼레이션 데이터 정성 평가·품질 레이블링 도입 검토","desc":"숙련·비숙련 움직임을 구분하는 텔레오퍼레이션 데이터 정성 평가·품질 레이블링 도입을 고려하기로 함."},{"id":"dec-gd-157","class":"Decision","label":"6주 MVP 동안 표준 워크플로우 정의 및 데이터 리니지·아티팩트 관리 체계 도입","desc":"6주 MVP 기간 동안 한 사이클 표준 워크플로우를 정의하고 데이터 리니지·아티팩트 관리 체계를 도입한다."},{"id":"dec-gd-158","class":"Decision","label":"기술 도구 구현보다 프로세스 표준화·데이터 관리 선행","desc":"기술적 도구 구현보다 업무 프로세스 표준화와 데이터 관리 체계 수립을 선행하기로 확인함."},{"id":"dec-gd-159","class":"Decision","label":"실험 재현성 위해 데이터 물리적 위치 관리·메타데이터 가시화 우선","desc":"실험 재현성 확보를 위해 데이터의 물리적 위치 관리와 메타데이터 가시화를 우선시하기로 함."},{"id":"dec-gd-160","class":"Decision","label":"하향식에서 상향식 개발 전략으로 전환","desc":"달성 가능한 목표 설정을 위해 하향식(Top-down)에서 상향식(Bottom-up) 개발 전략으로 전환함."},{"id":"dec-gd-161","class":"Decision","label":"연구자 노하우 정형화하여 시스템에 적용","desc":"데이터 큐레이션·학습 과정의 연구자 노하우를 정형화(모방 학습)하여 시스템에 적용하기로 함."},{"id":"dec-gd-162","class":"Decision","label":"속도 경쟁보다 정확도·견고성 확보 우선","desc":"무조건적인 경량화·속도 경쟁보다 정확도와 환경 변화에 대한 견고성 확보를 우선시함."},{"id":"dec-gd-163","class":"Decision","label":"정원컴퍼니 현장 실증(POC) 추진 최종 합의","desc":"제조 AI 도입을 위한 도전적 과제로서 정원컴퍼니 현장 데이터 실증을 추진하기로 합의했다."},{"id":"dec-gd-164","class":"Decision","label":"작업자 영상·로봇 모사 학습 방식으로 데이터 수집 진행","desc":"작업자 영상 녹화와 로봇 모사 학습을 통해 데이터를 수집하기로 했다."},{"id":"dec-gd-165","class":"Decision","label":"사업계획서 예산·일정 최종 확정 (총 사업비 12억, 시작일 6월 1일)","desc":"총 사업비를 12억 원으로 최종 확정하고 사업 시작일을 6월 1일로 변경했다."},{"id":"dec-gd-166","class":"Decision","label":"회사 명칭 '주식회사 리얼월드'로 서류 통일 및 확약서 재날인","desc":"사업자 등록증 확인 후 회사명을 '주식회사 리얼월드'로 통일하고 부처 명칭 변경분을 반영해 재날인한다."},{"id":"dec-gd-167","class":"Decision","label":"실증 계획에 2가지 실증 과제 추가","desc":"실증 구체성 보완 요청에 따라 컵 픽앤플레이스와 와인잔 핸들링 실증 과제를 추가했다."},{"id":"dec-gd-168","class":"Decision","label":"'툴 관점의 UJM'으로 재설정 및 담당자 지정","desc":"기존 수요 관점 UJM과 툴 리서치를 합쳐 툴 관점 UJM을 제작하고 Namho Kim이 담당한다."},{"id":"dec-gd-169","class":"Decision","label":"글로벌 SOTA 테크 파트너십 프로그램 구축을 신규 목표로 설정","desc":"엔트로픽 사례를 참고해 1~3단계로 이어지는 글로벌 SOTA 기술 파트너십 프로그램을 만들기로 했다."},{"id":"dec-gd-170","class":"Decision","label":"발표 자료 구성 확정 (에코시스템·데이터 파이프라인 중심, 약 12장)","desc":"에코시스템 시각화와 데이터 파이프라인을 중심으로 간결한 12장 발표 자료 구성을 확정했다."},{"id":"dec-gd-171","class":"Decision","label":"핵심 제품 MVP 1개월 내 출시 결정","desc":"데이터 수집부터 훈련까지 포함하는 최소 기능 제품(MVP)을 1개월 이내 준비하기로 했다."},{"id":"dec-gd-172","class":"Decision","label":"AWS와 1~2개 핵심 계정 집중 공략 전략 채택","desc":"광범위한 확장 대신 성공 사례 확보를 위해 1~2개 핵심 계정을 선정해 AWS와 집중 공략한다."},{"id":"dec-gd-173","class":"Decision","label":"롯데호텔 협업 확장 방향 설정 (식품제조 제외, 식품서비스·유통·물류 중심)","desc":"난이도 높은 식품 제조는 제외하고 식품 서비스·유통·물류 계열사로 협업 확장을 검토한다."},{"id":"dec-gd-174","class":"Decision","label":"Car를 글로벌 관계(AWS·Nvidia) 리드로 지정","desc":"AWS 경력자인 Car가 미·일·한 활동을 조율하고 AWS·Nvidia 글로벌 관계를 주도하도록 한다."},{"id":"dec-gd-175","class":"Decision","label":"서울 런칭 행사 대비 운영 성공률 99% 목표 최적화","desc":"6월 10일 서울 런칭 행사를 위해 추가 학습보다 위치·각도 최적화로 운영 성공률 99% 달성에 집중한다."},{"id":"dec-gd-176","class":"Decision","label":"데이터셋 허브·모델 허브 MVP 3주 내 구축","desc":"R&D 관점의 중앙 관리 시스템(Dataset Hub·Model Hub)을 3주 내 MVP로 구축한다."},{"id":"dec-gd-177","class":"Decision","label":"R&D 보유 로봇 전체 리스트캠 장착으로 신규 모달리티 추가","desc":"이번 주·다음 주 내 R&D 보유 로봇 전체에 리스트캠을 장착해 신규 모달리티를 추가한다."},{"id":"dec-gd-178","class":"Decision","label":"RX 프로젝트 후속 미팅으로 진행 가속화 (이마트·대한통운)","desc":"강준·SCM·기획 상무 3명이 참여하는 후속 미팅을 통해 RX 프로젝트 진행을 가속화한다."},{"id":"dec-gd-179","class":"Decision","label":"RX Annotation 2 개발을 이마트·대한통운 유즈케이스 중심으로 전환","desc":"남은 1개월간 어노테이션 품질 개선에서 이마트·대한통운 실무 유즈케이스 중심 개발로 전환한다."},{"id":"dec-gd-180","class":"Decision","label":"6월 워크숍서 RX 플레이북 전면 업그레이드 및 2028 휴머노이드 배포 목표","desc":"6월 말 워크숍에서 어노테이션·큐레이션 방법론을 담아 RX 플레이북을 전면 업그레이드하고 2028년 휴머노이드 배포를 목표한다."},{"id":"dec-gd-181","class":"Decision","label":"DeepX-리얼월드 턴키 방식 협업으로 로봇 생태계 확장 추진","desc":"반도체 칩 제조사와 로봇 기업이 턴키 방식 협업으로 로봇 생태계 확장을 추진하기로 했다."},{"id":"dec-gd-182","class":"Decision","label":"온디바이스 AI 기반 차세대 로봇 솔루션 추진 (NPU 성능 검증)","desc":"데이터센터 한계 극복을 위해 온디바이스 AI 기반 차세대 로봇 솔루션 추진에 합의하고 NPU 구동 성능을 검증한다."},{"id":"dec-gd-183","class":"Decision","label":"배포 현장 축적 영상서 물리 변수 자동 추출 파이프라인 존재 여부 조사","desc":"Dexbench 스키마가 정의한 변수를 배포 현장 영상에서 자동 추출하는 파이프라인 구현 가능성을 조사한다."},{"id":"dec-gd-184","class":"Decision","label":"일본 시장 하이브리드 전략(고성능 모델+하드웨어 유통) 채택","desc":"일본 기업의 개발 키트·플랫폼 수요를 겨냥해 고성능 모델과 하드웨어 유통을 결합한 하이브리드 전략을 채택한다."},{"id":"dec-gd-185","class":"Decision","label":"현규(황현규) 역할을 사업기획·어카운트 매니지먼트로 확정(국책 제외)","desc":"내부 조정으로 현규는 국책 대신 사업 기획과 계정 관리 업무에 집중하기로 확정."},{"id":"dec-gd-186","class":"Decision","label":"7월 6일 L7 강남 건물로 사무실 이전","desc":"7월 6일부터 테헤란로 L7 강남 건물 7층으로 사무실을 이전한다."},{"id":"dec-gd-187","class":"Decision","label":"3분기 시리즈 A 유치 목표 및 사업계획 정교화","desc":"올해 3분기까지 시리즈 A 유치를 목표로 사업 계획을 더 공고히 수립한다."},{"id":"dec-gd-188","class":"Decision","label":"시니어 중심 소팀제(소파트제)로 팀 재편","desc":"업무 효율을 위해 시니어 중심의 소팀제로 팀을 구성한다."},{"id":"dec-gd-189","class":"Decision","label":"5D 월드 모델 과제 구성·일정 합의 및 역할 분담","desc":"4년 15억 규모 5D 월드 모델 과제에 회사는 데이터 수집·실증, 대학은 연구개발을 담당하기로 합의."},{"id":"dec-gd-190","class":"Decision","label":"Fraunhofer IPT 실패 데이터 활용·오프라인 강화학습으로 성능 개선","desc":"제조 로봇 실패 데이터에 음의 보상을 주는 오프라인 강화학습으로 모델 성공률을 개선한다."},{"id":"dec-gd-191","class":"Decision","label":"5D 월드 모델 과제 주관 주체 내부 재논의 후 결정","desc":"행정 부담을 고려해 회사 측 주관 여부를 내부적으로 다시 논의해 최종 결정하기로 함."},{"id":"dec-gd-192","class":"Decision","label":"LG CNS 내 리얼덱스 전용 랩 조성 및 약 1개월 리드타임 PoC 시작","desc":"기술 검증을 위해 LG CNS 내 리얼덱스 전용 랩을 조성하고 약 1개월 리드타임으로 PoC를 시작한다."},{"id":"dec-gd-193","class":"Decision","label":"LG CNS와 협업 방안을 후속 논의로 구체화","desc":"후속 논의를 통해 LG CNS와의 상세 협업 계획을 정의하고 모델 배포를 지원한다."},{"id":"dec-gd-194","class":"Decision","label":"제안서 초안 이번 주 완성, 다음 주 초부터 기관 직인 절차 진행","desc":"다음 주 목요일(25일 18시) 제출 마감에 맞춰 이번 주 내 초안을 완성하고 월요일까지 직인 요청을 완료한다."},{"id":"dec-gd-195","class":"Decision","label":"실증처(루치노바 등) 확보로 실증 중심 차별화 전략 채택","desc":"학계 컨소시엄과 달리 루치노바 등 실증처를 확보해 데이터 수집부터 실증까지 진행하는 것을 강점으로 삼는다."},{"id":"dec-gd-196","class":"Decision","label":"제안서 역할 분담: 리얼드 총괄·행정, 각 연구실 기술 집필","desc":"리얼드는 행정·서류·총괄, Hanbyul Joo는 로커모션·매니플레이션·SLAM, Jinwoo Shin은 파운데이션·월드모델을 집필한다."},{"id":"dec-gd-197","class":"Decision","label":"외부 팀 미영입, 기존 협력팀으로 컨소시엄 구성","desc":"새 팀을 추가하기보다 기존 협력 연구팀들로 컨소시엄을 구성해 유기적으로 협력한다."},{"id":"dec-gd-198","class":"Decision","label":"4년 60억 국책 과제 R&R 확정 및 회사 주도","desc":"회사는 데이터 수집·실증, 교수진은 모델링·제어를 담당하고 회사가 발표 등 주도적 역할을 맡는다."},{"id":"dec-gd-199","class":"Decision","label":"온프레미스 GPU 도입 및 비용 관리 지속","desc":"Nvidia 총판을 통한 온프레미스 GPU 설치의 가격 경쟁력을 확인하고 비용 효율 관리를 지속하기로 합의."},{"id":"dec-gd-200","class":"Decision","label":"월드 모델을 회사 과제 스코프에 포함 확정","desc":"약 1천억 규모 국책 과제에서 월드 모델 개발을 회사 스코프에 넣는 것으로 결정."},{"id":"dec-gd-201","class":"Decision","label":"합성 데이터 검증(이밸류에이션) 파이프라인을 기술 차별점으로 구축","desc":"단순 데이터 생성을 넘어 학습 효율성을 검증하는 파이프라인 구축을 회사의 기술 차별점으로 삼는다."},{"id":"dec-gd-202","class":"Decision","label":"리얼덱스 후속 연구 위한 10개 리서치 서브 그룹 운영 도입","desc":"연구 효율화·정렬을 위해 10개 리서치 서브 그룹을 조직해 2주 주기로 운영하고 버추얼랩은 6주 순환으로 요약 발표한다."},{"id":"dec-gd-203","class":"Decision","label":"보안 사고 방지 위해 신규 인력 채용 시 검증 절차 강화","desc":"링크드인 페이크 계정·데이터 유출 시도 등 보안 우려에 따라 채용 시 인성·이력 검증과 보안 프로토콜을 강화한다."},{"id":"dec-gd-204","class":"Decision","label":"연 매출 50억 목표 및 글로벌 시장 확장 추진","desc":"올해 연 매출 약 50억, 연말 MRR 40만 달러를 목표로 일본·미국·유럽 파트너십을 통한 시장 확장을 추진한다."},{"id":"dec-gd-205","class":"Decision","label":"수연 업무 비중 50%를 글로벌 어카운트 매니지먼트로 전환","desc":"글로벌 계정 관리를 위해 수연의 업무를 7·8월 30%, 9·10월 50% 수준으로 어카운트 매니지먼트로 전환한다."},{"id":"dec-gd-206","class":"Decision","label":"리얼덱스 2 위한 손·월드 모델링 연구 후속 실험 진행","desc":"텍타일 결합 쉐도우 핸드 포맷 변환, 휴먼 비디오 로봇 학습 활용, 코스모스 3 성능 개선 등 리얼덱스 후속 연구를 진행한다."},{"id":"dec-gd-207","class":"Decision","label":"RealDex 단순 업데이트 아닌 제품화 관점 전략 전환","desc":"RealDex를 단순 프로덕트 업데이트가 아닌 제품화(Productize) 관점으로 접근하기로 방향을 수정했다."},{"id":"dec-gd-208","class":"Decision","label":"대한통운 물류센터 현장 방문 실시 결정","desc":"테스트 공간 매칭과 실무 파악을 위해 목요일 CJ대한통운 허브·서브 터미널 현장을 방문하기로 했다."},{"id":"dec-gd-209","class":"Decision","label":"연말 POC는 박스 위주 처리로 Feasibility 우선 입증","desc":"올해 POC는 박스 위주 처리에 집중해 타당성을 먼저 입증하는 전략을 취하기로 합의했다."},{"id":"dec-gd-210","class":"Decision","label":"리얼덱스(RLDX) 브랜드 명칭 개선 검토 착수","desc":"RLDX1 제품 명칭·브랜드 정체성에 대한 고민을 공유하고 향후 개선 방향을 검토하기로 했다."},{"id":"dec-gd-211","class":"Decision","label":"2단계 모델 개발 전략 채택","desc":"비전문가도 쓰는 로버스트 모델과 이를 보완하는 VLA·텔레옵 모델의 2단계 개발 전략으로 R&D 방향을 설정했다."},{"id":"dec-gd-212","class":"Decision","label":"사내 연구그룹(4D+) 전사 오픈","desc":"4D+ 서브그룹을 전사적으로 개방해 R&D 팀이 데이터 취득 기술·연구 논의에 참여하도록 했다."},{"id":"dec-gd-213","class":"Decision","label":"월드모델 정부과제 범위를 비정형 데이터 수집·실증으로 한정","desc":"전체 파운데이션 모델 개발 대신 비정형 데이터 수집 및 실증이라는 명확한 역할로 제안 범위를 한정하기로 했다."},{"id":"dec-gd-214","class":"Decision","label":"월드모델 제안서에 불확실성 맵 출력 기능 도입","desc":"월드모델이 미래 예측뿐 아니라 불확실성 맵을 출력해 능동적 탐색 루프를 구현하는 기능을 제안서에 추가하기로 했다."},{"id":"dec-gd-215","class":"Decision","label":"휴먼 데이터·검증 하드웨어 중심 파이프라인으로 전환","desc":"제네시스 사례 분석을 토대로 텔레오퍼레이션 의존을 낮추고 검증된 하드웨어와 휴먼 데이터 수집 중심으로 연구 파이프라인을 전환한다."},{"id":"dec-gd-216","class":"Decision","label":"한국·일본에 각각 프랑카 셋업 구축 및 인력 확보","desc":"한일 양국에 프랑카 셋업을 각각 구축해 테스트 환경을 마련하고, 인턴 종료 대비 채용을 서두르기로 했다."},{"id":"dec-gd-217","class":"Decision","label":"시연 대상에 박스·파우치 모두 포함 확정","desc":"박스만 다룰 경우 사업팀 평가가 부정적일 수 있어 파우치를 포함한 모든 오브젝트를 시연 대상에 포함하기로 했다."},{"id":"dec-gd-218","class":"Decision","label":"외부 로직 지양, VLA 모델 자체 성능에 집중","desc":"별도의 외부 로직 구현은 지양하고 VLA 모델이 들고 옮기는 작업에 집중하며 데이터 시나리오로 판단하게 하는 방향으로 의견을 모았다."},{"id":"dec-gd-219","class":"Decision","label":"목표 처리시간 5초 스트레치, 8초로 협상","desc":"하드웨어 물리적 한계로 5초는 스트레치 타겟으로 두고 현실적 목표 8초를 제안해 협상하기로 했다."},{"id":"dec-gd-220","class":"Decision","label":"전사 공유 문서 영어 작성 지시","desc":"일본 등 타 오피스 협업과 효율을 위해 전사적으로 공유되는 모든 문서를 영어로 작성하도록 지시했다."},{"id":"dec-gd-221","class":"Decision","label":"AWS-Real World 피지컬 AI 파트너십 최종 확정","desc":"AWS 마켓플레이스 등록을 완료하고 AWS와 물리적 AI 파트너십을 최종 확정, 8월 말까지 GTM을 마무리하기로 했다."},{"id":"dec-gd-222","class":"Decision","label":"일본 법인 증자 최우선 순위 추진","desc":"일본 법인 매출·증자 이슈로 R&D 구매·채용이 지연되어 증자 추진을 최우선 순위로 진행하기로 지시했다."},{"id":"dec-gd-223","class":"Decision","label":"회의를 타임시리즈 일정 기반 미래지향 포맷으로 변경","desc":"단순 현황 보고가 아니라 미래 가시성을 확보하는 타임시리즈 일정 기반 보고 포맷으로 회의를 변경하기로 했다."},{"id":"dec-gd-224","class":"Decision","label":"일대일 영어 코칭 프로그램 도입","desc":"전사 미팅 영어화를 지원하기 위해 다음 주부터 일대일 영어 코칭 프로그램을 도입하기로 했다."},{"id":"dec-gd-225","class":"Decision","label":"데이터 파이프라인 전략·레시피 수립 추진","desc":"모델 팀 업무의 전체 전략·레시피를 구체화하고 7월 말 데이터 레시피 완성을 목표로 파이프라인을 구축하기로 했다."},{"id":"dec-gd-226","class":"Decision","label":"전사 정보보안 체계 구축 및 담당자 지정","desc":"보안 사고 이후 전문 보안 컨설팅 업체를 선정하고 내부 보안 담당자를 지정해 체계적 보안 시스템을 구축하기로 했다."},{"id":"dec-gd-227","class":"Decision","label":"로보틱스 플랫폼 릴리즈·운영 우선순위 조정","desc":"RIC 2차 버전 릴리즈 및 3분기 릴리즈 플랜에 맞춰 로보틱스 플랫폼 팀 업무 우선순위를 조정하기로 했다."},{"id":"dec-gd-228","class":"Decision","label":"2027년 일본 매출 목표 7백만 달러로 하향 조정","desc":"일본 시장의 보수적 기술 수용성을 반영해 2027년 일본 매출 목표를 7백만 달러 수준으로 하향 조정하기로 합의했다."},{"id":"dec-gd-229","class":"Decision","label":"투자자용 탑다운·관리용 바텀업 모델 분리 운영","desc":"투자자 설명용 탑다운 모델과 실제 진척 관리용 바텀업 모델을 구분하여 작성·운영하기로 했다."},{"id":"dec-gd-230","class":"Decision","label":"서바이벌 레이트 기반 캐스케이딩 로직 도입","desc":"RX·POC·라스 고객 수 산정을 위해 서바이벌 레이트를 적용한 캐스케이딩 로직을 도입하기로 했다."},{"id":"dec-gd-231","class":"Decision","label":"파운데이션 모델·실증팀 2~3개 세트 병렬 운영 구조 채택","desc":"특정 모델 의존 리스크를 줄이기 위해 파운데이션 모델 개발업체와 적용팀을 한 세트로 묶어 2~3개 세트를 병렬 운영하는 구조로 과제를 구성하기로 했다."},{"id":"dec-gd-232","class":"Decision","label":"리얼월드는 파운데이션 모델 개발·실증 입증에 집중","desc":"제안서 5개 항목을 모두 수행하기보다 기존 연구 역량을 바탕으로 파운데이션 모델 개발과 실제 적용 가능성 입증에 집중하기로 했다."},{"id":"dec-gd-233","class":"Decision","label":"비즈·모델·플랫폼 팀 간 정기 협업 회의체 신설","desc":"비즈니스 요구가 모델·플랫폼 개발에 즉각 반영되도록 팀 간 정기 협업 회의를 신설하기로 함."},{"id":"dec-gd-234","class":"Decision","label":"BMW·혼다 글로벌 파트너십 로고 대외 공개 전략 추진","desc":"BMW·혼다 등 글로벌 POC 성과를 세컨드 POC 시점에 맞춰 외부 공개하는 전략을 준비하기로 함."},{"id":"dec-gd-235","class":"Decision","label":"간트차트 형식 통합 일정 관리 시스템 도입","desc":"RX·RD·플랫폼 팀의 주요 과제·마일스톤을 관리할 간트차트형 통합 일정 관리 시스템을 도입하기로 함."},{"id":"dec-gd-236","class":"Decision","label":"정부 과제 콘소시엄 참여 방향 확정","desc":"리얼월드가 이지형 교수 주관 정부 과제 콘소시엄에 참여하는 방향으로 정하고 역할·예산 비중을 협의하기로 함."},{"id":"dec-gd-237","class":"Decision","label":"세부 예산·최종 콘소시엄 구성 확정 및 제안서 최종화","desc":"제안서 제출 기한을 고려해 연구비를 내부 재검토하고 익일 오전까지 세부 예산·구성을 확정하기로 함."},{"id":"dec-gd-238","class":"Decision","label":"LG CNS 계약 프라이싱 3억~5억 수준 현실화","desc":"LG CNS 계약가를 3억~5억 수준으로 낮춰 현실화하고, 소액이라도 관계를 유지하며 전략적으로 활용하기로 함."},{"id":"dec-gd-239","class":"Decision","label":"2031년 핵심 KPI 목표 설정","desc":"2031년 10억 달러 AR, SaaS 비중 93.5%, GP 73.2%, 로봇 14,590대 디플로이를 핵심 KPI로 설정함."},{"id":"dec-gd-240","class":"Decision","label":"로봇 번들 포함 통합 솔루션 제공 추진","desc":"SI 채널의 소프트웨어 라이선스 판매만으로는 한계가 있어 로봇 번들 포함 통합 솔루션을 제공하기로 함."},{"id":"dec-gd-241","class":"Decision","label":"의사결정 중심 미팅·커뮤니케이션 프로토콜 개선","desc":"미팅을 현황 보고 중심에서 C레벨 의사결정·리스크(Red Flag) 논의 중심으로 전환하고 사전 슬랙 공유로 효율화하기로 함."},{"id":"dec-gd-242","class":"Decision","label":"생산적 금융 펀드 활용 방안 검토","desc":"국민성장펀드·자체 투자 재원을 에쿼티·대출로 확보할 가능성을 타진하고 볼커룰 등 법률 검토를 병행하기로 함."},{"id":"dec-gd-243","class":"Decision","label":"모델 라이센스 비중 확대 수익 구조 개편 확정","desc":"하드웨어보다 모델 라이센스 매출 비중을 높이고 로봇은 리스형 분할 매출로 반영하는 재무 모델 개편을 확정함."},{"id":"dec-gd-244","class":"Decision","label":"대외 명칭 'RFM 라이센스' 대신 '모델 라이센스' 사용","desc":"외부에서 이해하기 쉽도록 RFM 라이센스 대신 모델 라이센스라는 명칭을 사용하기로 함."},{"id":"dec-gd-245","class":"Decision","label":"GPU·장비 구매 예산 현실적 하향 조정","desc":"GPU 비용과 로봇·장비 구매 예산을 실사용 기준의 현실적 수준으로 하향 조정하기로 함."},{"id":"dec-gd-246","class":"Decision","label":"경쟁사 대비 25~50% 가격 정책으로 시장 우위 확보","desc":"Skild·Physical Intelligence 등 미국 경쟁사 대비 25~50% 수준의 합리적 가격으로 경쟁 우위를 확보하기로 함."},{"id":"dec-gd-247","class":"Decision","label":"하반기 핵심 파트너 2~3곳 선정 및 관계 격상","desc":"시리즈 A 유치를 위해 일본 대기업 중 2~3개 핵심 파트너를 선정해 관계를 격상하고 성공 사례를 만들기로 함."},{"id":"dec-gd-248","class":"Decision","label":"로봇 속도 개선·95% 성공률 달성을 최우선 과제로 선정","desc":"고객 피드백을 바탕으로 로봇 동작 속도 개선과 95% 이상 성공률 달성을 최우선 순위 과제로 선정함."},{"id":"dec-gd-249","class":"Decision","label":"상업 배포 방지 라이선스 구조·사용량 추적 수단 정의","desc":"모델 판매 시 통제되지 않은 배포를 막기 위해 라이선스 구조를 정의하고 로봇·태스크 사용량 추적 감사 수단을 마련하기로 함."},{"id":"dec-gd-250","class":"Decision","label":"모델·플랫폼 통합 로드맵 작성 및 모듈 리더 중심 회의체 운영","desc":"비즈니스 요구를 반영한 통합 로드맵을 작성하고 초기에는 모듈 리더 중심의 잦은 회의체로 부서 간 소통을 운영하기로 함."},{"id":"dec-gd-251","class":"Decision","label":"AX 디바이스 국책과제 참여 및 단계적(1차 GPU 혼용→2차 MPU 확대) 구현 전략 설정","desc":"1차년도 시제품·POC 검증, 2차년도 상용화를 목표로 하되 MPU 연산 제약을 고려해 1차년도는 GPU 혼용 방식으로 추진하기로 함."},{"id":"dec-gd-252","class":"Decision","label":"국책과제 선정을 위한 표준화된 평가 기준·의사결정 프레임워크 수립","desc":"기술 로드맵 정렬·예산 규모를 고려한 표준 평가 기준을 마련하고, 실익 없는 과제를 걸러내는 필터링 구조를 수립하기로 함."},{"id":"dec-gd-253","class":"Decision","label":"인건비·기회비용 반영 프라이싱 전략으로 손실 과제 배제","desc":"인건비와 기회비용을 반영한 프라이싱으로 손실을 방지하고, 손실 나는 과제는 과감히 거절하는 원칙을 재확인함."},{"id":"dec-gd-254","class":"Decision","label":"소프트웨어 공통 모듈 설계·지식 자산화 추진","desc":"제로베이스 개발의 비효율을 줄이기 위해 소프트웨어 공통 모듈을 설계·재사용하고 개인 노하우를 플랫폼에 통합해 자산화하기로 함."},{"id":"dec-gd-255","class":"Decision","label":"프로젝트 자료 공유 및 접근 경로 정리","desc":"팀 프로젝트 자료·채팅방 경로 혼선을 해결하고 카카오톡 단체방에 관련 자료를 공유하기로 함."},{"id":"dec-gd-256","class":"Decision","label":"삼성 반도체 부문 투자 유치 체결 및 공식 PR 미진행","desc":"삼성 반도체 부문의 AI 스타트업 투자 건을 체결하고, 삼성 요청에 따라 공식 PR은 진행하지 않기로 함."},{"id":"dec-gd-257","class":"Decision","label":"Physics Sim Lab 지분 취득 및 관계사 설정","desc":"신진우 교수가 어드바이저인 Physics Sim Lab 지분을 취득하여 관계사로 설정, 시뮬레이션 기술 협력 추진."},{"id":"dec-gd-258","class":"Decision","label":"고용 계약서에 발명 조항 및 발명자 보상 명확화","desc":"향후 투자 유치 증빙을 위해 고용 계약서에 발명 관련 조항과 발명자 보상 내용을 명확히 포함하기로 함."},{"id":"dec-gd-259","class":"Decision","label":"RealDex 이미지 버전 공개 및 연구자 커뮤니티 홍보","desc":"RealDex 이미지 버전을 공개하고 X, 디스코드 커뮤니티를 통해 관련 연구자들에게 적극 홍보하기로 함."},{"id":"dec-gd-260","class":"Decision","label":"텔레오퍼레이션 프로토타입 R&D 독푸딩 진행","desc":"텔레오퍼레이션 프로토타입의 내부 고객을 R&D로 설정하여 독푸딩을 진행하고 평가 루프를 구성하기로 함."},{"id":"dec-gd-261","class":"Decision","label":"하드웨어 벤더 표준 계약 가이드라인 수립","desc":"위로보틱스 등 하드웨어 벤더와의 계약 시 유지보수, 수리 조항을 포함한 표준 계약 가이드라인을 수립하기로 함."},{"id":"dec-gd-262","class":"Decision","label":"KCCV 등 학회 스폰서십 즉시 진행","desc":"채용 확대를 위해 KCCV 등 학회에 스폰서로 참여하는 전략을 즉시 진행하기로 지시함."},{"id":"dec-gd-263","class":"Decision","label":"LG이노텍 성능 문제 직접 최적화 솔루션 제공","desc":"고객이 직접 해결하기보다 우리가 직접 최적화 솔루션을 제공하여 기술적 우위를 증명하기로 지시함."},{"id":"dec-gd-264","class":"Decision","label":"일본 RDI 로봇 장비 추가 구매","desc":"하반기 KDI, TMIP, Askul 등 고객 대응을 위해 RDI 장비 1~2대를 추가 구매하기로 함."},{"id":"dec-gd-265","class":"Decision","label":"AWS 기술 협력 범위 7월 14일까지 구체화","desc":"AWS와 상호 만족할 협력 범위를 7월 14일 팀 회의에서 구체화하기로 함."},{"id":"dec-gd-266","class":"Decision","label":"모델 팀 전사 워크샵 7월 내 개최 및 정례화","desc":"모델 팀 및 플랫폼 팀 업무를 전사에 전달하기 위해 워크샵을 정례화하고 7월 내 모델 팀 워크샵을 개최하기로 함."},{"id":"dec-gd-267","class":"Decision","label":"미국 시장 시연(데모) 전략 수립","desc":"경쟁 심화에 대응해 우수 기술력 데모로 시장 관심을 유도하는 시연 전략을 C레벨과 논의하기로 함."},{"id":"dec-gd-268","class":"Decision","label":"위클리 노트 공유 범위 및 회의 운영 방식 결정","desc":"위클리 노트의 민감 정보 관리와 인턴 포함 여부 등은 순화와 투명성 사이 균형을 맞춰 결정하기로 함."},{"id":"dec-gd-269","class":"Decision","label":"모델 팀 운영 체계 수립 및 업무 가시화 방향 설정","desc":"모델 팀이 비전, 미션과 주 단위 플래닝 체계를 구축하고 인력 자원 배분을 시각화하여 공유하기로 함."},{"id":"dec-gd-270","class":"Decision","label":"일본 AIRO 프로젝트 7월 데모 진행 및 하반기 POC 공급 확대","desc":"일본 AIRO 대상 7월 데모로 데이터를 수집하고, 결과에 따라 하반기 POC 및 로봇 공급을 확대하기로 함."},{"id":"dec-gd-271","class":"Decision","label":"레인보우와 하드웨어 설계 단계 협력 파트너십 추진","desc":"단순 구매를 넘어 2027~2028년 상용 배포 대비 하드웨어 설계 단계부터 긴밀히 협력하는 파트너십을 제안함."},{"id":"dec-gd-272","class":"Decision","label":"하드웨어 공급 단가 정책 재검토","desc":"로봇 대량 구매 및 내부 R&D 목적의 하드웨어 공급 단가 정책을 다시 검토하여 제안하기로 함."},{"id":"dec-gd-273","class":"Decision","label":"미국 법인 2030년 10억 달러 매출 목표 설정 및 성장 곡선 재설정","desc":"2028년 1억 달러, 2030년 10억 달러 달성을 목표로 성장 곡선을 다시 설정하기로 함."},{"id":"dec-gd-274","class":"Decision","label":"매출을 우선 지표로, ARR을 보조 지표로 관리","desc":"비즈니스 계획 주요 지표로 매출을 우선하고 ARR은 별도 보조 지표로 표기, 매출이 ARR을 후행하는 구조로 관리하기로 함."},{"id":"dec-gd-275","class":"Decision","label":"한국·일본 매출을 미국 수치에 맞춰 재조정","desc":"미국이 제공한 총 매출 기준으로 한국·일본의 매출 비중을 재조정하고 내부적으로 일치시키기로 함."},{"id":"dec-gd-276","class":"Decision","label":"정부 지원 GPU·국책 사업을 기타 매출·비용절감 항목으로 구분 기록","desc":"정부 지원 GPU 등을 기타 매출 혹은 비용 절감 항목으로 명확히 구분하여 기록하기로 함."},{"id":"dec-gd-277","class":"Decision","label":"데이터룸 마감 24일, 22일까지 경영진 정렬 완료","desc":"데이터룸 자료 마감일을 24일로 설정하고 실무는 20일, 경영진 정렬은 22일까지 완료하기로 함."},{"id":"dec-gd-278","class":"Decision","label":"라이선스 제품은 SI 협력 제공, 미국은 SI 비중 높게 가정","desc":"제품을 서비스형 소프트웨어와 라이선스로 구분하고, 라이선스는 SI와 협력해 제공하며 미국은 SI 비중을 높게 가정함."},{"id":"dec-gd-279","class":"Decision","label":"삼성 LSI 사업부 투자 확정 및 대외비 유지","desc":"삼성 LSI 사업부 투자가 확정됐으며, 정확한 가이드라인 수령 전까지 대외비로 유지하고 외부 언급을 자제하기로 함."},{"id":"dec-gd-280","class":"Decision","label":"업무 가시성 확보용 대시보드·트래커 도입","desc":"전체 조직 업무 현황과 담당자를 파악하기 위해 개인별 업무·프로젝트 트래커(대시보드·간트 차트)를 도입하기로 함."},{"id":"dec-gd-281","class":"Decision","label":"텔레오퍼레이션 시스템 내부 고객 R&D 설정 및 도구 푸딩 도입","desc":"텔레오퍼레이션 사용성 개선의 내부 고객을 R&D로 명확히 설정하고 플랫폼 팀에 도구 푸딩을 도입하기로 함."},{"id":"dec-gd-282","class":"Decision","label":"시리즈 A 데이터룸 일정 10일에서 24일로 연기","desc":"재무 작업 등을 고려하여 시리즈 A 데이터룸 작업 일정을 기존 10일에서 24일로 연기함."},{"id":"dec-gd-283","class":"Decision","label":"발명자 보상 조항 근로계약서에 명확화","desc":"발명자 보상 관련 규정을 근로 계약서 등에 명확히 정리하여 지재권 보상 및 권리 관계를 확실히 하기로 함."},{"id":"dec-gd-284","class":"Decision","label":"하드웨어 플랫폼 확장 검토 및 어퍼바디 평가 로드맵 수립","desc":"기존 Rainbow RBY1 외 덱스메이트 등 다양한 플랫폼을 확장 검토하고 어퍼바디 평가로 최적 세팅 로드맵을 수립하기로 함."},{"id":"dec-gd-285","class":"Decision","label":"내부 E2E 역량 우선 확보 후 SI 활용, 2027년까지 범용 자동화 집중","desc":"엔드투엔드 역량을 먼저 확보한 상태에서 SI 파트너를 활용하는 구조를 지향하고, 2027년까지 특정 영역 범용 자동화에 집중하기로 함."},{"id":"dec-gd-286","class":"Decision","label":"미국 AWS 로드쇼 데모 R&D 팀 8~10월 지원","desc":"미국 AWS 로드쇼 데모 지원 요청에 대해 R&D 팀이 8월부터 10월까지 지원하기로 함."},{"id":"dec-gd-287","class":"Decision","label":"격주 회의를 금요일 오전 11시로 변경","desc":"월요일 주간 회의 부담을 줄이기 위해 격주 회의 시간을 금요일 오전 11시로 변경하기로 함."},{"id":"dec-gd-288","class":"Decision","label":"시즌2 보고 체계 내부/외부 이원화 및 큐레이션 방식 도입","desc":"시즌2 보고 체계를 내부(성과 중심)와 외부(테마 기반 크루 큐레이션)로 분리하고 딥다이브 큐레이션 방식을 도입하기로 함."},{"id":"dec-gd-289","class":"Decision","label":"도메인별 크루를 자원자 중심으로 구성","desc":"콘텐츠 큐레이션·리서치 크루를 도메인별로 구성하되 탑다운 지시보다 자원자를 우선 모집하여 동기를 유도하기로 함."},{"id":"dec-gd-290","class":"Decision","label":"버추얼 랩 중요 성과 위주 선택적 공유","desc":"버추얼 랩 서브 그룹의 모든 내용을 매주 요약하기보다 유의미한 성과·중요 사항만 선별해 공유하기로 함."},{"id":"dec-gd-291","class":"Decision","label":"모델 팀 결과 중심 성과 공유","desc":"모델 팀은 추상적 과정 설명보다 개선된 성공률·기능적 산출물 등 명확한 결과 위주로 공유해 팀 간 이해도를 높이기로 함."},{"id":"dec-gd-292","class":"Decision","label":"지원자 인턴 채용 절차 진행","desc":"2차 인터뷰에서 지원자 역량과 10~11월 근무 가능성을 확인하고 인턴십 합류 및 정규직 전환 가능성을 검토, 채용 절차를 이어가기로 함."},{"id":"dec-gd-293","class":"Decision","label":"운영 확장에 외주 업체 활용 및 예산 3~5% 버퍼 추가","desc":"내부 인력만으로는 효율 한계가 있어 운영 확장이 필요한 부분은 외주 업체를 활용하고 예산에 3~5% 버퍼 항목을 추가하기로 함."},{"id":"dec-gd-294","class":"Decision","label":"수익성 분석에 GPU 학습 비용 포함","desc":"RaaS·라이선스 모델의 정확한 수익성 분석을 위해 GPU 학습 비용을 반드시 포함하여 계산하기로 합의함."},{"id":"dec-gd-295","class":"Decision","label":"2027년 한국 매출 목표 하향 및 2028년 이후 성장 집중","desc":"2027년 한국 매출 목표를 5.6백만에서 4.5백만으로 하향하고 미국은 상향, 단기보다 2028년 이후 급성장에 초점을 맞추기로 함."},{"id":"dec-lw-001","class":"Decision","label":"2028 배포 우선 태스크 유형 확정(속도·정형 오브젝트 중심)","desc":"2028 배포 관점에서 정밀도보다 속도가 빠르고 정형 오브젝트를 다루는 태스크
